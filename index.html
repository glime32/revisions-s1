/* ---------- dates ---------- */
function NOW(){const q=new URLSearchParams(location.search);const f=q.get("date"),t=q.get("heure");if(f&&/^\d{4}-\d\d-\d\d$/.test(f)){const[y,m,d]=f.split("-").map(Number);const[h,mi]=(t||"08:00").split(":").map(Number);return new Date(y,m-1,d,h,mi);}return new Date();}
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(NOW());
const toD=(day,min)=>{const[y,m,d]=day.split("-").map(Number);return new Date(y,m-1,d,Math.floor(min/60),min%60);};
const mm=s=>{const[h,m]=s.split(":").map(Number);return h*60+m;};
const hh=min=>`${Math.floor(min/60)}h${String(min%60).padStart(2,"0")}`.replace(/h00$/,"h");
const hm=min=>{min=Math.round(min/5)*5;const h=Math.floor(min/60),m=min%60;return h?`${h} h${m?" "+String(m).padStart(2,"0"):""}`:`${m} min`;};
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"],MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function dayName(s,cap,short){const[y,m,d]=s.split("-").map(Number),D=new Date(y,m-1,d);const t=short?`${JOURS[D.getDay()].slice(0,3)}. ${d}`:`${JOURS[D.getDay()]} ${d} ${MOIS[m-1]}`;return cap?t.charAt(0).toUpperCase()+t.slice(1):t;}

function jx(S){const e=exam(S),n=NOW(),k=Math.round((toD(e.day,0)-toD(ymd(n),0))/864e5);return k>1?`J-${k}`:k===1?"demain":k===0?(n<examStart(S)?"aujourd'hui":"passé"):"passé";}

const activeQuiz=S=>S.quiz.filter(q=>!(q.link&&S.BY[q.link]&&S.BY[q.link].out));
const quizGoal=(S,t)=>{const n=activeQuiz(S).length;return t.quiz<=1?Math.ceil(t.quiz*n):Math.min(t.quiz,n);};
function isDone(sid,t){const st=ST[sid];if(t.items)return t.items.every(id=>st.known[id]);if(t.td)return t.td.every(x=>st.td[x]);if(t.quiz)return st.best>=quizGoal(SUBJ[sid],t)||!!st.tasks[t.id];return !!st.tasks[t.id];}
function doneOn(sid,t){const st=ST[sid];if(t.items)return t.items.map(id=>st.knownOn[id]||"").sort().pop();if(t.td)return t.td.map(x=>st.tdOn[x]||"").sort().pop();if(t.quiz)return st.quizOn||st.tasks[t.id]||"";return st.tasks[t.id]||"";}

const CLASSES={
 "2026-11-09":[["08:00","09:45","Géométrie","CM, amphi 5.03","geo"],["10:00","11:30","Algèbre","TD 2.02"],["11:30","13:00","Géométrie","TD 5.207","geo"],["15:00","16:30","Algorithmique 1","CM, amphi 5.01","algo"],["16:45","18:15","Prog. fonctionnelle","TD 5.201","pf"]],
 "2026-11-10":[["08:00","09:30","Analyse","TD 5.207"],["11:30","13:00","Calculus","TD 5.205","calc"],["15:00","16:30","Automates","CM, amphi 5.01"],["16:45","18:15","Calculus","TD 36.302","calc"]],
 "2026-11-11":[],
 "2026-11-12":[["08:00","09:30","Géométrie","TD 5.211","geo"],["10:00","11:30","Calculus","TD 5.207","calc"],["11:30","13:00","Algèbre","CM, amphi 5.01"],["15:00","16:30","Algorithmique 1","TD 5.212","algo"],["16:45","18:15","Algorithmique 1","TD 5.212","algo"]],
 "2026-11-13":[["08:00","09:30","Automates","TD 2.09"],["10:00","11:30","Prog. fonctionnelle","CM, amphis 5.03 et 5.01","pf"],["11:30","13:00","Prog. fonctionnelle","TD 5.130","pf"],["15:00","16:30","Calculus","amphi 5.01","calc"]]};
const HOLIDAY={"2026-11-11":"11 novembre, férié"};
const WIN=[[480,750],[840,1140],[1200,1350]];/* 8h-12h30, 14h-19h, 20h-22h30 */
function busyOf(day){
  const b=[];(CLASSES[day]||[]).forEach(c=>{const isExam=SIDS.some(id=>{const e=exam(SUBJ[id]);return e.day===day&&Math.abs(mm(e.start)-mm(c[0]))<=20;});if(!isExam)b.push([mm(c[0]),mm(c[1])]);});
  SIDS.forEach(id=>{const e=exam(SUBJ[id]);if(e.day===day)b.push([mm(e.start)-30,mm(e.end)+10]);});
  return b.sort((x,y)=>x[0]-y[0]);
}
function dayCap(day){const[y,m,d]=day.split("-").map(Number),dw=new Date(y,m-1,d).getDay();const free=dw===0||dw===6||HOLIDAY[day];const R={leger:[240,120,150],normal:[360,180,210],intensif:[480,240,300]}[hub.rythme||"normal"]||[360,180,210];return free?R[0]:(CLASSES[day]&&CLASSES[day].length?R[1]:R[2]);}
function freeBlocks(day,from){
  let iv=[];WIN.forEach(([a,b])=>{a=Math.max(a,from);if(b-a>=30)iv.push([a,b]);});
  busyOf(day).forEach(([s,e])=>{const out=[];iv.forEach(([a,b])=>{if(e+10<=a||s-10>=b){out.push([a,b]);return;}if(s-10-a>=30)out.push([a,s-10]);if(b-(e+10)>=30)out.push([e+10,b]);});iv=out;});
  const blocks=[];iv.forEach(([a,b])=>{let t=a;while(b-t>=30){const len=Math.min(90,b-t);blocks.push([t,t+len]);t+=len+10;}});
  let cap=dayCap(day);const res=[];for(const[a,b]of blocks){if(cap<30)break;const len=Math.min(b-a,cap);res.push([a,a+len]);cap-=len;}
  return res;
}

/* ---------- le plan de la semaine ---------- */
function pendingTasks(sid){return SUBJ[sid].tasks.filter(t=>!isDone(sid,t));}
function buildPlan(){
  const n=NOW(),t0=ymd(n),nowMin=n.getHours()*60+n.getMinutes();
  const active=SIDS.filter(id=>examStart(SUBJ[id])>n&&pendingTasks(id).length);
  const plan={day:t0,blocks:[],assign:{},bonus:{}};
  if(!active.length)return plan;
  const lastDay=ymd(new Date(Math.max(...active.map(id=>examStart(SUBJ[id]).getTime()))));
  let blocks=[];for(let d=t0;d<=lastDay;d=addDays(d,1)){freeBlocks(d,d===t0?Math.ceil((nowMin+10)/5)*5:0).forEach(([a,b])=>blocks.push({day:d,start:a,end:b}));}
  const dl=id=>examStart(SUBJ[id]).getTime();
  /* 1. Ce qu'on garde : l'essentiel de chaque matière d'abord, puis l'important à tour de rôle (coefficient le plus fort en premier),
        tant que tout tient avant chaque CC (avec 8 % de marge). Le reste devient facultatif. */
  const all=[];active.forEach(id=>{const P=pendingTasks(id),rank={};P.forEach(t=>{rank[t.p]=(rank[t.p]||0);all.push({id,t,r:t.last?-1:rank[t.p]++});});/* quiz et fiches en rouge (courts, la veille du CC) gardés en premier */});
  all.sort((a,b)=>(a.t.p-b.t.p)||(a.r-b.r)||(weight(SUBJ[b.id])-weight(SUBJ[a.id])));
  const dls=[...new Set(active.map(dl))].sort((a,b)=>a-b),cap={},load={};
  dls.forEach(D=>{cap[D]=blocks.reduce((s,b)=>toD(b.day,b.end).getTime()<=D?s+(b.end-b.start):s,0)*0.92;load[D]=0;});
  const keep=new Set();
  all.forEach(({id,t})=>{const d=dl(id);if(dls.every(D=>D<d||load[D]+t.min<=cap[D])){keep.add(id+":"+t.id);dls.forEach(D=>{if(D>=d)load[D]+=t.min;});}});
  /* 2. File d'attente de chaque matière, dans l'ordre du cours ; quiz et fiches en rouge à la fin */
  const Q={};active.forEach(id=>{const P=pendingTasks(id).filter(t=>keep.has(id+":"+t.id));Q[id]=P.filter(t=>!t.last).concat(P.filter(t=>t.last));plan.bonus[id]=pendingTasks(id).filter(t=>!keep.has(id+":"+t.id)).map(t=>t.id);});
  /* 3. Affectation créneau par créneau : la matière la plus en retard sur son temps restant (bonus de coefficient).
        Une étape ne va que dans un créneau assez long. Le quiz et les fiches en rouge attendent les 30 h avant le CC. */
  const fitsIn=(t,room)=>t.min<=room+15;
  const fill=(id,B,dur,src,finalWin)=>{let used=0;const tk=[];for(const t of src[id].slice()){if(t.last&&!finalWin)continue;if(!fitsIn(t,dur-used))continue;tk.push(t);used+=t.min;src[id].splice(src[id].indexOf(t),1);if(used>=dur-10)break;}return{tk,used};};
  const place=(i,best,tk,used,dur,extra)=>{const B=blocks[i];B.sid=best;B.tasks=tk.map(t=>t.id);if(extra)B.extra=true;const full=B.end;B.end=Math.min(full,B.start+Math.max(used,30));
    tk.forEach(t=>plan.assign[best+":"+t.id]=plan.blocks.length);plan.blocks.push(B);if(full-B.end>=35)blocks.splice(i+1,0,{day:B.day,start:B.end+5,end:full});};
  const freeIdx=[];
  for(let i=0;i<blocks.length;i++){
    const B=blocks[i],bs=toD(B.day,B.start).getTime(),be=toD(B.day,B.end).getTime(),dur=B.end-B.start;
    let best=null,bestScore=-1;
    active.forEach(id=>{if(!Q[id].length||be>dl(id))return;
      const finalWin=dl(id)-bs<=30*3600e3;
      const elig=Q[id].filter(t=>(!t.last||finalWin));if(!elig.some(t=>fitsIn(t,dur)))return;
      let avail=0;for(let j=i;j<blocks.length;j++){const e=toD(blocks[j].day,blocks[j].end).getTime();if(e<=dl(id))avail+=blocks[j].end-blocks[j].start;}
      const rem=elig.reduce((s,t)=>s+t.min,0);
      let sc=rem/Math.max(avail,1)*(1+0.3*weight(SUBJ[id])/WMAX);
      if(finalWin&&Q[id].some(t=>t.last))sc+=0.6;
      if(sc>bestScore){bestScore=sc;best=id;}});
    if(!best){freeIdx.push(i);continue;}
    const {tk,used}=fill(best,B,dur,Q,dl(best)-bs<=30*3600e3);
    if(!tk.length){freeIdx.push(i);continue;}
    place(i,best,tk,used,dur,false);
  }
  /* 4. Créneaux restés libres : on y place les étapes facultatives encore utiles avant leur CC */
  const BQ={};active.forEach(id=>{BQ[id]=(plan.bonus[id]||[]).map(tid=>SUBJ[id].TB[tid]).concat(Q[id]).sort((x,y)=>(x.p-y.p)||(x.i-y.i));Q[id]=[];});
  for(let i=0;i<blocks.length;i++){const B=blocks[i];if(B.sid)continue;const bs=toD(B.day,B.start).getTime(),be=toD(B.day,B.end).getTime(),dur=B.end-B.start;
    /* d'abord l'étape la plus importante (p le plus petit), puis la matière au plus fort coefficient dont le CC est le plus proche */
    let best=null,bestScore=-1;active.forEach(id=>{if(!BQ[id].length||be>dl(id))return;const f=BQ[id].filter(t=>!t.last&&fitsIn(t,dur));if(!f.length)return;const sc=(4-Math.min(...f.map(t=>t.p)))*100+weight(SUBJ[id])/Math.max(1,(dl(id)-bs)/864e5);if(sc>bestScore){bestScore=sc;best=id;}});
    if(!best)continue;const {tk,used}=fill(best,B,dur,BQ,false);if(tk.length)place(i,best,tk,used,dur,true);}
  plan.blocks.sort((x,y)=>x.day<y.day?-1:x.day>y.day?1:x.start-y.start);
  plan.assign={};plan.blocks.forEach((B,k)=>B.tasks.forEach(tid=>plan.assign[B.sid+":"+tid]=k));
  active.forEach(id=>{plan.bonus[id]=BQ[id].map(t=>t.id);if(!plan.bonus[id].length)delete plan.bonus[id];});
  return plan;
}
function plan(force){if(force||!hub.plan||hub.plan.day!==today()||hub.plan.v!==6){hub.plan=buildPlan();hub.plan.v=6;saveHub();}return hub.plan;}

  return h;

/* ---------- une étape du plan ---------- */
function taskHTML(sid,t,full){
  const S=SUBJ[sid],st=ST[sid],done=isDone(sid,t);let meta=[hm(t.min)],go="",chips="";
  const L=x=>x.startsWith("#")?x:`#/${sid}/${x}`;
  if(t.items){const k=t.items.filter(id=>st.known[id]).length,r=t.items.filter(id=>st.review[id]).length;meta.push(`${k} sur ${t.items.length} fiches sues`);if(r)meta.push(`<span class="r">${r} en rouge</span>`);const nx=t.items.find(id=>!st.known[id]);if(nx&&!done)go=`<a class="btn pri go" href="#/${sid}/c/${nx}">${k?"Continuer":"Commencer"}</a>`;if(full)chips=`<div class="chips">${t.items.map(id=>chip(sid,id)).join("")}</div>`;}
  if(t.td){const k=t.td.filter(x=>st.td[x]).length;meta.push(`${k} sur ${t.td.length} exercices sus`);}
  if(t.quiz)meta.push(`objectif ${quizGoal(S,t)} sur ${activeQuiz(S).length}, meilleur score : ${st.best}`);
  if(t.review){const R=S.ORDER.filter(c=>st.review[c.id]);meta.push(R.length?`<span class="r">${R.length} fiche(s) en rouge</span>`:"aucune fiche en rouge");if(full&&R.length)chips=`<div class="chips">${R.map(c=>chip(sid,c.id)).join("")}</div>`;}
  if(t.links&&!done&&!go)go=`<a class="btn pri go" href="${L(t.links[0][0])}">Ouvrir</a>`;
  if(full&&t.links&&t.links.length>1)chips+=`<div class="chips">${t.links.map(l=>`<a class="chip" href="${L(l[0])}">${l[1]}</a>`).join("")}</div>`;
  const auto=!t.manual;
  return `<li class="task${done?" done":""}"><button class="tick" ${auto?"disabled":`data-task="${sid}:${t.id}"`} title="${auto?"Se coche toute seule quand les fiches ou exercices sont sus":"Cocher"}" aria-label="${auto?"Se coche toute seule":"Cocher l'étape"}">${done?"✓":""}</button><div><div class="tt">${t.t}</div><div class="meta">${meta.join(", ")}</div>${t.why&&full&&!done?`<div class="meta">${t.why}</div>`:""}${chips}</div>${go}</li>`;
}
function bindTicks(root,rerender){root.querySelectorAll("[data-task]").forEach(b=>b.addEventListener("click",()=>{const[sid,id]=b.dataset.task.split(":");const st=ST[sid];if(st.tasks[id])delete st.tasks[id];else st.tasks[id]=today();save(sid);rerender();renderSide();}));}
function blockHTML(B,full){const S=SUBJ[B.sid];return `<div class="blk" style="--sc:${S.color}"><div class="blk-h"><b>${hh(B.start)} – ${hh(B.end)}</b><a href="#/${B.sid}">${S.name}</a><span class="muted">${hm(B.end-B.start)}</span></div><ol class="todo">${B.tasks.filter(tid=>S.TB[tid]).map(tid=>taskHTML(B.sid,S.TB[tid],full)).join("")}</ol></div>`;}

/* ---------- accueil : aujourd'hui ---------- */

  body+=`<div class="examcard" style="--sc:var(--cobalt)"><div><b>Commence chaque séance par l'entraînement mélangé</b> : 10 questions de toutes tes matières, surtout ton prochain CC et ce que tu rates, environ 10 minutes. ${hub.mixOn===t0?`Fait aujourd'hui : ${hub.mixScore} sur 10.`:"Pas encore fait aujourd'hui."}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn pri" href="#/mix">Commencer</a><a class="btn" href="#/methode">Pourquoi ça marche</a></div></div>`;
  body+=sec(1,"Aujourd'hui",tb.length?`<p class="muted">${tb.length} créneau(x), environ ${hm(tb.reduce((s,b)=>s+b.end-b.start,0))} de révision, placés autour de tes cours. Les étapes de fiches se cochent toutes seules quand tu marques les fiches « Je sais ».</p>${tb.map(b=>blockHTML(b,true)).join("")}`:`<p class="muted">Aucun créneau de révision prévu aujourd'hui. ${P.blocks.length?"Regarde les jours suivants.":"Tout est fait, ou tous les CC sont passés."}</p>`);
  const days=[...new Set(P.blocks.map(b=>b.day))].filter(d=>d>t0);
  if(days.length)body+=sec(2,"Les jours suivants",days.map(d=>{const L=P.blocks.filter(b=>b.day===d);const ex=SIDS.map(id=>SUBJ[id]).filter(S=>exam(S).day===d);
    return `<details class="day"><summary><b>${dayName(d,true)}</b><span>${ex.length?`<span class="r">CC : ${ex.map(S=>S.name).join(", ")}</span>, `:""}${L.length} créneau(x), ${hm(L.reduce((s,b)=>s+b.end-b.start,0))}</span></summary><div style="padding:0 12px 12px;display:grid;gap:10px">${L.map(b=>blockHTML(b,false)).join("")}</div></details>`;}).join(""));
  const bon=Object.entries(P.bonus);
  if(bon.length)body+=sec(days.length?3:2,"Si tu as encore du temps",`<p class="muted">Il reste plus de travail que de créneaux. Ces étapes rapportent le moins : elles passent après. Fais-les quand un créneau est fini en avance.</p>${bon.map(([sid,L])=>`<details class="day"><summary><b>${SUBJ[sid].name}</b><span>${L.length} étape(s)</span></summary><ol class="todo" style="padding:0 12px 12px">${L.map(id=>taskHTML(sid,SUBJ[sid].TB[id],false)).join("")}</ol></details>`).join("")}`);
  const cards=SIDS.map(id=>{const S=SUBJ[id],T=S.tasks,d=T.filter(t=>isDone(id,t)).length,r=S.ORDER.filter(c=>ST[id].review[c.id]).length,e=exam(S);
    return `<a class="mcard" href="#/${id}" style="--sc:${S.color}"><span class="mname">${S.name}</span><span class="muted">${S.code}</span><span>CC ${dayName(e.day,false,true)} à ${e.start.replace(":","h")}, <b>${jx(S)}</b></span><span class="muted">Coef ${S.coef}, ce CC compte pour ${Math.round(S.share*100)} % : poids ${String(weight(S).toFixed(2)).replace(".",",")}</span><div class="bar"><i style="width:${d/T.length*100}%;background:${S.color}"></i></div><span class="muted">${d} étape(s) sur ${T.length}${r?`, <span class="r">${r} en rouge</span>`:""}</span></a>`;}).join("");

   <section class="mcards">${cards}</section>${body}
   <p class="muted" style="font-size:.9rem">Créneaux pris entre 8h et 22h30, hors cours, repas et trajets, au rythme « ${{leger:"léger",normal:"normal",intensif:"intensif"}[hub.rythme||"normal"]} » (modifiable dans <a href="#/examens">Examens et coefficients</a>). <a href="#/edt">Voir l'emploi du temps</a> <button class="btn" id="replan">Recalculer maintenant</button></p></div>`;

/* ---------- emploi du temps ---------- */
function edt(){
  const P=plan(),t0=today();const last=SIDS.map(id=>exam(SUBJ[id]).day).sort().pop();
  const days=[];for(let d=t0;d<=last&&days.length<9;d=addDays(d,1))days.push(d);
  const H0=7*60+30,H1=23*60,PX=0.78;
  const col=d=>{let s="";(CLASSES[d]||[]).forEach(c=>{const isEx=SIDS.some(id=>{const e=exam(SUBJ[id]);return e.day===d&&Math.abs(mm(e.start)-mm(c[0]))<=20;});if(isEx)return;s+=`<div class="ev cls" style="top:${(mm(c[0])-H0)*PX}px;height:${(mm(c[1])-mm(c[0]))*PX}px"><b>${c[2]}</b><span>${hh(mm(c[0]))}, ${c[3]}</span></div>`;});
    SIDS.forEach(id=>{const S=SUBJ[id],e=exam(S);if(e.day===d)s+=`<a class="ev exam" href="#/${id}" style="top:${(mm(e.start)-H0)*PX}px;height:${Math.max(40,(mm(e.end)-mm(e.start))*PX)}px"><b>CC ${S.name}</b><span>${hh(mm(e.start))}, ${e.place}</span></a>`;});
    P.blocks.filter(b=>b.day===d).forEach(b=>{const S=SUBJ[b.sid];const done=b.tasks.every(tid=>isDone(b.sid,S.TB[tid]));s+=`<a class="ev rev${done?" done":""}" href="#/${b.sid}" style="--sc:${S.color};top:${(b.start-H0)*PX}px;height:${(b.end-b.start)*PX}px"><b>${S.name}</b><span>${hh(b.start)}–${hh(b.end)}${done?", fait":""}</span></a>`;});
    return s;};
  let hours="";for(let h=8;h<=22;h++)hours+=`<span style="top:${(h*60-H0)*PX}px">${h}h</span>`;
  $("#main").innerHTML=`<div class="page" style="max-width:1280px"><div class="title-row"><h1>Emploi du temps de la semaine</h1></div>
   <p class="lead">Tes cours (gris), tes CC (rouge) et les créneaux de révision placés dans les trous (couleur de la matière). Clique sur un créneau pour ouvrir la matière.</p>
   <div class="edt-legend">${SIDS.map(id=>`<span><i class="sdot" style="background:${SUBJ[id].color}"></i>${SUBJ[id].name}</span>`).join("")}<span><i class="sdot" style="background:var(--graphite)"></i>cours</span><span><i class="sdot" style="background:var(--rouge)"></i>CC</span></div>
   <div class="edt-wrap"><div class="edt" style="grid-template-columns:44px repeat(${days.length},minmax(128px,1fr));min-width:${44+days.length*128}px"><div></div>${days.map(d=>`<div class="edt-h${d===t0?" today":""}">${dayName(d,true,true)}${HOLIDAY[d]?`<small>férié</small>`:""}</div>`).join("")}
    <div class="edt-hours" style="height:${(H1-H0)*PX}px">${hours}</div>${days.map(d=>`<div class="edt-col${HOLIDAY[d]?" hol":""}" style="height:${(H1-H0)*PX}px">${col(d)}</div>`).join("")}</div></div>
   <p class="muted" style="font-size:.9rem">L'emploi du temps vient de ta photo de la semaine du 9 novembre. Les heures de CC se modifient dans <a href="#/examens">Examens et coefficients</a>.</p></div>`;
}

/* ---------- examens et coefficients ---------- */
function examens(){
  const rows=SIDS.map(id=>{const S=SUBJ[id],e=exam(S);return `<tr><td><i class="sdot" style="background:${S.color}"></i> ${S.name}<br><span class="muted">${S.code}</span></td><td><input type="date" value="${e.day}" data-ex="${id}:day"> <input type="time" value="${e.start}" data-ex="${id}:start"><br><span class="muted">${e.place}, ${e.dur}</span>${e.unsure?`<br><span class="r">${e.unsure}</span>`:""}</td><td>${S.coef}</td><td>${Math.round(S.share*100)} %</td><td><b>${String(weight(S).toFixed(2)).replace(".",",")}</b></td><td>${S.docs}</td></tr>`;}).join("");
  $("#main").innerHTML=`<div class="page"><div class="title-row"><h1>Examens et coefficients</h1></div>
   <p class="lead">D'après le document officiel des modalités de contrôle 2026-2027 et les pages Moodle. Le poids d'un CC dans ta moyenne du semestre, c'est le coefficient de la matière multiplié par la part de ce CC dans sa note.</p>
   <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Matière</th><th>Date et heure du CC</th><th>Coef</th><th>Part du CC</th><th>Poids</th><th>Documents</th></tr></thead><tbody>${rows}</tbody></table></div>
   <section class="check"><h2 style="font-size:1.1rem">Ton rythme de révision</h2><p class="muted">Le temps de révision prévu au maximum par jour. Le plan se recalcule tout de suite.</p><div class="filters" id="ry">${[["leger","Léger : 4 h les jours libres, 2 h les jours de cours"],["normal","Normal : 6 h et 3 h"],["intensif","Intensif : 8 h et 4 h"]].map(r=>`<button class="btn" data-ry="${r[0]}" aria-pressed="${(hub.rythme||"normal")===r[0]}">${r[1]}</button>`).join("")}</div><p class="muted" id="ryout"></p></section>
   <section class="usage"><h2>Ce que ça change</h2><p>Les coefficients ne sont pas tous égaux : l'algorithmique et la programmation fonctionnelle (coef 5) pèsent plus que la géométrie (coef 4) et le calculus (coef 3). Le planificateur s'en sert pour départager deux matières aussi urgentes, et pour choisir quoi laisser tomber s'il manque du temps.</p><p>Si une heure de CC change, corrige-la dans le tableau : le plan se recalcule tout seul.</p></section></div>`;
  const ryOut=()=>{const P=plan(),tot=P.blocks.reduce((s,b)=>s+b.end-b.start,0),nb=Object.values(P.bonus).reduce((s,L)=>s+L.length,0);$("#ryout").textContent=`Avec ce rythme : ${hm(tot)} de révision prévues jusqu'au dernier CC, ${nb} étape(s) facultative(s) non placée(s).`;};ryOut();
  $("#ry").addEventListener("click",e=>{const b=e.target.closest("[data-ry]");if(!b)return;hub.rythme=b.dataset.ry;document.querySelectorAll("#ry [data-ry]").forEach(x=>x.setAttribute("aria-pressed",x===b));plan(true);ryOut();});
  $("#main").addEventListener("change",e=>{const k=e.target.dataset.ex;if(!k)return;const[id,f]=k.split(":");hub.exams[id]=Object.assign({},hub.exams[id],{[f]:e.target.value});plan(true);topInfo();renderSide();});
}

/* ---------- accueil d'une matière ---------- */
function subjHome(sid){
  const S=SUBJ[sid],P=plan(),t0=today(),e=exam(S),st=ST[sid];
  const mine=P.blocks.filter(b=>b.sid===sid);const days=[...new Set(mine.map(b=>b.day))];
  const bon=(P.bonus[sid]||[]).filter(id=>!isDone(sid,S.TB[id]));
  const done=S.tasks.filter(t=>isDone(sid,t));
  const planned=new Set(mine.flatMap(b=>b.tasks));const orphan=S.tasks.filter(t=>!isDone(sid,t)&&!planned.has(t.id)&&!bon.includes(t.id));
  let body=sec(1,"Ton programme",(days.length?days.map(d=>`<h3 style="margin-top:4px">${dayName(d,true)}${d===t0?" (aujourd'hui)":""}</h3>${mine.filter(b=>b.day===d).map(b=>blockHTML(b,d===t0)).join("")}`).join(""):`<p class="muted">Aucun créneau prévu pour cette matière${examStart(S)<NOW()?" : le CC est passé.":"."}</p>`)+(orphan.length?`<details class="day"><summary><b>Pas encore placé</b><span>${orphan.length} étape(s)</span></summary><ol class="todo" style="padding:0 12px 12px">${orphan.map(t=>taskHTML(sid,t,false)).join("")}</ol></details>`:""));
  let k=2;
  if(bon.length)body+=sec(k++,"Si tu as encore du temps",`<ol class="todo">${bon.map(id=>taskHTML(sid,S.TB[id],false)).join("")}</ol>`);
  if(done.length)body+=sec(k++,"Déjà fait",`<details class="day"><summary><b>${done.length} étape(s) terminée(s)</b><span>clique pour voir</span></summary><ol class="todo" style="padding:0 12px 12px">${done.map(t=>taskHTML(sid,t,false)).join("")}</ol></details>`);
  $("#main").innerHTML=`<div class="page"><div class="today-h"><h1>${S.name}</h1><span class="muted">${S.code}</span></div>
   <div class="examcard" style="--sc:${S.color}"><div><b>CC ${dayName(e.day,false)} à ${e.start.replace(":","h")}</b> (${jx(S)}), ${e.place}, ${e.dur}.${e.unsure?` <span class="r">${e.unsure}</span>`:""}</div><div class="muted">${S.prog}</div><div class="muted">Documents : ${S.docs}. Coef ${S.coef}, ce CC compte pour ${Math.round(S.share*100)} % de la note.</div></div>
   ${body}</div>`;
  bindTicks($("#main"),()=>subjHome(sid));fixLinks($("#main"),sid);
}

/* ---------- fiche et démo ---------- */
function head(S,c){return `<div class="crumb"><a href="#/${S.id}">${S.name}</a> › ${S.chapters[c.ch]}</div><div class="title-row"><h1>${c.t}</h1><div class="badges">${badges(S,c)}<span id="pill">${pill(S.id,c.id)}</span></div></div>`;}
function pager(S,c){const i=S.ORDER.indexOf(c),p=S.ORDER[i-1],n=S.ORDER[i+1];return `<nav class="pager">${p?`<a href="#/${S.id}/c/${p.id}"><small>Précédent</small>${p.t}</a>`:"<span></span>"}${n?`<a href="#/${S.id}/c/${n.id}" style="text-align:right"><small>Suivant</small>${n.t}</a>`:`<a href="#/${S.id}" style="text-align:right"><small>Ensuite</small>Retour au plan de la matière</a>`}</nav>`;}
function related(S,c){if(!c.rel||!c.rel.length)return "";const L=c.rel.map(id=>{if(S.BY[id])return chip(S.id,id);if(id==="td")return `<a class="chip" href="#/${S.id}/td">${S.tdTitle||"Exercices de TD"}</a>`;const pg=id.startsWith("p/")&&S.pages.find(x=>x.id===id.slice(2));return pg?`<a class="chip" href="#/${S.id}/${id}">${pg.t}</a>`:"";}).join("");return `<div class="related"><span class="muted">Voir aussi :</span> ${L}</div>`;}
function concept(sid,c){
  const S=SUBJ[sid],st=ST[sid];if(!st.seen[c.id]){st.seen[c.id]=true;save(sid);}
  if(c.type==="demo")return demo(sid,c);
  const main=$("#main");
  main.innerHTML=`<article class="page">${head(S,c)}
   ${c.out?`<div class="outnote">${c.out===true?"D'après ce que tu m'as dit, ce chapitre ne devrait pas tomber à ce CC. Lis-le seulement s'il te reste du temps.":c.out}</div>`:""}${c.maybe?`<div class="outnote">${c.maybe}</div>`:""}
   <div class="pretest"><b>Teste-toi d'abord :</b> ${c.q} <span class="muted">Cherche la réponse 30 secondes avant de lire, même si tu ne la connais pas : chercher fait mieux retenir ce que tu lis ensuite. La réponse est en partie 4.</span></div>
   ${sec(1,"Comprendre",`<p class="lead">${c.plain}</p><div class="figs" style="display:grid;gap:14px"></div>`)}
   ${sec(2,"Ce que dit le cours",`<div class="cours"><span class="ref">${c.ref}</span>${c.formal}${c.gloss?`<div class="gloss">${c.gloss.map(g=>`<span>${g}</span>`).join("")}</div>`:""}</div>`)}
   ${sec(3,"Au CC",`${c.use?`<div class="usage"><h2>Comment t'en servir</h2>${c.use}</div>`:""}${c.trap?`<div class="piege"><h2>Le piège</h2><p>${c.trap}</p></div>`:""}${related(S,c)}`)}
   ${sec(4,"Vérifie-toi",`<div class="check"><p class="q">${c.q}</p><button class="btn" data-rev>Voir la réponse</button><div class="a" hidden>${c.a}</div><p class="muted" style="font-size:.9rem">Réponds de mémoire, sans remonter, puis regarde la réponse. Marque « Je sais » seulement si tu avais trouvé : la fiche reviendra demain dans « Révision du jour ». Sinon « À revoir » : elle passe en rouge.</p>${knowBtns(sid,c.id)}</div>`)}
   ${pager(S,c)}</article>`;
  mount(main.querySelector(".figs"),c);
  const chk=main.querySelector(".check");chk.querySelector("[data-rev]").addEventListener("click",e=>{const a=chk.querySelector(".a");a.hidden=!a.hidden;e.target.textContent=a.hidden?"Voir la réponse":"Cacher la réponse";});
  bindKnow(chk,sid,c.id);fixLinks(main,sid);

function demo(sid,c){
  const S=SUBJ[sid],main=$("#main"),n=c.steps.length;let k=0;
  main.innerHTML=`<article class="page">${head(S,c)}
   ${sec(1,"Ce qu'on démontre",`<p class="lead">${c.plain}</p><div class="goal"><b>On suppose</b><span>${c.hyp}</span><b>On montre</b><span>${c.concl}</span></div><p class="idea"><b>L'idée :</b> ${c.idea}</p>${c.explore?`<p class="muted">D'abord, observe :</p><div class="explore"></div>`:""}`)}
   ${sec(2,"La preuve, étape par étape",`<div class="figs"></div><div class="stepnav"><button class="btn" id="sp">Étape précédente</button><button class="btn pri" id="sn">Étape suivante</button><span class="muted" id="sc"></span></div><ol class="steps">${c.steps.map((s,i)=>`<li data-i="${i}" tabindex="0"><div class="w"><span>${s.w}</span><span class="why">${s.why}</span></div></li>`).join("")}</ol>`)}
   ${sec(3,"La preuve rédigée, à savoir refaire",`<div class="redac">${c.redac}</div>${related(S,c)}`)}
   ${sec(4,"Vérifie-toi",`<div class="check"><p class="q">Cache la preuve, prends une feuille et réécris-la. Tu y arrives sans regarder ?</p>${knowBtns(sid,c.id,"Je sais la refaire")}</div>`)}
   ${pager(S,c)}</article>`;
  if(c.explore)mount(main.querySelector(".explore"),c,"explore");

  function show(){lis.forEach((li,i)=>{li.className=i<k?"done":i===k?"cur":"later";});figs.forEach(F=>F.setStep(k));$("#sc").textContent=`Étape ${k+1} sur ${n}`;$("#sp").disabled=k===0;$("#sn").disabled=k===n-1;}
  $("#sp").addEventListener("click",()=>{if(k>0){k--;show();}});$("#sn").addEventListener("click",()=>{if(k<n-1){k++;show();}});
  lis.forEach(li=>{li.addEventListener("click",()=>{k=+li.dataset.i;show();});li.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();k=+li.dataset.i;show();}});});
  show();bindKnow(main.querySelector(".check"),sid,c.id,"Je sais la refaire");fixLinks(main,sid);
}

/* ---------- cartes ---------- */
let deck=[],di=0,flip=false,dfilter="todo";
function cards(sid,f){
  const S=SUBJ[sid];if(f)dfilter=f;else if(!["todo","due","rouge","all"].includes(dfilter))dfilter="todo";
  const types=[...new Set(S.ORDER.map(c=>c.type))];
  const FIL=[["todo","Pas encore sues"],["due","Révision du jour"],["rouge","En rouge"],["all","Toutes"]].concat(types.map(t=>[t,(TYPE[t]||[t])[0]+"s"]));
  const build=()=>{deck=S.ORDER.filter(c=>dfilter==="all"||(dfilter==="todo"?!ST[sid].known[c.id]&&!c.out:dfilter==="due"?ST[sid].review[c.id]||(ST[sid].known[c.id]&&(ST[sid].knownOn[c.id]||"")<today()):dfilter==="rouge"?ST[sid].review[c.id]:c.type===dfilter&&!c.out));di=0;flip=false;};build();
  $("#main").innerHTML=`<div class="page"><div class="title-row"><h1>Cartes de révision</h1></div><p class="lead">Lis le titre, réponds de mémoire (à voix haute ou sur une feuille), puis retourne la carte. « Révision du jour » ressort les cartes en rouge et celles que tu savais hier ou avant : les revoir à quelques jours d'écart les fait tenir jusqu'au CC. Raccourcis : espace pour retourner, 1 pour « Je sais », 2 pour « À revoir ».</p>
   <div class="filters" id="ff">${FIL.map(x=>`<button class="btn" data-f="${x[0]}" aria-pressed="${x[0]===dfilter}">${x[1]}</button>`).join("")}<button class="btn" id="shuf">Mélanger</button></div><div id="card"></div></div>`;
  $("#ff").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){dfilter=b.dataset.f;document.querySelectorAll("#ff [data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));build();drawCard(sid);}});
  $("#shuf").addEventListener("click",()=>{for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}di=0;flip=false;drawCard(sid);});
  drawCard(sid);
}
function drawCard(sid){
  const S=SUBJ[sid],box=$("#card");if(!box)return;
  if(!deck.length){box.innerHTML=`<div class="fc"><p class="front">Aucune carte ici.</p><p>${dfilter==="rouge"?"Aucune fiche en rouge. Le bouton « À revoir » met une fiche en rouge.":dfilter==="todo"?"Toutes les fiches sont sues. Passe au quiz ou aux annales.":dfilter==="due"?"Rien à revoir aujourd'hui. Une fiche que tu marques « Je sais » revient le lendemain : c'est en la retrouvant de mémoire quelques jours de suite qu'on la retient.":"Choisis un autre filtre."}</p></div>`;return;}
  if(di>=deck.length){const r=deck.filter(c=>ST[sid].review[c.id]).length;box.innerHTML=`<div class="fc"><p class="front">Paquet terminé.</p><p>${r?`${r} carte(s) en rouge dans ce paquet.`:"Aucune carte en rouge dans ce paquet."}</p><div class="acts"><button class="btn pri" id="again">Recommencer</button>${r?`<a class="btn rev" href="#/${sid}/cartes/rouge">Revoir les cartes en rouge</a>`:""}</div></div>`;$("#again").addEventListener("click",()=>cards(sid,dfilter));return;}
  const c=deck[di];
  box.innerHTML=`<div class="fc"><span class="muted">Carte ${di+1} sur ${deck.length}. ${(TYPE[c.type]||["Fiche"])[0]}, ${c.ref} ${pill(sid,c.id)}</span><p class="front">${c.t}</p>
   ${flip?`<div class="back"><p>${c.type==="demo"?`<b>Énoncé :</b> si ${c.hyp.replace(/\.$/,"")}, alors ${c.concl.charAt(0).toLowerCase()+c.concl.slice(1)}</p><p><b>L'idée :</b> ${c.idea}`:c.plain}</p>${c.type==="demo"?"":`<div class="cours" style="border-left-width:3px">${c.formal}</div>`}<p><a href="#/${sid}/c/${c.id}">Ouvrir la fiche complète</a></p></div>`:""}
   <div class="acts">${flip?`<button class="btn ok" data-k="1">Je sais (1)</button><button class="btn rev" data-k="0">À revoir (2)</button>`:`<button class="btn pri" data-flip>Retourner (espace)</button>`}</div></div>`;
  box.querySelector("[data-flip]")?.addEventListener("click",()=>{flip=true;drawCard(sid);});
  box.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>cardAnswer(sid,b.dataset.k==="1")));fixLinks(box,sid);
}
function cardAnswer(sid,ok){const c=deck[di];setStatus(sid,c.id,ok?"known":"review");di++;flip=false;drawCard(sid);renderSide();}
document.addEventListener("keydown",e=>{if(!CUR.sid||!CUR.page.startsWith("cartes")||(e.target.closest&&e.target.closest("input,textarea,button,select")))return;if(e.key===" "&&!flip&&deck[di]){e.preventDefault();flip=true;drawCard(CUR.sid);}else if(flip&&(e.key==="1"||e.key==="2"))cardAnswer(CUR.sid,e.key==="1");});

/* ---------- quiz ---------- */
let qOrder=[],qi=0,qScore=0,qAns=null;
function quiz(sid){
  const S=SUBJ[sid],tq=S.tasks.find(t=>t.quiz),goal=tq?quizGoal(S,tq):null;
  $("#main").innerHTML=`<div class="page"><div class="title-row"><h1>Quiz de cours</h1></div><p class="lead">${S.quizIntro||"Des questions dans le style des questions de cours du CC."}${goal?` Objectif du plan : au moins ${goal} sur ${activeQuiz(S).length}.`:""}</p><div class="qbox" id="qbox" aria-live="polite"></div></div>`;
  qOrder=S.quiz.map((_,i)=>i).filter(i=>activeQuiz(S).includes(S.quiz[i]));for(let i=qOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qOrder[i],qOrder[j]]=[qOrder[j],qOrder[i]];}qi=0;qScore=0;qAns=null;drawQ(sid);
  $("#qbox").addEventListener("click",e=>{const o=e.target.closest("[data-o]");if(o&&qAns===null){qAns=+o.dataset.o;const qq=S.quiz[qOrder[qi]];if(qAns===qq.a)qScore++;else if(qq.link&&S.BY[qq.link]){setStatus(sid,qq.link,"review");renderSide();}drawQ(sid);$("#qn")?.focus();return;}const id=e.target.closest("button")?.id;if(id==="qn"){qi++;qAns=null;drawQ(sid);}if(id==="qre")quiz(sid);});
}
function drawQ(sid){
  const S=SUBJ[sid],Q=S.quiz,n=qOrder.length,box=$("#qbox"),st=ST[sid],tq=S.tasks.find(t=>t.quiz),goal=tq?quizGoal(S,tq):n;
  if(qi>=n){if(qScore>st.best){st.best=qScore;if(qScore>=goal&&!st.quizOn)st.quizOn=today();save(sid);}box.innerHTML=`<p class="muted">Résultat</p><p class="score">${qScore} sur ${n}</p><p>${qScore>=goal?"Objectif atteint : l'étape « Quiz » de ton plan est cochée.":"Relis les fiches des questions ratées, puis recommence."}</p><button class="btn pri" id="qre" style="justify-self:start">Recommencer</button>`;return;}
  const q=Q[qOrder[qi]];
  box.innerHTML=`<p class="muted">Question ${qi+1} sur ${n}. Score : ${qScore}</p><div class="bar"><i style="width:${qi/n*100}%;background:var(--cobalt)"></i></div><p class="qtxt">${q.q}</p>${q.code?W.code(q.code,q.lang||S.lang):""}
   <div class="opts">${q.o.map((o,i)=>{let c="";if(qAns!==null){if(i===q.a)c="good";else if(i===qAns)c="bad";}return `<button data-o="${i}" class="${c}" ${qAns!==null?"disabled":""}>${o}</button>`;}).join("")}</div>
   ${qAns!==null?`<div class="expl${qAns===q.a?"":" no"}"><b>${qAns===q.a?"Exact.":"Non."}</b> ${q.e}${q.link?` <a href="#/${sid}/c/${q.link}">Voir la fiche</a>`:""}</div><button class="btn pri" id="qn" style="justify-self:start">${qi<n-1?"Question suivante":"Voir le score"}</button>`:""}`;
}

/* ---------- TD ---------- */
let tdf="all";
function td(sid){
  const S=SUBJ[sid];
  $("#main").innerHTML=`<div class="page"><div class="title-row"><h1>${S.tdTitle||"Exercices de TD"}</h1></div><p class="lead">${S.tdIntro||"Cherche sur papier avant d'ouvrir l'indice, puis le corrigé."}</p>
   ${S.tdBox||""}<div class="filters" id="tdf">${[["all","Tous"],["3","★★★ seulement"],["todo","Pas encore sus"]].map(x=>`<button class="btn" data-f="${x[0]}" aria-pressed="${x[0]===tdf}">${x[1]}</button>`).join("")}</div><div id="tdl" style="display:grid;gap:10px"></div></div>`;
  const draw=()=>{const st=ST[sid];const L=S.td.filter(x=>tdf==="all"||(tdf==="3"?x.s===3&&!x.out:!st.td[x.id]&&!x.out));
    $("#tdl").innerHTML=L.length?L.map(x=>{const k=!!st.td[x.id],n=S.td.indexOf(x);return `<details class="ex"><summary><span><span class="sub">${S.tdPrefix||"TD"} ${x.id}, ${"★".repeat(x.s)}${x.note?", "+x.note:""}${x.out?`, <span class="r">${x.out===true?"pas au CC1":x.out}</span>`:""}${x.paper?", sur papier":""}<span class="tdst">${k?", su":""}</span></span><br><span class="h">${x.t}</span></span></summary>
     <div class="body"><div class="enon">${x.en}</div>${x.idea?`<p class="idea" style="font-size:1rem"><b>L'idée :</b> ${x.idea}</p>`:""}${x.link?`<p><a class="btn" href="#/${sid}/c/${x.link}">Voir la fiche</a></p>`:""}
     ${x.hint?`<div><button class="btn" data-rv="th${n}" data-l="Voir l'indice">Voir l'indice</button><div class="sol" id="th${n}" hidden style="margin-top:8px">${x.hint}</div></div>`:""}
     <div><button class="btn" data-rv="ts${n}" data-l="Voir le corrigé">Voir le corrigé</button><div class="sol" id="ts${n}" hidden style="margin-top:8px">${x.sol}</div></div>
     <button class="btn${k?" ok":""}" data-tk="${x.id}" style="justify-self:start">${k?"✓ Je sais le faire":"Je sais le faire"}</button></div></details>`;}).join(""):`<p class="muted">Rien à afficher avec ce filtre.</p>`;fixLinks($("#tdl"),sid);};
  $("#tdf").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;tdf=b.dataset.f;document.querySelectorAll("#tdf [data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));draw();});
  $("#tdl").addEventListener("click",e=>{const r=e.target.closest("[data-rv]");if(r){const el=document.getElementById(r.dataset.rv);el.hidden=!el.hidden;r.textContent=el.hidden?r.dataset.l:"Masquer";return;}
    const b=e.target.closest("[data-tk]");if(!b)return;const st=ST[sid],id=b.dataset.tk;if(st.td[id]){delete st.td[id];delete st.tdOn[id];}else{st.td[id]=true;st.tdOn[id]=today();}save(sid);const k=!!st.td[id];b.className="btn"+(k?" ok":"");b.textContent=k?"✓ Je sais le faire":"Je sais le faire";const m=b.closest("details").querySelector(".tdst");if(m)m.textContent=k?", su":"";});
  draw();fixLinks($("#main"),sid);
}

/* ---------- annales ---------- */
let tm={left:3600,end:0,int:null,warn:false,len:60};
function annales(sid){
  const S=SUBJ[sid],len=S.examMinutes||60;if(tm.len!==len&&!tm.int)tm={left:len*60,end:0,int:null,warn:false,len};
  $("#main").innerHTML=`<div class="page"><div class="title-row"><h1>Annales et examen blanc</h1></div><p class="lead">Fais un sujet en temps réel, puis corrige-toi. ${S.annIntro||""} Coche ensuite l'étape dans ton plan.</p>
   <section class="check"><h2 style="font-size:1.1rem">Chrono de ${len} minutes</h2><p class="muted">${S.docs?`Documents autorisés au CC : ${S.docs}.`:""} Ne regarde aucun corrigé avant la fin.</p><div class="timer"><span class="score" id="tm"></span><button class="btn pri" id="tmgo">Lancer</button><button class="btn" id="tmre">Remettre à zéro</button><span class="muted" id="tmmsg" aria-live="polite"></span></div></section>
   <div id="ann" style="display:grid;gap:10px"></div></div>`;
  $("#ann").innerHTML=S.ann.map((x,i)=>`<details class="ex"><summary><span><span class="sub">${x.src}</span><br><span class="h">${x.t}</span></span></summary><div class="body"><div class="enon">${x.en}</div>
   ${x.go?`<p><a class="btn pri" href="#/${sid}/c/${x.go}">Ouvrir la fiche</a></p>`:""}
   ${x.hint?`<div><button class="btn" data-rv="h${i}" data-l="Voir l'indice">Voir l'indice</button><div class="sol" id="h${i}" hidden style="margin-top:8px">${x.hint}</div></div>`:""}
   ${x.sol?`<div><button class="btn" data-rv="s${i}" data-l="Voir le corrigé">Voir le corrigé</button><div class="sol" id="s${i}" hidden style="margin-top:8px"><span class="who">${x.who||"Corrigé du prof, réécrit"}</span>${x.sol}</div></div>`:""}</div></details>`).join("");
  $("#ann").addEventListener("click",e=>{const r=e.target.closest("[data-rv]");if(!r)return;const el=document.getElementById(r.dataset.rv);el.hidden=!el.hidden;r.textContent=el.hidden?r.dataset.l:"Masquer";});
  const show=()=>{const s=Math.max(0,Math.ceil(tm.left));const el=$("#tm");if(!el)return;el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");el.classList.toggle("end",s===0);};
  const tick=()=>{tm.left=(tm.end-Date.now())/1000;const msg=$("#tmmsg");if(!tm.warn&&tm.left<=600&&tm.left>0){tm.warn=true;if(msg)msg.textContent="Plus que 10 minutes : gardes-en 5 pour relire.";}if(tm.left<=0){tm.left=0;clearInterval(tm.int);tm.int=null;if(msg)msg.textContent="Temps écoulé : pose le stylo et corrige-toi.";if($("#tmgo"))$("#tmgo").textContent="Lancer";}show();};
  $("#tmgo").addEventListener("click",()=>{if(tm.int){clearInterval(tm.int);tm.int=null;tm.left=(tm.end-Date.now())/1000;$("#tmgo").textContent="Reprendre";$("#tmmsg").textContent="En pause.";}else if(tm.left>0){tm.end=Date.now()+tm.left*1000;tm.int=setInterval(tick,250);$("#tmgo").textContent="Pause";$("#tmmsg").textContent="";}show();});
  $("#tmre").addEventListener("click",()=>{clearInterval(tm.int);tm={left:len*60,end:0,int:null,warn:false,len};$("#tmgo").textContent="Lancer";$("#tmmsg").textContent="";show();});
  if(tm.int)$("#tmgo").textContent="Pause";show();fixLinks($("#main"),sid);
}

/* ---------- pages propres à une matière ---------- */
function page(sid,pid){const S=SUBJ[sid],p=S.pages.find(x=>x.id===pid);if(!p)return subjHome(sid);
  if(p.render){$("#main").innerHTML=`<div class="page" id="pg"></div>`;p.render($("#pg"),{sid,S,st:ST[sid],sec});}
  else $("#main").innerHTML=`<div class="page">${typeof p.html==="function"?p.html({S,sec,exam:exam(S)}):p.html}</div>`;
  fixLinks($("#main"),sid);}

/* ---------- entraînement mélangé (tous les quiz, priorité au prochain CC et aux notions ratées) ---------- */
let mx={q:[],i:0,score:0,ans:null};
function mix(){
  const n=NOW(),act=SIDS.filter(id=>examStart(SUBJ[id])>n),near=act.slice().sort((a,b)=>examStart(SUBJ[a])-examStart(SUBJ[b]))[0];
  const pool=[];act.forEach(id=>{const S=SUBJ[id],st=ST[id];activeQuiz(S).forEach(q=>{let w=1;if(q.link){if(st.review[q.link])w=4;else if(!st.known[q.link])w=2;}if(id===near)w*=2;pool.push({sid:id,q,w});});});
  const pick=[];for(let k=0;k<10&&pool.length;k++){let t=Math.random()*pool.reduce((s,x)=>s+x.w,0),j=0;for(;j<pool.length-1;j++){t-=pool[j].w;if(t<=0)break;}pick.push(pool.splice(j,1)[0]);}
  mx={q:pick,i:0,score:0,ans:null};
  $("#main").innerHTML=`<div class="page"><div class="title-row"><h1>Entraînement mélangé</h1></div><p class="lead">10 questions de toutes tes matières, surtout ton prochain CC et les notions que tu rates. Réponds avant de regarder les choix si tu peux. Chaque erreur met la fiche en rouge : elle reviendra dans « Révision du jour ».</p><div class="qbox" id="mxbox" aria-live="polite"></div></div>`;
  drawMix();
  $("#mxbox").addEventListener("click",e=>{const o=e.target.closest("[data-o]");if(o&&mx.ans===null){const it=mx.q[mx.i];mx.ans=+o.dataset.o;if(mx.ans===it.q.a)mx.score++;else if(it.q.link&&SUBJ[it.sid].BY[it.q.link]){setStatus(it.sid,it.q.link,"review");renderSide();}drawMix();$("#mxn")?.focus();return;}const id=e.target.closest("button")?.id;if(id==="mxn"){mx.i++;mx.ans=null;drawMix();}if(id==="mxre")mix();});
}
function drawMix(){
  const box=$("#mxbox"),n=mx.q.length;
  if(!n){box.innerHTML=`<p>Aucune question : tous tes CC sont passés.</p>`;return;}
  if(mx.i>=n){hub.mixOn=today();hub.mixScore=mx.score;saveHub();box.innerHTML=`<p class="muted">Résultat</p><p class="score">${mx.score} sur ${n}</p><p>${mx.score===n?"Parfait.":"Les notions ratées sont en rouge. Ouvre leur fiche maintenant, ou retrouve-les demain dans « Révision du jour »."}</p><div class="acts"><button class="btn pri" id="mxre">10 autres questions</button><a class="btn" href="#/">Retour à aujourd'hui</a></div>`;return;}
  const it=mx.q[mx.i],q=it.q,S=SUBJ[it.sid];
  box.innerHTML=`<p class="muted"><i class="sdot" style="background:${S.color}"></i> ${S.name}. Question ${mx.i+1} sur ${n}, score : ${mx.score}</p><div class="bar"><i style="width:${mx.i/n*100}%;background:${S.color}"></i></div><p class="qtxt">${q.q}</p>${q.code?W.code(q.code,q.lang||S.lang):""}
   <div class="opts">${q.o.map((o,i)=>{let c="";if(mx.ans!==null){if(i===q.a)c="good";else if(i===mx.ans)c="bad";}return `<button data-o="${i}" class="${c}" ${mx.ans!==null?"disabled":""}>${o}</button>`;}).join("")}</div>
   ${mx.ans!==null?`<div class="expl${mx.ans===q.a?"":" no"}"><b>${mx.ans===q.a?"Exact.":"Non."}</b> ${q.e}${q.link?` <a href="#/${it.sid}/c/${q.link}">Voir la fiche</a>`:""}</div><button class="btn pri" id="mxn" style="justify-self:start">${mx.i<n-1?"Question suivante":"Voir le score"}</button>`:""}`;
}
function methode(){
  $("#main").innerHTML=`<div class="page"><div class="title-row"><h1>Réviser efficacement en peu de temps</h1></div>
   <p class="lead">Une grande synthèse de la recherche sur l'apprentissage (Dunlosky et ses collègues, 2013) compare dix façons de réviser. Deux sortent nettement du lot : <b>se tester</b> et <b>espacer</b>. Relire, surligner et résumer arrivent en bas du classement. Le site est construit autour de ça.</p>
   ${sec(1,"Se tester au lieu de relire",`<p>Chercher une réponse de mémoire renforce le souvenir bien plus qu'une relecture, même quand on se trompe, à condition de voir la correction juste après. C'est pour ça que chaque fiche commence par une question, que les cartes se retournent, et que les corrigés de TD restent cachés tant que tu n'as pas cherché.</p><p><b>En pratique</b> : ferme la fiche et réécris l'énoncé ou l'algorithme sur une feuille, puis compare.</p>`)}
   ${sec(2,"Espacer",`<p>Revoir une notion le lendemain, puis deux jours après, la fait tenir beaucoup mieux que la revoir trois fois le même soir. Une fiche marquée « Je sais » revient le lendemain dans le filtre « Révision du jour » des cartes. Les fiches ratées passent en rouge et reviennent aussi.</p><p><b>En pratique</b> : 10 minutes de « Révision du jour » au début de chaque séance.</p>`)}
   ${sec(3,"Mélanger les matières",`<p>Alterner les sujets oblige à choisir la bonne méthode à chaque question, comme le jour du CC. C'est l'idée de l'entraînement mélangé de l'accueil.</p>`)}
   ${sec(4,"S'entraîner dans les conditions du CC",`<p>Tes contrôles sont sur papier, en 1 heure. Fais au moins une annale en temps réel par matière (le chrono est dans « Annales »), sur papier, puis corrige-toi avec la liste « Avant de rendre ta copie » des pages Recettes.</p>`)}
   ${sec(5,"Dormir",`<p>Le sommeil consolide ce que tu as appris dans la journée. Une nuit blanche avant un CC fait perdre plus qu'elle ne rapporte : la veille, révise les fiches en rouge et dors.</p>`)}
   <p><a class="btn pri" href="#/mix">Faire l'entraînement mélangé</a></p></div>`;
}

/* ---------- recherche ---------- */
const strip=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/<[^>]+>/g,"");
const IDX=[];SIDS.forEach(id=>{const S=SUBJ[id];S.ORDER.forEach(c=>IDX.push({h:`#/${id}/c/${c.id}`,t:c.t,sub:`${S.name}, ${c.ref}`,k:strip(S.name+" "+c.t+" "+c.ref+" "+c.plain)}));S.pages.forEach(p=>IDX.push({h:`#/${id}/p/${p.id}`,t:p.t,sub:S.name,k:strip(S.name+" "+p.t)}));[["cartes","Cartes"],["quiz","Quiz"],["td",S.tdTitle||"TD"],["annales","Annales"]].forEach(([r,t])=>IDX.push({h:`#/${id}/${r}`,t:`${t} de ${S.name}`,sub:S.name,k:strip(S.name+" "+t)}));});
IDX.push({h:"#/edt",t:"Emploi du temps",sub:"page",k:"emploi du temps semaine edt"},{h:"#/examens",t:"Examens et coefficients",sub:"page",k:"examens coefficients coef dates"});
const si=$("#q"),res=$("#res");let ri=0,rl=[];
function search(){const q=strip(si.value.trim());if(!q){res.hidden=true;return;}const words=q.split(/\s+/);rl=IDX.map(x=>({x,s:(strip(x.t).includes(q)?3:0)+words.filter(w=>x.k.includes(w)).length})).filter(o=>o.s>=words.length).sort((a,b)=>b.s-a.s).slice(0,12).map(o=>o.x);ri=0;res.innerHTML=rl.length?rl.map((x,i)=>`<a href="${x.h}" class="${i===0?"on":""}">${x.t}<small>${x.sub}</small></a>`).join(""):`<p class="muted" style="padding:6px 10px;margin:0">Rien trouvé.</p>`;res.hidden=false;}
si.addEventListener("input",search);
si.addEventListener("keydown",e=>{if(e.key==="Enter"&&rl[ri]){location.hash=rl[ri].h;si.value="";res.hidden=true;si.blur();}else if(e.key==="Escape"){si.value="";res.hidden=true;}else if((e.key==="ArrowDown"||e.key==="ArrowUp")&&rl.length){e.preventDefault();ri=(ri+(e.key==="ArrowDown"?1:-1)+rl.length)%rl.length;res.querySelectorAll("a").forEach((a,i)=>a.classList.toggle("on",i===ri));}});
res.addEventListener("click",()=>{si.value="";res.hidden=true;});document.addEventListener("click",e=>{if(!e.target.closest(".search"))res.hidden=true;});

/* ---------- routage ---------- */
function route(){
  const parts=(location.hash||"#/").slice(2).split("/").filter(Boolean);
  const first=parts[0]||"";
  if(SIDS.includes(first)){
    const sid=first,rest=parts.slice(1),S=SUBJ[sid];let pg="home";
    if(rest[0]==="c"&&S.BY[rest[1]]){pg="c/"+rest[1];concept(sid,S.BY[rest[1]]);}
    else if(rest[0]==="cartes"){pg="cartes";cards(sid,rest[1]==="rouge"?"rouge":null);}
    else if(rest[0]==="quiz"&&S.quiz.length){pg="quiz";quiz(sid);}
    else if(rest[0]==="td"&&S.td.length){pg="td";td(sid);}
    else if(rest[0]==="annales"&&S.ann.length){pg="annales";annales(sid);}
    else if(rest[0]==="p"&&rest[1]){pg="p/"+rest[1];page(sid,rest[1]);}
    else subjHome(sid);
    CUR={sid,page:pg};document.documentElement.style.setProperty("--sc",S.color);
  } else {
    CUR={sid:null,page:["edt","examens","mix","methode"].includes(first)?first:"today"};
    if(first==="edt")edt();else if(first==="examens")examens();else if(first==="mix")mix();else if(first==="methode")methode();else hubHome();
  }
  renderSide();topInfo();window.scrollTo(0,0);
  const h1=$("#main h1");document.title=(h1?h1.textContent+" · ":"")+"Mes révisions";
}
window.addEventListener("hashchange",route);
route();

if("serviceWorker" in navigator&&document.querySelector('link[rel="manifest"]')&&(location.protocol==="https:"||location.hostname==="localhost")){try{navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}}
})();
