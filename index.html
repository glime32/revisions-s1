const feuille=`<div class="title-row"><h1>Ma feuille A4</h1><button class="btn pri" onclick="window.print()">Imprimer cette feuille</button></div>
<p class="lead no-print">Une feuille A4 est autorisée au CC d'algo (tes camarades le confirment), et tu y écris ce que tu veux. Voici l'essentiel sur une page. Recopie-la à la main plutôt que de l'imprimer : la réécrire t'oblige à la reformuler, et c'est ça qui fait retenir.</p>
<div class="a4">
<div><h3>La forme</h3>${C(`FONCTION : f (E x : entier, E T : tableau d'entiers) : booléen
SPÉCIFICATIONS : ce qu'on suppose, ce qu'on renvoie.
Variable : cpt : entier
DÉBUT
    cpt ← 0
    pour i de 0 à taille(T)-1 faire
        si T[i] = x alors cpt ← cpt + 1 fin si;
    fin pour;
    tant que cond faire … fin tq;
    Renvoyer cpt > 0
FIN`)}<p>PROCÉDURE : pas de type de résultat. E entrée, S sortie, ES modifié. Indice de pour et paramètres : pas dans Variable. Renvoyer après la boucle, sauf recherche.</p></div>
<div><h3>Expressions</h3><p>/ nombre, div quotient, mod reste, ^ puissance. et, ou paresseux. cond(a, b, c) : b et c même type. Erreur : mauvais nombre d'arguments, booléen dans un calcul, entier dans et/ou.</p><h3>Récursivité</h3><p>Cas de base sans appel + appel sur plus petit. Méthode : f(0) = … ; f(n) = … f(n−1) … ; puis cond.</p><p><b>Affichage</b> : calcule G(1), G(2), G(3) puis assemble dans l'ordre des instructions.</p><h3>Motifs</h3><p>Ligne i : nb d'espaces, nb d'étoiles en fonction de i, n. pour i [espaces] [étoiles] affRL() fin pour;</p></div>
<div><h3>Tableaux</h3><p>Indices 0 à taille(T) − 1. 2D : T[i][j], lignes taille(T), colonnes taille(T[i]) (= taille(T[0])), deux pour imbriqués. Accumuler (0 ou 1 avant, mise à jour dedans, Renvoyer après). Tous : Renvoyer faux dans la boucle, vrai après. Voisins : tester a ≥ 0 et a &lt; taille(G) avant G[a][b]. Nouveau tableau H pour la génération suivante.</p><h3>Dictionnaires</h3><p>D['clé'], pour k dans D faire, si k dans D alors.</p></div>
<div><h3>Listes</h3><p>tête(L) élément, queue(L) liste, cons(x, L) ajout devant, estVide(L), pas de L[2]. 1 élément : estVide(queue(L)). Récursif : cond(estVide(L), base, … tête(L) … f(queue(L))). Itératif : M ← L ; tant que non estVide(M) … M ← queue(M) fin tq;. Garder l'ordre d'un tableau : parcourir de la fin, cons.</p><h3>Piles et files</h3><p>empiler(e, P), depiler(P) renvoie et enlève le sommet, estVide(P). Pas de P[i], pas de cons. Vider une pile dans une autre inverse l'ordre : inverser P = 3 transvasements. File : enfiler(e, F), defiler(F) (premier arrivé).</p><h3>Python</h3><p>pour i de a à b → for i in range(a, b+1). ← → =, = → ==, div → //, mod → %.</p></div>
</div>`;
const recettes=({sec})=>`<div class="title-row"><h1>Recettes pas à pas</h1></div><p class="lead">Le CC est sur papier. Ces étapes te font gagner les points de forme, même quand tu n'es pas sûr du fond.</p>
 ${sec(1,"Écrire un algorithme en 6 étapes",`<div class="recipe"><ol>
  <li><b>La signature.</b> FONCTION ou PROCÉDURE ? Les paramètres : E, S ou ES, nom, type. Le type du résultat (fonction seulement). <a href="#/c/a-pseudo">Fiche</a></li>
  <li><b>Les spécifications</b>, en une phrase : ce que l'algorithme suppose (« L non vide ») et ce qu'il renvoie.</li>
  <li><b>Les variables</b> : chaque mémoire de travail avec son type. Pas l'indice d'une boucle pour, pas les paramètres.</li>
  <li><b>Le corps</b> : choisis le schéma. Accumuler (somme, compte), chercher (tous, il existe), fabriquer (un tableau, une liste), ou récursif (cas de base, puis appel sur plus petit).</li>
  <li><b>Ferme chaque bloc</b> : fin si; fin pour; fin tq;, aligné sous son ouverture. Trace un trait de chaque pour à son fin pour; pour voir ce qui est répété.</li>
  <li><b>Déroule un petit exemple</b> à la main, en tableau (une colonne par variable). Vérifie les bords : première et dernière case, liste vide.</li></ol></div>`)}
 ${sec(2,"Trouver ce qu'affiche un algorithme récursif",`<div class="recipe"><ol><li>Repère le cas où rien ne s'affiche (souvent n ≤ 0 ou n = 0).</li><li>Calcule ce qu'affichent G(1), puis G(2), puis G(3), en suivant l'ordre des instructions.</li><li>Pour G(n), remplace chaque appel par ce que tu as déjà trouvé.</li><li>Écris les résultats intermédiaires sur ta copie : ils montrent ta méthode.</li></ol><p>Entraîne-toi dans la fiche <a href="#/c/a-arbre-appels">Tracer un affichage récursif</a>.</p></div>`)}
 ${sec(3,"Choisir le bon schéma",`<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>L'énoncé demande</th><th>Ce que tu écris</th></tr></thead><tbody>
  <tr><td>une somme, un produit, un nombre de…</td><td>accumulateur à 0 (ou 1 pour un produit) avant la boucle, mis à jour dedans, Renvoyer après</td></tr>
  <tr><td>« tous les éléments… »</td><td>dans la boucle : si contre-exemple alors Renvoyer faux fin si; ; après la boucle : Renvoyer vrai</td></tr>
  <tr><td>« il existe un élément… »</td><td>dans la boucle : si trouvé alors Renvoyer vrai fin si; ; après : Renvoyer faux</td></tr>
  <tr><td>un nouveau tableau</td><td>Variable : R : tableau de taille(T) …, une boucle qui remplit R[i], Renvoyer R</td></tr>
  <tr><td>un tableau 2D</td><td>pour i de 0 à taille(T)-1 faire pour j de 0 à taille(T[i])-1 faire …</td></tr>
  <tr><td>une liste, en récursif</td><td>cond(estVide(L), cas de base, … tête(L) … f(queue(L)) …)</td></tr>
  <tr><td>une liste dans l'ordre d'un tableau</td><td>pour i de taille(T)-1 à 0 par pas de -1 faire L ← cons(T[i], L) fin pour;</td></tr>
  <tr><td>une figure d'étoiles</td><td>ligne i : combien d'espaces, combien d'étoiles ; une boucle par morceau, affRL() à la fin de la ligne</td></tr></tbody></table></div>`)}
 ${sec(4,"Avant de rendre ta copie",`<div class="paper"><b>Pour chaque algorithme, vérifie :</b><ul><li>la signature complète (E/S, types, type du résultat pour une fonction, rien pour une procédure) ;</li><li>les spécifications ;</li><li>chaque variable déclarée et initialisée avant d'être utilisée ;</li><li>chaque si, pour, tant que fermé au bon endroit (fin si; fin pour; fin tq;) ;</li><li>dans un tant que, la variable du test change bien dans la boucle ;</li><li>les indices de 0 à taille(T) − 1 ;</li><li>le Renvoyer au bon endroit (après la boucle, sauf recherche) ;</li><li>en récursif : un cas de base, et un appel sur plus petit.</li></ul></div>`)}`;

const CHOICES=["int","float","bool","string","int list","string list","erreur"];

function matchLab(host){
  const cases=[["1","n = 1",n=>n===1,n=>1],["i when i < 0","n < 0",n=>n<0,n=>0],["i when i mod 2 = 0","n pair",n=>n%2===0,n=>Math.trunc(n/2)],["i when i mod 2 = 1","n impair",n=>n%2===1,n=>n+1],["3","n = 3",n=>n===3,n=>0],["_","sinon",n=>true,n=>2]];
  host.innerHTML=`<div class="widget"><div class="w-ctrl"><label>n = <input type="number" value="3" data-n style="width:5em"></label></div><div class="split"><div>${M(`match n with
| 1 -> 1
| i when i < 0 -> 0
| i when i mod 2 = 0 -> n / 2
| i when i mod 2 = 1 -> i + 1
| 3 -> 0
| _ -> 2`)}</div><div class="mcases"></div></div><div class="w-note"></div></div>`;
  const q=s=>host.querySelector(s);
  function draw(){const n=Math.round(+q("[data-n]").value)||0;let hit=-1;cases.forEach((c,i)=>{if(hit<0&&c[2](n))hit=i;});
    q(".mcases").innerHTML=cases.map((c,i)=>`<div class="mc${i===hit?" on":i<hit?" no":""}"><code>| ${esc(c[0])}</code> <span class="muted">${i<hit?"ne correspond pas":i===hit?"premier cas qui correspond":"jamais essayé"}</span></div>`).join("");
    q(".w-note").innerHTML=`<div class="verdict ok">match ${n} vaut <b>${cases[hit][3](n)}</b>. Les cas sont essayés de haut en bas : on prend le premier qui correspond.${n===3?" Le cas « 3 » n'est jamais atteint : « i when i mod 2 = 1 » passe avant.":""}</div>`;}
  host.addEventListener("input",draw);draw();
}

/* ---------- chapitre 1 : expressions et types ---------- */
add(1,{id:"pf-types",type:"def",ref:"Cours, TD ex. 1",t:"Types de base et opérateurs",short:"Types et opérateurs",cc:"3 pts au partiel 2021",
 plain:`En OCaml, ${hl("chaque expression a un type")}, et les opérateurs ne mélangent pas les types : les entiers (int) utilisent + - * / mod, les réels (float) utilisent +. -. *. /. avec un point. Entraîne-toi ci-dessous : choisis le type, puis lis la valeur.`,
 fig:()=>h=>W.drill(h,DRILL,CHOICES),
 formal:`<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Type</th><th>Valeurs</th><th>Opérations</th></tr></thead><tbody>
 <tr><td>int</td><td>3, -7, 0</td><td>+ - * / (division entière) mod</td></tr>
 <tr><td>float</td><td>3.0, 3., 2.5</td><td>+. -. *. /. sqrt</td></tr>
 <tr><td>bool</td><td>true, false</td><td>&& || not</td></tr>
 <tr><td>string</td><td>"bonjour"</td><td>^ (concaténation)</td></tr>
 <tr><td>comparaisons</td><td>= <> < > <= >=</td><td>entre deux valeurs du même type, résultat bool</td></tr></tbody></table></div><p>Conversions : float_of_int, int_of_float (tronque).</p>`,
 use:`<p>Partiel 2021, question 1 (3 points) : « indiquez les types et valeurs des expressions ». Lis chaque opérateur : il impose le type de ses deux côtés.</p>`,
 trap:`7.2 / 2 et 3 * 4. sont des erreurs de type. Et 7 / 2 vaut 3, pas 3.5.`,
 q:"Quel est le type et la valeur de (8/3) :: (8 mod 3) :: [] ? (partiel 2021)",a:"int list, et la valeur est [2; 2].",rel:["pf-if","pf-erreurs"]});

add(1,{id:"pf-if",type:"def",ref:"Cours, TD ex. 1 et 5",t:"if … then … else : une expression",short:"if then else",
 plain:`En OCaml, ${hl("if then else est une expression")} : elle a une valeur et un type. Les deux branches doivent donc avoir ${hl("le même type")}, et la condition doit être un bool.`,
 fig:()=>h=>W.drill(h,DRILL.filter(d=>/^if/.test(d.e)),CHOICES),
 formal:`${M(`if condition then expression1 else expression2
(* condition : bool ; expression1 et expression2 : même type *)`)}<p>Le type de l'expression est celui des branches. Sans else, la branche then doit être de type unit.</p>`,
 use:`<p>Pour trouver un type (TD ex. 5) : « if x then y else 3 » impose x : bool et y : int.</p>`,
 trap:`« if 3/2 < 2 then 4 < 5 else 4 + 5 » est une erreur : bool d'un côté, int de l'autre.`,
 q:"Quel est le type de : if x then y else 3 ?",a:"int, avec x : bool et y : int.",rel:["pf-types","pf-let"]});

add(1,{id:"pf-let",type:"def",ref:"Cours, TD ex. 3",t:"let … in et let … and",
 plain:`${hl("let x = e1 in e2")} donne un nom local à e1, utilisable seulement dans e2. Avec ${hl("and")}, les définitions sont faites en même temps : l'une ne peut pas utiliser l'autre.`,
 fig:()=>h=>W.drill(h,DRILL.filter(d=>/^let/.test(d.e)).concat([{e:"let x = 5 in x * x",t:"int",v:"25"},{e:"let a = 2 and b = true in b && (a > 0)",t:"bool",v:"true"},{e:"let a = 3 and b = 5 in (a < b) && ((a > b) / 2)",t:"erreur",why:"(a > b) est un bool : on ne peut pas le diviser."}]),CHOICES),
 formal:`${M(`let x = 5 in x * x                 (* 25 *)
let a = 2 and b = 5 in a + 2 * b   (* 12 *)
let a = 5 and b = a + 1 in …       (* erreur : a n'existe pas encore pour b *)
let a = 5 in let b = a + 1 in …    (* là, ça marche *)`)}`,
 use:`<p>Utile pour éviter de recalculer : « let m = maxListe (List.tl li) in if List.hd li > m then List.hd li else m ».</p>`,
 trap:`Dans « let a = 5 and b = a + 1 », le a de b n'est pas celui défini juste avant : erreur (ou l'ancien a s'il en existait un).`,
 q:"Que vaut let a = 5 and b = a + 1 in a + 2*b (sans a défini avant) ?",a:"Une erreur : dans un let … and, b ne voit pas le a défini en même temps.",rel:["pf-if"]});

/* ---------- chapitre 2 : fonctions ---------- */
add(2,{id:"pf-fonctions",type:"def",ref:"Cours, TD ex. 6, 7, 20",t:"Définir une fonction : n-uplet ou forme curryfiée",short:"Définir une fonction",
 plain:`Deux façons d'écrire une fonction à deux paramètres : avec ${hl("un couple")}, function (x, y) -> …, de type int * int -> int ; ou ${hl("curryfiée")}, fun x y -> …, de type int -> int -> int. La forme curryfiée est demandée à l'examen dès qu'il y a plusieurs arguments.`,
 fig:()=>h=>{h.innerHTML=`<div class="split"><div><p><b>Avec un couple</b></p>${M(`let g = function (x, y) -> x < y *. y
(* g : float * float -> bool *)
g (3.2, 4.4)`)}</div><div><p><b>Curryfiée</b></p>${M(`let gg = fun x y -> x < y *. y
(* gg : float -> float -> bool *)
gg 3.2 4.4
gg 3.2          (* float -> bool *)`)}</div></div>`;},
 formal:`<ul><li><code>let f = function x -> 2 * x + 1</code> ou <code>let f x = 2 * x + 1</code> : int -> int.</li><li>Couple : <code>function (x, y) -> …</code>, type <code>t1 * t2 -> t</code>, appel <code>f (a, b)</code>.</li><li>Curryfiée : <code>fun x y -> …</code> ou <code>let f x y = …</code>, type <code>t1 -> t2 -> t</code>, appel <code>f a b</code>.</li><li>Application partielle : <code>gg 3.2</code> est une fonction float -> bool.</li></ul>`,
 use:`<p>Le partiel 2021 demande de donner la signature de chaque fonction écrite. L'examen 2024 : « dès qu'une fonction prendra plusieurs arguments, vous écrirez la fonction sous sa forme curryfiée ».</p>`,
 trap:`f (a, b) appelle une fonction à un couple ; f a b une fonction curryfiée. Mélanger les deux est une erreur de type.`,
 q:"Quelle est la signature de let f = function (x, y) -> if y then x + 1 else 2 * x ?",a:"int * bool -> int (partiel 2021 et TD ex. 7).",rel:["pf-signature"]});

add(2,{id:"pf-signature",type:"meth",ref:"Partiel 2021, Q1.2",t:"Trouver la signature d'une fonction",short:"Trouver une signature",cc:"Tombé en 2021",
 plain:`On lit le corps de la fonction et on note ce que ${hl("chaque opérateur impose")} : x + 1 force x : int ; if y force y : bool ; List.hd y force y : liste. Ce qui n'est contraint par rien devient 'a (n'importe quel type), mais le polymorphisme n'est pas au contrôle : les exercices te donneront des listes d'entiers.`,
 fig:()=>h=>{h.innerHTML=`<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Fonction</th><th>Raisonnement</th><th>Signature</th></tr></thead><tbody>
 <tr><td><code>function (x, y) -> if y then x+1 else 2*x</code></td><td>if y → y : bool ; x+1 → x : int ; résultat int</td><td><code>int * bool -> int</code></td></tr>
 <tr><td><code>function (x, y) -> x + 2 * List.hd(y)</code></td><td>List.hd y est un int → y : int list</td><td><code>int * int list -> int</code></td></tr>
 <tr><td><code>fun x li -> x + List.hd li</code></td><td>x + … → x : int et List.hd li : int, donc li : int list ; curryfiée</td><td><code>int -> int list -> int</code></td></tr>
 <tr><td><code>function (x, y) -> if x > y then x > y else y > 2*x</code></td><td>2*x → x : int ; x > y → y : int ; résultat bool</td><td><code>int * int -> bool</code></td></tr></tbody></table></div>`;},
 formal:`<p>Signature = types des paramètres → type du résultat. Couple : <code>t1 * t2 -> t</code>. Curryfiée : <code>t1 -> t2 -> t</code>. Liste : <code>t list</code>.</p><p>Dans le cours, la signature s'écrit directement dans la définition : c'est la meilleure façon de ne pas l'oublier sur ta copie.</p>${M(`let rec longueur : int list -> int = function
  li -> if li = [] then 0 else 1 + longueur (List.tl li)

let rec prodDiv : int -> int -> int = fun n i -> ...`)}`,
 use:`<p>Dans chaque question du partiel 2021 (2 à 6), il fallait donner la signature de la fonction écrite : c'est une partie des points à chaque fois.</p>`,
 trap:`Une flèche par paramètre en forme curryfiée (int -> int -> int), une étoile entre les paramètres d'un couple (int * int -> int). Ne mélange pas les deux.`,
 q:"Signature de let h = function (x, y) -> x + 2 * List.hd(y) ?",a:"int * int list -> int : List.hd y est ajouté à un int, donc y est une int list.",rel:["pf-fonctions","pf-listes-rec"]});

/* ---------- chapitre 3 : récursivité ---------- */
add(3,{id:"pf-rec",type:"def",ref:"Cours, TD ex. 12 à 17",t:"Fonctions récursives : let rec",short:"Récursivité (let rec)",
 plain:`Une fonction récursive s'écrit avec ${hl("let rec")}. On écrit d'abord la récurrence sur papier : ${hl("cas de base")} (souvent n = 0) et ${hl("équation de récurrence")} (f(n) en fonction de f(n − 1)), puis on traduit. Déroule le calcul ci-dessous.`,
 fig:()=>h=>W.rewrite(h,{params:[{k:"n",label:"som",min:0,max:8,val:4}],gen:p=>{const n=p.n,L=[`som ${n}`];let acc=[];for(let k=n;k>0;k--){acc.push(k);L.push(acc.join(" + (")+" + som "+(k-1)+")".repeat(acc.length-1));}if(n>0){L.push(acc.join(" + (")+" + 0"+")".repeat(acc.length-1));}L.push(String(n*(n+1)/2));return L;}}),
 formal:`${M(`let rec som n = if n = 0 then 0 else n + som (n - 1)
(* som : int -> int *)

let rec f : int -> int = function       (* la forme du cours, signature comprise *)
  n -> if n = 0 then 5 else 2 * n + f (n - 1)       (* f n = n(n+1) + 5 *)

let rec carre n = if n = 0 then 0 else carre (n - 1) + n + n - 1
(* car (n-1)² = n² - 2n + 1 *)`)}`,
 use:`<p>Méthode des TD : « Cas de base quand n = 0, som(n) = … ; Récurrence quand n > 0, som(n) = … ». Écris ces deux lignes avant le code : c'est la moitié de la réponse.</p>`,
 trap:`Sans rec, la fonction ne peut pas s'appeler elle-même. Et écris f (n - 1) avec parenthèses : f n - 1 se lit (f n) - 1, qui boucle à l'infini.`,
 q:"Écris som : int -> int qui calcule 0 + 1 + … + n.",a:"let rec som n = if n = 0 then 0 else n + som (n - 1)",rel:["pf-rec-ex","pf-erreurs"]});

add(3,{id:"pf-rec-ex",type:"meth",ref:"Partiel 2021 Q3-Q4, TD ex. 18, 21",t:"Récursivité sur les chiffres et les diviseurs",short:"Chiffres et diviseurs",cc:"7 pts au partiel 2021",
 plain:`Deux schémas reviennent : parcourir ${hl("les chiffres")} d'un entier (n mod 10 est le dernier chiffre, n / 10 enlève le dernier chiffre), et parcourir ${hl("les candidats diviseurs")} i de i jusqu'à 1 avec un paramètre en plus.`,
 fig:()=>h=>W.rewrite(h,{params:[{k:"i",label:"prodDiv 45",min:1,max:9,val:7}],gen:p=>{const n=45;const L=[`prodDiv 45 ${p.i}`];let i=p.i,pre=[];while(i>0){const d=45%i===0;pre.push(d?`${i} * `:"");L.push(pre.join("")+`prodDiv 45 ${i-1}`+(d?"":`   (${i} ne divise pas 45)`));i--;}L.push(pre.join("")+"1");let r=1;for(let k=1;k<=p.i;k++)if(45%k===0)r*=k;L.push(String(r));return L;}}),
 formal:`${M(`(* Partiel 2021, Q3 *)
let rec queDesUn n =
  if n < 10 then n = 1
  else (n mod 10 = 1) && queDesUn (n / 10)
(* queDesUn : int -> bool *)

(* Partiel 2021, Q4 : produit des diviseurs de n inférieurs ou égaux à i *)
let rec prodDiv n i =
  if i = 0 then 1
  else if n mod i = 0 then i * prodDiv n (i - 1)
  else prodDiv n (i - 1)
(* prodDiv : int -> int -> int *)

(* TD ex. 21 *)
let rec nbDiv n i = if i = 0 then 0
  else (if n mod i = 0 then 1 else 0) + nbDiv n (i - 1)
let estPremier n = nbDiv n n = 2`)}`,
 use:`<p>Partiel 2021 : queDesUn (3 points) et prodDiv (4 points). Le paramètre i descend jusqu'à 0 (cas de base) ; à chaque étape on teste si i divise n.</p>`,
 trap:`Pour un produit, le cas de base vaut 1 (pas 0). Pour un compte ou une somme, il vaut 0.`,
 q:"Que vaut prodDiv 12 5 ? (partiel 2021)",a:"24 : les diviseurs de 12 inférieurs ou égaux à 5 sont 1, 2, 3, 4, et 1 × 2 × 3 × 4 = 24.",rel:["pf-rec"]});

/* ---------- chapitre 4 : listes (TD ex. 22 à 31), écrites comme dans le cours : if li = [] … List.hd … List.tl ---------- */
add(4,{id:"pf-listes",type:"def",ref:"Cours p. 50-52, TD ex. 22 et 23",t:"Les listes : [], ::, List.hd, List.tl",short:"Les listes",
 plain:`Une liste OCaml s'écrit ${hl("[2; 3; 2; 4]")} avec des points-virgules. Tous ses éléments ont le même type. ${hl("x :: li")} ajoute x devant, ${hl("List.hd li")} donne le premier élément (la tête), ${hl("List.tl li")} la liste sans le premier (la queue). Essaie les trois opérations.`,
 fig:()=>h=>W.listlab(h,{ml:true,start:[2,3,2,4]}),
 formal:`<ul><li>[] : liste vide. [2; 3] : int list. ["un"; "deux"] : string list.</li><li><code>x :: li</code> : ajout en tête (x du même type que les éléments).</li><li><code>List.hd li</code> : premier élément ; <code>List.tl li</code> : la liste sans le premier. Sur [] : erreur à l'exécution (exception).</li><li><code>List.tl [7] = []</code> vaut true : c'est le test « la liste n'a qu'un élément ».</li></ul>${M(`(* exemples du cours *)
let deuxieme : int list -> int = function
  li -> List.hd (List.tl li)
let oterDeuxieme : int list -> int list = function
  li -> List.hd li :: List.tl (List.tl li)

(* TD ex. 23 : inverser les deux premiers éléments *)
let inverserElem : int list -> int list = function
  li -> List.hd (List.tl li) :: List.hd li :: List.tl (List.tl li)
(* inverserElem [1; 2; 3] = [2; 1; 3] *)`)}`,
 use:`<p>TD ex. 22 et partiel Q1 : évaluer des expressions avec List.hd, List.tl et ::. Écris les étapes intermédiaires : List.tl (List.tl [2; 3; 2; 4]) = List.tl [3; 2; 4] = [2; 4].</p>`,
 trap:`[2, 3] (avec une virgule) n'est pas [2; 3] : c'est une liste à un seul élément, le couple (2, 3). Et 8 :: 3 est une erreur : à droite de ::, il faut une liste (8 :: [3]).`,
 q:"Que vaut List.hd (List.tl (List.tl [2; 3; 2; 4])) ?",a:"2 : List.tl deux fois donne [2; 4], dont la tête est 2.",rel:["pf-listes-rec","p/recettes"]});

const RW={
 som:{lab:"somElem [6; 9; 5]",L:["somElem [6; 9; 5]",["6 + somElem [9; 5]","la liste n'est pas vide : tête + appel sur la queue"],"6 + (9 + somElem [5])","6 + (9 + (5 + somElem []))",["6 + (9 + (5 + 0))","cas de base : somElem [] = 0"],"20"]},
 lon:{lab:"longueur [4; 3; 8]",L:["longueur [4; 3; 8]","1 + longueur [3; 8]","1 + (1 + longueur [8])","1 + (1 + (1 + longueur []))",["1 + (1 + (1 + 0))","cas de base"],"3"]},
 aj1:{lab:"ajout1 [3; 1; 8]",L:["ajout1 [3; 1; 8]",["(3 + 1) :: ajout1 [1; 8]","on construit la liste avec ::"],"4 :: (2 :: ajout1 [8])","4 :: (2 :: (9 :: ajout1 []))",["4 :: (2 :: (9 :: []))","cas de base : la liste vide"],"[4; 2; 9]"]},
 pref:{lab:"prefLong [3; 2; 4] 2",L:["prefLong [3; 2; 4] 2","3 :: prefLong [2; 4] 1","3 :: (2 :: prefLong [4] 0)",["3 :: (2 :: [])","n = 0 : cas de base"],"[3; 2]"]}};
add(4,{id:"pf-listes-rec",type:"meth",ref:"Cours p. 53-57, partiel 2021 Q5-Q6",t:"Le schéma récursif sur les listes",short:"Le schéma récursif",cc:"7 pts au partiel 2021",
 plain:`Toutes les fonctions sur les listes suivent le même schéma : ${hl("si li = [], la valeur de base")} ; ${hl("sinon, on combine List.hd li avec l'appel sur List.tl li")}. La liste raccourcit à chaque appel, donc on finit toujours par arriver à []. Choisis un exemple et déroule-le.`,
 fig:()=>h=>{h.innerHTML=`<div class="w-ctrl"><select data-r>${Object.entries(RW).map(([k,v])=>`<option value="${k}">${v.lab}</option>`).join("")}</select></div><div class="rwh"></div>`;const go=()=>W.rewrite(h.querySelector(".rwh"),{gen:()=>RW[h.querySelector("[data-r]").value].L});h.addEventListener("change",e=>{if(e.target.matches("[data-r]"))go();});go();},
 formal:`${M(`(* le schéma du cours *)
let rec g : int list -> ... = function
  li -> if li = [] then (valeur pour la liste vide)
        else ... List.hd li ... g (List.tl li) ...

let rec longueur : int list -> int = function
  li -> if li = [] then 0
        else 1 + longueur (List.tl li)

let rec somElem : int list -> int = function       (* partiel 2021, Q5 *)
  li -> if li = [] then 0
        else List.hd li + somElem (List.tl li)

let rec ajout1 : int list -> int list = function
  li -> if li = [] then []
        else (List.hd li + 1) :: ajout1 (List.tl li)

let rec prefLong : int list -> int -> int list = fun li n ->   (* partiel 2021, Q6 *)
  if li = [] || n = 0 then []
  else List.hd li :: prefLong (List.tl li) (n - 1)`)}`,
 gloss:["li = [] : le test « la liste est vide »","List.hd li : la tête","List.tl li : la queue","g (List.tl li) : l'appel récursif, toujours entre parenthèses"],
 use:`<p>Au partiel 2021, somElem valait 3 points et prefLong 4. Écris la signature en premier (let rec f : int list -> int = …), puis le cas de base, puis le cas général. Vérifie sur l'exemple de l'énoncé en déroulant comme ci-dessus.</p>`,
 trap:`somElem List.tl li est faux : OCaml lit (somElem List.tl) li. Écris somElem (List.tl li). Et n'appelle jamais List.hd sur une liste qui peut être vide : le test li = [] passe avant.`,
 q:"Écris somElem : int list -> int sans match.",a:"let rec somElem : int list -> int = function li -> if li = [] then 0 else List.hd li + somElem (List.tl li)",rel:["pf-listes-construire","pf-listes-tests","p/recettes"]});

add(4,{id:"pf-listes-construire",type:"code",ref:"TD ex. 24, 27, 28, 29, 30",t:"Fabriquer une liste : garder, enlever, ajouter",short:"Fabriquer une liste",
 plain:`Quand le résultat est une liste, le cas de base renvoie ${hl("[]")} (ou une petite liste), et le cas général ${hl("garde l'élément avec ::")} ou ${hl("le saute")} en rappelant simplement la fonction. Déroule un exemple : regarde quand un élément passe devant avec ::.`,
 fig:()=>h=>{h.innerHTML=`<div class="w-ctrl"><select data-r>${Object.entries(RW2).map(([k,v])=>`<option value="${k}">${v.lab}</option>`).join("")}</select></div><div class="rwh"></div>`;const go=()=>W.rewrite(h.querySelector(".rwh"),{gen:()=>RW2[h.querySelector("[data-r]").value].L});h.addEventListener("change",e=>{if(e.target.matches("[data-r]"))go();});go();},
 formal:`${M(`(* TD ex. 24 : listeEntiers 3 = [3; 2; 1; 0] *)
let rec listeEntiers : int -> int list = function
  n -> if n = 0 then [0]
       else n :: listeEntiers (n - 1)

(* TD ex. 27 : garder ou enlever les nombres pairs *)
let rec liPairs : int list -> int list = function
  li -> if li = [] then []
        else if List.hd li mod 2 = 0 then List.hd li :: liPairs (List.tl li)
        else liPairs (List.tl li)

let rec oterPairs : int list -> int list = function
  li -> if li = [] then []
        else if List.hd li mod 2 = 0 then oterPairs (List.tl li)
        else List.hd li :: oterPairs (List.tl li)

(* TD ex. 28 : diviseurs de n inférieurs ou égaux à i *)
let rec liDivInf : int -> int -> int list = fun n i ->
  if i = 0 then []
  else if n mod i = 0 then i :: liDivInf n (i - 1)
  else liDivInf n (i - 1)
let liDiv : int -> int list = function n -> liDivInf n n

(* TD ex. 29 et 30 *)
let rec ajouFin : int -> int list -> int list = fun x li ->
  if li = [] then [x]
  else List.hd li :: ajouFin x (List.tl li)

let rec inverseLi : int list -> int list = function
  li -> if li = [] then []
        else ajouFin (List.hd li) (inverseLi (List.tl li))`)}`,
 use:`<p>Garder : <code>x :: f (reste)</code>. Enlever : <code>f (reste)</code>. Ajouter à la fin : passe par ajouFin, car :: ajoute seulement devant. liDivInf a la même forme que prodDiv du partiel 2021, mais construit une liste au lieu d'un produit.</p>`,
 trap:`Ne confonds pas x :: li (un élément devant une liste) et li @ [x] (deux listes collées). Et le cas de base d'une liste résultat est [], pas 0.`,
 q:"Écris liPairs : int list -> int list, qui garde les nombres pairs.",a:"let rec liPairs : int list -> int list = function li -> if li = [] then [] else if List.hd li mod 2 = 0 then List.hd li :: liPairs (List.tl li) else liPairs (List.tl li)",rel:["pf-listes-rec","pf-listes-tests"]});

add(4,{id:"pf-listes-tests",type:"code",ref:"TD ex. 25, 26, 27, 31",t:"Tester une liste : tous, il existe, max, dernier",short:"Tester une liste",
 plain:`Pour un test, le résultat est un bool. ${hl("« Tous »")} : base true, et on combine avec &&. ${hl("« Il existe »")} : base false, et on combine avec ||. Pour une liste ${hl("non vide")} (max, dernier), le cas de base est la liste à un seul élément : ${hl("List.tl li = []")}.`,
 fig:()=>h=>{h.innerHTML=`<div class="w-ctrl"><select data-r>${Object.entries(RW3).map(([k,v])=>`<option value="${k}">${v.lab}</option>`).join("")}</select></div><div class="rwh"></div>`;const go=()=>W.rewrite(h.querySelector(".rwh"),{gen:()=>RW3[h.querySelector("[data-r]").value].L});h.addEventListener("change",e=>{if(e.target.matches("[data-r]"))go();});go();},
 formal:`${M(`(* TD ex. 27 *)
let rec tousPairs : int list -> bool = function
  li -> if li = [] then true
        else List.hd li mod 2 = 0 && tousPairs (List.tl li)

let rec exiPairs : int list -> bool = function
  li -> if li = [] then false
        else List.hd li mod 2 = 0 || exiPairs (List.tl li)

(* TD ex. 25 et 26 : listes non vides *)
let rec derListe : int list -> int = function
  li -> if List.tl li = [] then List.hd li
        else derListe (List.tl li)

let rec maxListe : int list -> int = function
  li -> if List.tl li = [] then List.hd li
        else max (List.hd li) (maxListe (List.tl li))

(* TD ex. 31 : deux listes *)
let rec prefixe : int list -> int list -> bool = fun l1 l2 ->
  if l1 = [] then true
  else if l2 = [] then false
  else List.hd l1 = List.hd l2 && prefixe (List.tl l1) (List.tl l2)

let rec suffixe : int list -> int list -> bool = fun l1 l2 ->
  l1 = l2 || (l2 <> [] && suffixe l1 (List.tl l2))

let rec facteur : int list -> int list -> bool = fun l1 l2 ->
  prefixe l1 l2 || (l2 <> [] && facteur l1 (List.tl l2))`)}`,
 use:`<p>« Tous » : tousPairs [] vaut true (aucun contre-exemple). « Il existe » : exiPairs [] vaut false. Pour l'exercice 31, réutilise prefixe : l1 est facteur de l2 s'il en est préfixe, ou facteur de la queue de l2.</p>`,
 trap:`maxListe et derListe n'ont pas de cas li = [] : la liste est supposée non vide. Si tu testes li = [] à la place de List.tl li = [], tu appelles List.hd sur la liste vide.`,
 q:"Quelle valeur de base pour « tous les éléments vérifient… » sur la liste vide ?",a:"true, et on combine avec && : List.hd li mod 2 = 0 && tousPairs (List.tl li).",rel:["pf-listes-rec","pf-listes-construire"]});

add(5,{id:"pf-erreurs",type:"meth",ref:"Synthèse",t:"Les erreurs classiques à éviter",short:"Erreurs classiques",
 plain:`La plupart des points perdus viennent de ${hl("quelques erreurs de type")} toujours les mêmes. Relis cette liste avant le contrôle : sur papier, personne ne te les signale.`,

 formal:`<p>Avant de rendre : vérifie le type de chaque branche, la présence de rec, les parenthèses autour des arguments, et donne la signature de chaque fonction.</p>`,
 use:`<p>Au partiel, chaque fonction doit être accompagnée de sa signature : c'est une vérification gratuite de tes types.</p>`,
 trap:`OCaml ne convertit jamais tout seul entre int et float.`,
 q:"Pourquoi f n - 1 ne calcule-t-il pas f (n − 1) ?",a:"L'application de fonction est prioritaire : f n - 1 se lit (f n) - 1. Dans une fonction récursive, cela boucle à l'infini.",rel:["pf-types","pf-rec","p/recettes"]});

add(6,{id:"pf-match",type:"def",maybe:"Ton mail dit que le filtrage n'est pas sûr. Toutes les fonctions du site sont écrites sans match : apprends d'abord celles-là. Lis cette fiche s'il te reste du temps, pour savoir évaluer un match (TD ex. 32).",ref:"Cours p. 58, TD ex. 32 à 34",t:"Le filtrage : match … with",short:"Le filtrage (match)",
 plain:`match compare une valeur à ${hl("des motifs, de haut en bas")}, et prend le ${hl("premier qui correspond")}. Sur les listes, les deux motifs de base sont [] et x :: r. when ajoute une condition, _ attrape tout.`,
 fig:()=>matchLab,
 formal:`${M(`match e with
| motif1 -> résultat1
| motif2 when condition -> résultat2
| _ -> résultat_par_défaut

(* exiPairs avec match : même fonction que la version avec if *)
let rec exiPairs li = match li with
  | [] -> false
  | x :: r -> x mod 2 = 0 || exiPairs r`)}<ul><li>Tous les résultats ont le même type.</li><li>x :: r donne directement un nom à la tête (x) et à la queue (r) : x remplace List.hd li, r remplace List.tl li.</li><li>OCaml prévient si un cas manque ou ne sert jamais.</li></ul>`,
 use:`<p>TD ex. 32 : évaluer un match pour n = 0, 6, 3. Teste chaque cas dans l'ordre, sans sauter.</p>`,
 trap:`L'ordre des cas compte : un cas placé après « _ » ou après un cas plus général n'est jamais atteint (le « | 3 -> 0 » de l'exercice 32).`,
 q:"Avec le match de l'exercice 32, que vaut le résultat pour n = 6 ?",a:"3 : 6 n'est pas 1, n'est pas négatif, et il est pair, donc n / 2 = 3.",rel:["pf-listes-rec"]});

add(6,{id:"pf-lili",type:"meth",maybe:"Les exercices 35 et 36 sont dans la partie « filtrage » du TD, après les listes : pas sûr qu'ils tombent. Ils s'écrivent quand même sans match, avec le même schéma.",ref:"TD ex. 35 et 36",t:"nbOcc et listes de listes",short:"nbOcc, listes de listes",
 plain:`Une liste peut contenir des listes : [[1; 2]; [3; 1; 0]; []; [8]] est une ${hl("int list list")}. On la parcourt comme une liste ordinaire : la tête est une liste, à laquelle on applique une autre fonction.`,
 fig:()=>h=>W.drill(h,[{e:"List.hd [[1;2]; [3;1;0]; []; [8]]",t:"int list",v:"[1; 2]"},{e:"[3] :: List.tl [[1;2]; [3;1;0]; []; [8]]",t:"int list list",v:"[[3]; [3; 1; 0]; []; [8]]"},{e:"3 :: [[1;2]; [8]]",t:"erreur",why:"3 est un int, les éléments sont des int list."},{e:"List.tl [[1;2]; [8]]",t:"int list list",v:"[[8]]"}],["int","int list","int list list","erreur"]),
 formal:`${M(`(* TD ex. 35 : nbOcc 3 [3; 8; 9; 3; 0] = 2 *)
let rec nbOcc : int -> int list -> int = fun x li ->
  if li = [] then 0
  else (if List.hd li = x then 1 else 0) + nbOcc x (List.tl li)

(* TD ex. 36 *)
let rec nbOccLiLi : int -> int list list -> int = fun n lili ->
  if lili = [] then 0
  else nbOcc n (List.hd lili) + nbOccLiLi n (List.tl lili)

let rec liSuff : int list -> int list list = function
  li -> if li = [] then [[]]
        else li :: liSuff (List.tl li)
(* liSuff [1; 2] = [[1; 2]; [2]; []] *)`)}`,
 use:`<p>Réutilise une fonction déjà écrite (nbOcc) sur chaque sous-liste : c'est ce que demande l'exercice 36.</p>`,
 trap:`3 :: li est une erreur si li est une int list list ; il faut [3] :: li.`,
 q:"Quel est le type de [[1; 2]; []; [8]] ?",a:"int list list.",rel:["pf-listes-rec"]});

add(7,{id:"pf-poly",type:"def",out:"Ton mail le dit : pas de polymorphisme au contrôle. Dans tes réponses, écris les types de l'énoncé (int list). Garde cette fiche pour l'examen de janvier.",ref:"Cours, TD ex. 37 et suivants",t:"Le polymorphisme : le type 'a",short:"Polymorphisme ('a)",
 plain:`Quand une fonction ne regarde pas vraiment le type des éléments, OCaml lui donne un type ${hl("'a")} (« alpha »), qui veut dire « n'importe quel type, mais le même partout ». Ainsi derListe marche sur des listes d'entiers, de chaînes, etc.`,
 fig:()=>h=>{h.innerHTML=M(`let rec derListe li = if List.tl li = [] then List.hd li else derListe (List.tl li)
(* derListe : 'a list -> 'a *)
derListe [3; 5; 1]        (* 1 *)
derListe ["a"; "b"]       (* "b" *)
max                        (* 'a -> 'a -> 'a *)
List.hd                    (* 'a list -> 'a *)`);},
 formal:`<p>'a, 'b… sont des variables de type. Dans 'a -> 'a list -> bool, les deux 'a sont le même type.</p>`,
 use:`<p>TD : « modifiez la définition pour qu'elle s'applique à tout type de liste ». Il suffit souvent d'enlever l'annotation int list.</p>`,
 trap:`Si tu utilises + ou mod sur les éléments, le type redevient int : ce n'est plus polymorphe.`,
 q:"Quel est le type de List.hd ?",a:"'a list -> 'a.",rel:["pf-signature"]});

 {id:"28",s:3,t:"liDivInf et liDiv",en:"liDivInf n i : liste des diviseurs de n inférieurs ou égaux à i. liDivInf 20 4 = [4;2;1], liDivInf 7 5 = [1]. Puis liDiv.",link:"pf-listes-construire",
  hint:"Même forme que nbDiv (ex. 21) et prodDiv (partiel 2021), mais le cas de base vaut [] et on ajoute i devant avec ::.",
  sol:M(`let rec liDivInf : int -> int -> int list = fun n i ->
  if i = 0 then []
  else if n mod i = 0 then i :: liDivInf n (i - 1)
  else liDivInf n (i - 1)

let liDiv : int -> int list = function n -> liDivInf n n`)},
 {id:"29",s:2,t:"ajouFin",en:"Ajouter un élément à la fin d'une liste. ajouFin 4 [5;4;2] = [5;4;2;4].",link:"pf-listes-construire",
  sol:M(`let rec ajouFin : int -> int list -> int list = fun x li ->
  if li = [] then [x]
  else List.hd li :: ajouFin x (List.tl li)`)},
 {id:"30",s:2,t:"inverseLi",en:"Inverser l'ordre des éléments d'une liste. inverseLi [1;4;2] = [2;4;1].",link:"pf-listes-construire",
  hint:"Inverse la queue, puis mets la tête à la fin avec ajouFin.",
  sol:M(`let rec inverseLi : int list -> int list = function
  li -> if li = [] then []
        else ajouFin (List.hd li) (inverseLi (List.tl li))`)},
 {id:"31",s:3,t:"prefixe, suffixe, facteur",en:"[3;2;3] est préfixe et facteur de [3;2;3;4;2], suffixe et facteur de [4;3;2;3], facteur de [4;2;3;2;3;8]. [] est préfixe, suffixe et facteur de toute liste.",link:"pf-listes-tests",
  hint:"prefixe : compare les têtes, puis les queues. suffixe : l1 = l2, ou l1 est suffixe de la queue de l2. facteur : préfixe, ou facteur de la queue de l2.",
  sol:M(`let rec prefixe : int list -> int list -> bool = fun l1 l2 ->
  if l1 = [] then true
  else if l2 = [] then false
  else List.hd l1 = List.hd l2 && prefixe (List.tl l1) (List.tl l2)

let rec suffixe : int list -> int list -> bool = fun l1 l2 ->
  l1 = l2 || (l2 <> [] && suffixe l1 (List.tl l2))

let rec facteur : int list -> int list -> bool = fun l1 l2 ->
  prefixe l1 l2 || (l2 <> [] && facteur l1 (List.tl l2))`)},
 {id:"32",s:2,note:"filtrage, pas sûr",t:"Évaluer un match",en:"Valeur du match de l'exercice 32 pour n = 0, 6 et 3.",link:"pf-match",sol:`<p>n = 0 → 0 (pair : 0/2). n = 6 → 3. n = 3 → 4 (impair : 3 + 1) ; le cas « 3 » n'est jamais atteint.</p>`},
 {id:"35",s:2,note:"pas sûr",t:"nbOcc",en:"Nombre d'occurrences d'une valeur dans une liste. nbOcc 3 [3;8;9;3;0] = 2.",link:"pf-lili",sol:M(`let rec nbOcc : int -> int list -> int = fun x li ->
  if li = [] then 0
  else (if List.hd li = x then 1 else 0) + nbOcc x (List.tl li)`)},
 {id:"36",s:2,note:"pas sûr",t:"Listes de listes",en:"Évaluer des expressions sur [[1;2];[3;1;0];[];[8]], écrire nbOccLiLi et liSuff.",link:"pf-lili",sol:`<p>List.hd li = [1; 2] ; List.tl li = [[3;1;0]; []; [8]] ; 3 :: li est une erreur ; [3] :: List.tl li = [[3]; [3;1;0]; []; [8]].</p>${M(`let rec nbOccLiLi : int -> int list list -> int = fun n lili ->
  if lili = [] then 0
  else nbOcc n (List.hd lili) + nbOccLiLi n (List.tl lili)

let rec liSuff : int list -> int list list = function
  li -> if li = [] then [[]]
        else li :: liSuff (List.tl li)`)}`}];

 {src:"Examen janvier 2022 · Ex. 1 · 7 pts sur 21",t:"Nombres de Fermat",en:`<p>F<sub>n</sub> = 2^(2^n) + 1 : F₀ = 3, F₁ = 5, F₂ = 17, F₃ = 257. Forme curryfiée dès qu'il y a deux arguments.</p><ol><li>pow x y calcule xʸ avec x ** y (sur des float), float_of_int et int_of_float.</li><li>fermat_nbr n rend F<sub>n</sub>.</li><li>is_fermat_rec p n teste s'il existe un nombre de Fermat égal à p de rang ≥ n (is_fermat_rec 15 2 = false car F₂ = 17 > 15), puis is_fermat p.</li><li>fermat_list n rend la liste des n premiers nombres de Fermat (ordre libre).</li></ol>`,who:"Mon corrigé (examen de janvier, mais ces questions sont dans ton programme)",go:"pf-rec-ex",
  hint:"Pour is_fermat_rec : calcule f = fermat_nbr n avec un let … in. Si f > p, c'est perdu ; sinon f = p, ou on essaie le rang n + 1.",
  sol:M(`let pow : int -> int -> int = fun x y ->
  int_of_float (float_of_int x ** float_of_int y)

let fermat_nbr : int -> int = function
  n -> pow 2 (pow 2 n) + 1

let rec is_fermat_rec : int -> int -> bool = fun p n ->
  let f = fermat_nbr n in
  if f > p then false
  else f = p || is_fermat_rec p (n + 1)

let is_fermat : int -> bool = function p -> is_fermat_rec p 0

let rec fermat_list : int -> int list = function
  n -> if n = 0 then []
       else fermat_nbr (n - 1) :: fermat_list (n - 1)
(* fermat_list 3 = [17; 5; 3] *)`)},
 {src:"Examen janvier 2024 · Ex. 1, questions 1 et 3",t:"Triplets de Pythagore",en:`<p>(x, y, z) est pythagoricien si x² + y² = z². Formule : pour n ≥ 1, (2n + 1, 2n² + 2n, 2n² + 2n + 1) est pythagoricien.</p><ol><li>est_pytha x y z vérifie la relation.</li><li>genere_pytha m rend la liste des triplets de la formule dont x, y, z ≤ m. genere_pytha 50 = [(3, 4, 5); (5, 12, 13); (7, 24, 25); (9, 40, 41)].</li></ol>`,who:"Mon corrigé (la question 2 utilise les exceptions, hors programme)",go:"pf-listes-construire",

  sol:M(`let est_pytha : int -> int -> int -> bool = fun x y z ->
  x * x + y * y = z * z

let rec genere_rec : int -> int -> (int * int * int) list = fun n m ->
  let x = 2 * n + 1 and y = 2 * n * n + 2 * n and z = 2 * n * n + 2 * n + 1 in
  if z > m then []
  else (x, y, z) :: genere_rec (n + 1) m

let genere_pytha : int -> (int * int * int) list = function m -> genere_rec 1 m`)}];

const recettes=({sec})=>`<div class="title-row"><h1>Recettes pas à pas</h1></div><p class="lead">Le contrôle est sur papier : pas d'OCaml pour te signaler une erreur. Applique ces étapes dans l'ordre, pour chaque fonction.</p>
 ${sec(1,"Écrire une fonction récursive en 5 étapes",`<div class="recipe"><ol>
  <li><b>La signature d'abord.</b> Quels paramètres, de quels types, et quel résultat ? Écris-la dans la définition, comme dans le cours : <code>let rec somElem : int list -> int = function li -></code>. Plusieurs paramètres : forme curryfiée, <code>fun n i -></code>.</li>
  <li><b>Le cas de base.</b> Que vaut la fonction pour la liste vide (ou pour n = 0, i = 0) ? Sers-toi d'un exemple de l'énoncé : somElem [] = 0.</li>
  <li><b>Le cas général.</b> Suppose que l'appel sur List.tl li (ou n − 1) donne la bonne réponse. Comment obtenir la réponse pour li à partir de List.hd li ? somElem [6; 9; 5] = 6 + somElem [9; 5].</li>
  <li><b>Traduis</b> : <code>if li = [] then (cas de base) else (… List.hd li … f (List.tl li) …)</code>.</li>
  <li><b>Déroule un exemple</b> de l'énoncé à la main, comme dans les fiches. Si tu ne retombes pas sur le résultat attendu, c'est le cas de base ou le cas général qui est faux.</li></ol></div>`)}
 ${sec(2,"Ce que dit l'énoncé, ce que tu écris",`<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>L'énoncé demande</th><th>Cas de base</th><th>Cas général</th></tr></thead><tbody>
  <tr><td>une somme, une longueur, un nombre de…</td><td><code>0</code></td><td><code>… + f (List.tl li)</code></td></tr>
  <tr><td>un produit</td><td><code>1</code></td><td><code>… * f (List.tl li)</code></td></tr>
  <tr><td>« tous les éléments vérifient… »</td><td><code>true</code></td><td><code>(test sur List.hd li) && f (List.tl li)</code></td></tr>
  <tr><td>« il existe un élément qui… »</td><td><code>false</code></td><td><code>(test sur List.hd li) || f (List.tl li)</code></td></tr>
  <tr><td>une liste : garder certains éléments</td><td><code>[]</code></td><td><code>if (test) then List.hd li :: f (List.tl li) else f (List.tl li)</code></td></tr>
  <tr><td>une liste : transformer chaque élément</td><td><code>[]</code></td><td><code>(calcul sur List.hd li) :: f (List.tl li)</code></td></tr>
  <tr><td>une liste non vide (max, dernier)</td><td><code>if List.tl li = [] then List.hd li</code></td><td><code>… f (List.tl li) …</code></td></tr>
  <tr><td>les chiffres d'un entier</td><td><code>if n &lt; 10 then …</code></td><td><code>… n mod 10 … f (n / 10)</code></td></tr>
  <tr><td>les diviseurs de n jusqu'à i</td><td><code>if i = 0 then …</code></td><td><code>if n mod i = 0 then … f n (i - 1) else f n (i - 1)</code></td></tr></tbody></table></div>`)}
 ${sec(3,"Trouver un type ou une valeur",`<div class="recipe"><ol><li>Regarde les opérateurs : + - * / mod veulent des int, +. -. *. /. des float, && || not des bool, ^ des string.</li><li>Les deux branches d'un if ont le même type ; la condition est un bool.</li><li>À droite de ::, une liste ; à gauche, un élément du même type que ceux de la liste.</li><li>Calcule la valeur étape par étape, en écrivant chaque résultat intermédiaire.</li></ol><p>Entraîne-toi avec <a href="#/p/types">l'entraînement types et valeurs</a>.</p></div>`)}
 ${sec(4,"Avant de rendre ta copie",`<div class="paper"><b>Pour chaque fonction, vérifie :</b><ul><li>le mot <code>rec</code> si la fonction s'appelle elle-même ;</li><li>la signature écrite (et cohérente : int list, pas int) ;</li><li>la forme curryfiée dès qu'il y a deux paramètres ;</li><li>des parenthèses autour de chaque argument calculé : <code>f (List.tl li)</code>, <code>f (n - 1)</code> ;</li><li>un <code>else</code> pour chaque <code>if</code>, et le même type dans les deux branches ;</li><li>pas de List.hd sans avoir testé que la liste n'est pas vide ;</li><li>les opérateurs à point pour les float : <code>+.</code>, <code>*.</code>.</li></ul></div>`)}`;
const feuille=`<div class="title-row"><h1>Ma feuille A4</h1><button class="btn pri" onclick="window.print()">Imprimer cette feuille</button></div>
<p class="lead no-print">Une feuille A4 est autorisée au contrôle (tes camarades le confirment). Voici l'essentiel sur une page. Recopie-la à la main : la réécrire t'oblige à la reformuler, et c'est ça qui fait retenir.</p>
<div class="a4">
<div><h3>Types et opérateurs</h3><p>int : + - * / (division entière) mod. float : +. -. *. /. (avec un point), 3.0 ou 3. ; float_of_int, int_of_float (tronque). bool : && || not. string : ^. Comparaisons = &lt;&gt; &lt; &gt; &lt;= &gt;= entre deux valeurs du même type. Jamais de mélange int/float.</p><p><b>if c then a else b</b> : c bool, a et b même type, else obligatoire. <b>let x = e1 in e2</b> ; avec <b>and</b>, les définitions ne se voient pas entre elles.</p></div>
<div><h3>Fonctions et signatures</h3>${M(`let f : int -> int = function n -> 2 * n + 1
let g : int * int -> bool = function (x, y) -> x < y      (* couple *)
let h : int -> int -> int = fun a b -> a + b             (* curryfiée *)
h 2 3        g (2, 3)        f (n - 1)`)}<p>Signature : types des paramètres puis du résultat. Une flèche par paramètre (curryfiée), une étoile dans un couple. Deux paramètres ou plus : forme curryfiée.</p></div>
<div><h3>Récursivité</h3>${M(`let rec f : int -> int = function
  n -> if n = 0 then (cas de base) else ... f (n - 1) ...
let rec chiffres n = if n < 10 then ... else ... n mod 10 ... (n / 10)
let rec div n i = if i = 0 then ... else if n mod i = 0 then ... else ...`)}<p>rec obligatoire. f (n - 1) entre parenthèses. Somme, compte : base 0. Produit : base 1.</p></div>
<div><h3>Listes</h3>${M(`let rec g : int list -> int = function
  li -> if li = [] then (base)
        else ... List.hd li ... g (List.tl li) ...`)}<p>[2; 3] avec des points-virgules. x :: li ajoute devant ; li @ [x] à la fin. Somme : base 0, +. Tous : base true, &&. Il existe : base false, ||. Garder : List.hd li :: g (List.tl li), sinon g (List.tl li). Liste non vide (max, dernier) : if List.tl li = [] then List.hd li.</p><p><b>Au cas où (match)</b> : match li with [] -> … | x :: r -> … : x = List.hd li, r = List.tl li.</p></div>
</div>`;

<script>

(function(){

const FUN=[
 {t:"f(x) = x(x+5)/(x²+x)  (CC1 2025)",f:x=>x*(x+5)/(x*x+x),df:x=>-4*x*x/((x*x+x)**2),dom:"ℝ ∖ {−1, 0}",holes:[0],asym:[-1],xr:[-4,4],yr:[-6,8],lim:"→ 1 en ±∞"},

 {t:"f(x) = e^(cos x)",f:x=>Math.exp(Math.cos(x)),df:x=>-Math.sin(x)*Math.exp(Math.cos(x)),dom:"ℝ",xr:[-7,7],yr:[-0.5,3.2],lim:"pas de limite en ±∞ (périodique)"},

 {t:"f(x) = (x²−4)/(x²−3x+2)  (TD 1, ex. 2g)",f:x=>(x*x-4)/(x*x-3*x+2),df:x=>{const u=x*x-4,v=x*x-3*x+2;return(2*x*v-u*(2*x-3))/(v*v);},dom:"ℝ ∖ {1, 2}",holes:[2],asym:[1],xr:[-4,6],yr:[-8,10],lim:"→ 4 en 2 (trou), → 1 en ±∞"}];

   buttons:FUN.map((fn,i)=>({label:fn.t.split("  ")[0].replace("f(x) = ",""),act:(P,S)=>{S.k=i;const pl=pp(S);P.M=V(pl.X((fn.xr[0]+fn.xr[1])/2+0.37),0);P.M=snap(P.M,P,S);}})),
   con:{M:(p,P,S)=>snap(p,P,S)},
   after:(P,S,Fg)=>{if(!Fg._i){Fg._i=1;P.M=snap(P.M,P,S);Fg.render();}},
   draw:(P,S)=>{const fn=FUN[S.k],pl=pp(S);let s=pl.axes();(fn.asym||[]).forEach(a=>{s+=D.seg(V(pl.X(a),0),V(pl.X(a),H0),"l-red-d");});
     s+=pl.path(fn.f,"l-cob");(fn.holes||[]).forEach(a=>{const y=lim(fn.f,a);if(isFinite(y))s+=`<circle cx="${pl.X(a)}" cy="${pl.Y(y)}" r="5" class="l-red" style="fill:var(--feuille)"/>`;});
     const x0=pl.ix(P.M.x),y0=fn.f(x0);if(mode==="tan"&&isFinite(y0)){const m=fn.df(x0);s+=pl.path(x=>y0+m*(x-x0),"l-amb-d",x0-3,x0+3);}
     return s;},
   info:(P,S)=>{const fn=FUN[S.k],pl=pp(S),x0=pl.ix(P.M.x),y0=fn.f(x0);
     return R.h(fn.t)+R.m([["Domaine",fn.dom],["x",fr(x0)],["f(x)",isFinite(y0)?fr(y0,3):"non définie"],mode==="tan"&&isFinite(y0)?["f′(x)",fr(fn.df(x0),3)]:null,["Limites",fn.lim]])+R.v(mode==="tan"?"La tangente (pointillés orange) a pour pente f′(x) : déplace M pour voir le signe de f′ changer.":"Les pointillés rouges sont les valeurs interdites. Un rond vide est un « trou » : f n'y est pas définie mais a une limite finie.","info");},
   hint:"Attrape M : il glisse sur la courbe."};
  function pp(S){const fn=FUN[S.k];return W.plotter(W0,H0,fn.xr[0],fn.xr[1],fn.yr[0],fn.yr[1]);}
  function snap(p,P,S){const fn=FUN[S.k],pl=pp(S);let x=pl.ix(p.x);let y=fn.f(x);if(!isFinite(y)){x+=0.03;y=fn.f(x);}if(!isFinite(y))return P.M;y=Math.max(fn.yr[0],Math.min(fn.yr[1],y));return V(pl.X(x),pl.Y(y));}
  function lim(f,a){return(f(a-1e-6)+f(a+1e-6))/2;}
}
function areaFig(){
  const W0=560,H0=300,fs=[{t:"x sin x (CC 2023)",f:x=>x*Math.sin(x),xr:[-1,7],yr:[-5,3],a:0,b:2*Math.PI,exact:"−2π ≈ −6,28 sur [0, 2π]"},{t:"2x cos(x²) (CC 2025)",f:x=>2*x*Math.cos(x*x),xr:[-3,3],yr:[-5,5],a:-Math.sqrt(Math.PI/2),b:Math.sqrt(2*Math.PI),exact:"−1 sur [−√(π/2), √(2π)]"},{t:"x ln x (CC 2025)",f:x=>x>0?x*Math.log(x):NaN,xr:[-0.2,3],yr:[-0.6,3.5],a:1,b:2,exact:"2 ln 2 − 3/4 ≈ 0,64 sur [1, 2]"},{t:"x³ (impaire)",f:x=>x**3,xr:[-2,2],yr:[-6,6],a:-1.5,b:1.5,exact:"0 sur un intervalle symétrique"}];
  const pp=S=>{const g=fs[S.k];return W.plotter(W0,H0,g.xr[0],g.xr[1],g.yr[0],g.yr[1]);};
  return {w:W0,h:H0,P:{A:[0,0],B:[0,0]},S:{k:0},labels:{A:"a",B:"b"},
   buttons:fs.map((g,i)=>({label:g.t,act:(P,S)=>{S.k=i;place(P,S);}})),
   con:{A:(p,P,S)=>V(p.x,pp(S).Y(0)),B:(p,P,S)=>V(p.x,pp(S).Y(0))},
   after:(P,S,Fg)=>{if(!Fg._init){Fg._init=1;place(P,S);Fg.render();}},
   draw:(P,S)=>{const g=fs[S.k],pl=pp(S),a=pl.ix(P.A.x),b=pl.ix(P.B.x);const lo=Math.min(a,b),hi=Math.max(a,b);
     return pl.axes()+pl.area(x=>{const y=g.f(x);return isFinite(y)&&y>0?y:0;},lo,hi,"f-ok")+pl.area(x=>{const y=g.f(x);return isFinite(y)&&y<0?y:0;},lo,hi,"f-red")+pl.path(g.f,"l-cob");},
   info:(P,S)=>{const g=fs[S.k],pl=pp(S),a=pl.ix(P.A.x),b=pl.ix(P.B.x);let s=0;const n=400,h=(b-a)/n;for(let i=0;i<=n;i++){let y=g.f(a+i*h);if(!isFinite(y))y=0;s+=(i===0||i===n?1:i%2?4:2)*y;}s*=h/3;
     return R.m([["a",fr(a)],["b",fr(b)],["∫ₐᵇ f",fr(s,3)]])+R.v(`Vert : aire comptée positivement, rouge : négativement. L'intégrale est une aire « algébrique ». Valeur exacte du CC : ${g.exact}.`,"info");},
   hint:"Attrape a et b sur l'axe."};
  function place(P,S){const g=fs[S.k],pl=pp(S);P.A=V(pl.X(g.a),pl.Y(0));P.B=V(pl.X(g.b),pl.Y(0));}
}
const ED1=[{t:"y′ + πy = 0",a:x=>Math.PI,A:x=>Math.PI*x,sol:"y = C e^(−πx)"},{t:"y′ + x³y = 0",a:x=>x**3,A:x=>x**4/4,sol:"y = C e^(−x⁴/4)"},{t:"y′ + x/(1+x²) y = 0",a:x=>x/(1+x*x),A:x=>0.5*Math.log(1+x*x),sol:"y = C/√(1+x²)"},{t:"y′ + eˣ y = 0",a:x=>Math.exp(x),A:x=>Math.exp(x),sol:"y = C e^(−eˣ)"},{t:"y′ − 4y = 0",a:x=>-4,A:x=>-4*x,sol:"y = C e^(4x)"}];

    if(Math.abs(d)<=1e-9){const r=-a/2,C1=1,C2=1-r;return{d,txt:`Δ = 0 : racine double r = ${fr(r)}`,gen:"y = (C₁ + C₂x) e^(rx)",f:x=>(C1+C2*x)*Math.exp(r*x)};}
    const al=-a/2,be=Math.sqrt(-d)/2,C1=1,C2=(1-al)/be;return{d,txt:`Δ < 0 : r = ${fr(al)} ± ${fr(be)} i`,gen:"y = e^(αx)(C₁ cos βx + C₂ sin βx)",f:x=>Math.exp(al*x)*(C1*Math.cos(be*x)+C2*Math.sin(be*x))};}

   draw:(P,S)=>{const s0=sol(S.a,S.b);return pl.axes()+pl.path(s0.f,"l-cob");},

}

   info:(P)=>{const x=pl.ix(P.Z.x),y=pl.iy(P.Z.y),r=Math.hypot(x,y),t=Math.atan2(y,x);return R.m([["z",`${fr(x)} ${y<0?"−":"+"} ${fr(Math.abs(y))} i`],["|z|",fr(r,3)],["arg z",r>0.01?G.fa(t):"non défini"],["forme polaire",r>0.01?`${fr(r,2)} e^(i ${G.piTxt(t)})`:"0"],["z̄",`${fr(x)} ${y<0?"+":"−"} ${fr(Math.abs(y))} i`]])+R.v("Le module est la distance à O, l'argument l'angle avec l'axe réel (dans ]−π, π]).","info");},

add(1,{id:"c-domaine",type:"meth",ref:"TD 1, CC1 2025 ex. 1a",t:"Trouver un domaine de définition",short:"Domaine de définition",cc:"1 pt en 2025",
 plain:`On liste ${hl("ce qui est interdit")} : diviser par 0, prendre ln d'un nombre ≤ 0, la racine d'un nombre négatif. Le domaine, c'est tout le reste. Sur la figure, les valeurs interdites sont en pointillés rouges.`,

 q:"Domaine de f(x) = ln((1 + e²ˣ)/x) ?",a:"Il faut (1 + e²ˣ)/x > 0. Le numérateur est toujours positif, donc x > 0 : D = ]0, +∞[.",rel:["c-limites","c-derivees"]});

add(1,{id:"c-limites",type:"meth",ref:"TD 1, ex. 1 et 2",t:"Calculer une limite",short:"Limites",cc:"1,5 pt en 2025",
 plain:`Face à une forme indéterminée (∞/∞, 0/0, ∞ − ∞, 0 × ∞), on ${hl("factorise par le terme le plus fort")}, on simplifie, ou on utilise les ${hl("croissances comparées")} : l'exponentielle l'emporte sur les puissances, qui l'emportent sur ln.`,
 fig:()=>curveFig("lim"),
 formal:`<ul><li>En ±∞ pour une fraction : on factorise numérateur et dénominateur par la plus grande puissance.</li><li>0/0 en a : on factorise par (x − a), ou on reconnaît un taux d'accroissement (f(x) − f(a))/(x − a) → f′(a).</li><li>Racines : on multiplie par la quantité conjuguée.</li><li>Croissances comparées : xⁿ/eˣ → 0, ln(x)/x → 0, x ln x → 0 en 0⁺, x² ln x → 0 en 0⁺.</li></ul>${F("CC1 2025 : f(x) = x²(1 + 5/x) / (x²(1 + 1/x)) = (1 + 5/x)/(1 + 1/x) → 1 en ±∞.")}`,
 use:`<p>Écris toujours la forme factorisée, puis les limites des morceaux (« comme 5/x → 0 … »), puis la conclusion.</p>`,
 trap:`« ∞/∞ = 1 » ou « 0 × ∞ = 0 » ne sont pas des calculs : ce sont des formes indéterminées, il faut transformer l'expression.`,
 q:"Limite en 2 de (x² − 4)/(x² − 3x + 2) ?",a:"(x − 2)(x + 2)/((x − 1)(x − 2)) = (x + 2)/(x − 1) → 4/1 = 4.",rel:["c-domaine","c-derivees"]});

add(1,{id:"c-derivees",type:"meth",ref:"TD 1, ex. 3 ; CC1 2025 ex. 1c-d",t:"Dériver une fonction",short:"Dérivées",cc:"3 pts en 2025",
 plain:`On découpe la fonction en morceaux connus et on applique les règles : ${hl("produit, quotient, composée")}. La dérivée en un point est la pente de la tangente : déplace M et regarde la pente changer de signe.`,
 fig:()=>curveFig("tan"),
 formal:`<div style="overflow-x:auto"><table class="tbl"><tbody>
 <tr><td>(uv)′</td><td>u′v + uv′</td></tr><tr><td>(u/v)′</td><td>(u′v − uv′)/v²</td></tr><tr><td>(u∘v)′ = (u(v))′</td><td>v′ × u′(v)</td></tr>
 <tr><td>(eᵘ)′</td><td>u′eᵘ</td></tr><tr><td>(ln u)′</td><td>u′/u</td></tr><tr><td>(√u)′</td><td>u′/(2√u)</td></tr><tr><td>(uⁿ)′</td><td>n u′ uⁿ⁻¹</td></tr><tr><td>(cos u)′, (sin u)′</td><td>−u′ sin u, u′ cos u</td></tr><tr><td>(tan x)′</td><td>1 + tan²x = 1/cos²x</td></tr></tbody></table></div>${F("CC1 2025 : f′(x) = ((2x+5)(x²+x) − (x²+5x)(2x+1)) / (x²+x)² = −4x²/(x²+x)².")}`,
 use:`<p>Justifie la dérivabilité avant de dériver : « f est dérivable sur D<sub>f</sub> comme quotient (ou produit, composée) de fonctions dérivables, le dénominateur ne s'annulant pas » (1 point en 2025). Développe proprement le numérateur et simplifie.</p>`,
 trap:`Pour √u, la fonction est définie quand u ≥ 0 mais dérivable seulement quand u > 0.`,
 q:"Dérivée de e^(cos x) ?",a:"(eᵘ)′ = u′eᵘ avec u = cos x : −sin(x) e^(cos x).",rel:["c-limites","c-primitives"]});

/* ---------- chapitre 2 : primitives et intégrales ---------- */
add(2,{id:"c-primitives",type:"meth",ref:"TD 1, ex. 4 ; formulaire",t:"Primitives : reconnaître la forme",short:"Primitives usuelles",cc:"Tombé en 2023 et 2025",
 plain:`Trouver une primitive, c'est ${hl("dériver à l'envers")}. Le plus souvent, on reconnaît une forme u′ × (quelque chose de u). Entraîne-toi à choisir la méthode.`,
 fig:()=>h=>W.drill(h,METH,MCH,"math"),
 formal:`<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Fonction</th><th>Une primitive</th></tr></thead><tbody>
 <tr><td>xⁿ (n ≠ −1)</td><td>xⁿ⁺¹/(n+1)</td></tr><tr><td>1/x</td><td>ln|x|</td></tr><tr><td>1/√x</td><td>2√x</td></tr><tr><td>eˣ, cos x, sin x</td><td>eˣ, sin x, −cos x</td></tr><tr><td>1/(1+x²)</td><td>arctan x</td></tr>
 <tr><td>u′uⁿ</td><td>uⁿ⁺¹/(n+1)</td></tr><tr><td>u′/u</td><td>ln|u|</td></tr><tr><td>u′/√u</td><td>2√u</td></tr><tr><td>u′eᵘ</td><td>eᵘ</td></tr><tr><td>u′ cos u, u′ sin u</td><td>sin u, −cos u</td></tr></tbody></table></div>`,
 use:`<p>Pour vérifier une primitive, dérive-la : tu dois retrouver la fonction de départ. Ajoute « + C » (« où C ∈ ℝ est une constante ») pour donner toutes les primitives.</p>`,
 trap:`Il manque souvent une constante multiplicative : ∫ t e^(3t²) dt = (1/6) e^(3t²) + C, car (3t²)′ = 6t.`,
 q:"Une primitive de ln(x)/x ?",a:"C'est u′u avec u = ln x : (ln x)²/2 + C.",rel:["c-ipp","c-chgt-var"]});

const IPP={xlnx:["∫₁² x ln(x) dx","u = ln x, v′ = x  ⇒  u′ = 1/x, v = x²/2","= [ (x²/2) ln x ]₁² − ∫₁² (1/x)(x²/2) dx","= 2 ln 2 − 0 − ∫₁² x/2 dx","= 2 ln 2 − [ x²/4 ]₁²","= 2 ln 2 − (1 − 1/4)","= 2 ln 2 − 3/4"],
 xsin:["∫₀^2π x sin(x) dx","u = x, v′ = sin x  ⇒  u′ = 1, v = −cos x","= [ −x cos x ]₀^2π − ∫₀^2π (−cos x) dx","= −2π + [ sin x ]₀^2π","= −2π + 0","= −2π"],
 lnx:["∫ ln(x) dx","u = ln x, v′ = 1  ⇒  u′ = 1/x, v = x","= x ln x − ∫ (1/x)·x dx","= x ln x − ∫ 1 dx","= x ln x − x + C"],
 expcos:["F = ∫ eˣ cos(x) dx","1re IPP : u = cos x, v′ = eˣ  ⇒  F = eˣ cos x + ∫ eˣ sin x dx","2e IPP : u = sin x, v′ = eˣ  ⇒  ∫ eˣ sin x dx = eˣ sin x − F","donc F = eˣ cos x + eˣ sin x − F + c","2F = eˣ (cos x + sin x) + c","F = (1/2) eˣ (cos x + sin x) + C"]};
add(2,{id:"c-ipp",type:"meth",ref:"TD 1 ; CC1 2023 ex. 1 ; CC1 2025 ex. 2b, 3b",t:"Intégration par parties",short:"Par parties (IPP)",cc:"Tombé en 2023 et 2025",
 plain:`On écrit l'intégrande comme ${hl("u × v′")}, et on échange : ∫ u v′ = [u v] − ∫ u′ v. On choisit pour u ce qui ${hl("se simplifie en dérivant")} (ln, un polynôme), et pour v′ ce qu'on sait intégrer.`,
 fig:()=>h=>{h.innerHTML=`<div class="w-ctrl"><select data-r><option value="xlnx">∫ x ln x (CC 2025)</option><option value="xsin">∫ x sin x (CC 2023)</option><option value="lnx">∫ ln x (TD 1)</option><option value="expcos">∫ eˣ cos x (CC 2025, deux IPP)</option></select></div><div class="rwh"></div>`;const go=()=>W.rewrite(h.querySelector(".rwh"),{gen:()=>IPP[h.querySelector("[data-r]").value]});h.addEventListener("change",e=>{if(e.target.matches("[data-r]"))go();});go();},
 formal:`${F("∫ₐᵇ u(x) v′(x) dx = [u(x) v(x)]ₐᵇ − ∫ₐᵇ u′(x) v(x) dx")}<p>Ordre de préférence pour u : <b>L</b>og, <b>P</b>olynôme, <b>E</b>xponentielle, <b>T</b>rigo (règle « LPET »). Pour eˣ cos x, deux IPP font réapparaître l'intégrale de départ : on la fait passer de l'autre côté.</p>`,
 use:`<p>Rédaction du corrigé : « On effectue une intégration par parties en posant u(x) = ln(x) et v′(x) = x. Alors u′(x) = 1/x et v(x) = x²/2. » Puis la formule, puis le calcul.</p>`,
 trap:`Dans ∫ eˣ cos x, la primitive qui réapparaît n'est égale à F qu'à une constante près : garde un « + c » (corrigé 2025).`,
 q:"Une primitive de x sin(x) ? (CC 2023)",a:"Par parties avec u = x et v′ = sin x : sin(x) − x cos(x) + C.",rel:["c-primitives","c-chgt-var"]});

const CV={lnx:["∫ ln(x)/x dx","on pose u = ln x, donc du = dx/x","= ∫ u du","= u²/2 + c","= (ln x)²/2 + c"],
 expo:["∫₀¹ e^(2x)/(1+eˣ) dx","on pose u = eˣ : du = eˣ dx, et x : 0 → 1 donne u : 1 → e","= ∫₁ᵉ u/(1+u) du","= ∫₁ᵉ (1 − 1/(1+u)) du","= [ u − ln(1+u) ]₁ᵉ","= e − 1 − ln((1+e)/2)"],
 sqrt:["∫₀³ t/√(t+1) dt","on pose u = t + 1 : du = dt, t = u − 1, bornes 1 → 4","= ∫₁⁴ (u − 1)/√u du","= ∫₁⁴ (u^(1/2) − u^(−1/2)) du","= [ (2/3)u^(3/2) − 2u^(1/2) ]₁⁴","= (16/3 − 4) − (2/3 − 2)","= 8/3"]};
add(2,{id:"c-chgt-var",type:"meth",ref:"TD 1, ex. 5 ; CC1 2025 ex. 3a",t:"Changement de variable",short:"Changement de variable",cc:"2,5 pts en 2025",
 plain:`On remplace un morceau compliqué par une nouvelle variable u = φ(x). Il faut changer ${hl("trois choses")} : la fonction, le « dx » (du = φ′(x) dx), et les bornes si c'est une intégrale.`,
 fig:()=>h=>{h.innerHTML=`<div class="w-ctrl"><select data-r><option value="lnx">∫ ln(x)/x (CC 2025)</option><option value="expo">∫ e²ˣ/(1+eˣ) (TD 1, 5b)</option><option value="sqrt">∫ t/√(t+1) (TD 1, 5d)</option></select></div><div class="rwh"></div>`;const go=()=>W.rewrite(h.querySelector(".rwh"),{gen:()=>CV[h.querySelector("[data-r]").value]});h.addEventListener("change",e=>{if(e.target.matches("[data-r]"))go();});go();},
 formal:`${F("∫ₐᵇ f(φ(x)) φ′(x) dx = ∫_{φ(a)}^{φ(b)} f(u) du")}<p>Sans bornes (primitive), on revient à x à la fin.</p>`,
 use:`<p>Rédaction : « On effectue le changement de variables u = ln(x). Alors du = dx/x et … ». N'oublie pas de changer les bornes.</p>`,
 trap:`Oublier de transformer dx en du, ou garder les anciennes bornes, est l'erreur la plus fréquente.`,
 q:"Avec u = eˣ, que deviennent dx et les bornes 0 et 1 ?",a:"du = eˣ dx, donc dx = du/u ; les bornes deviennent e⁰ = 1 et e¹ = e.",rel:["c-ipp","c-integrale"]});

add(2,{id:"c-integrale",type:"def",ref:"TD 1, ex. 5 ; CC1 2025 ex. 2",t:"Intégrale, aire et symétries",short:"Intégrale et aire",cc:"8,5 pts en 2025",
 plain:`∫ₐᵇ f(x) dx = F(b) − F(a), où F est une primitive. C'est une ${hl("aire algébrique")} : la partie au-dessus de l'axe compte positivement, celle en dessous négativement. Déplace a et b.`,
 fig:()=>areaFig(),
 formal:`<ul><li>∫ₐᵇ f = [F(x)]ₐᵇ = F(b) − F(a).</li><li>Linéarité : ∫(αf + βg) = α∫f + β∫g. Chasles : ∫ₐᶜ = ∫ₐᵇ + ∫ᵇᶜ.</li><li>f impaire sur [−a, a] : ∫ = 0. f paire : ∫₋ₐᵃ = 2∫₀ᵃ.</li></ul>${F("CC1 2025 : ∫₀¹ (2x − 1 + 1/√(3x)) dx = [x² − x + (2/3)√(3x)]₀¹ = 2√3/3.")}`,
 use:`<p>Le CC1 2025 donnait 8,5 points sur trois intégrales : une directe (2,5), une par parties (3), une u′cos(u) (3). Termine toujours par une valeur simplifiée.</p>`,
 trap:`Une intégrale peut être négative (∫₀^2π x sin x = −2π). Ce n'est pas une erreur.`,
 q:"Que vaut ∫ de −√(π/2) à √(2π) de 2x cos(x²) dx ? (CC 2025)",a:"Une primitive est sin(x²) : sin(2π) − sin(π/2) = 0 − 1 = −1.",rel:["c-primitives","c-ipp"]});

/* ---------- chapitre 3 : équations différentielles ---------- */
add(3,{id:"c-ed1",type:"meth",ref:"TD 2, ex. 1 ; CC 2023 ex. 2",t:"y′ + a(x) y = 0",short:"Ordre 1 sans second membre",
 plain:`Les solutions de y′ + a(x)y = 0 sont ${hl("y = C e^(−A(x))")}, où A est une primitive de a. La condition initiale (par exemple y(0) = 1) fixe la constante C. Déplace le point de départ.`,
 fig:()=>slopeFig(),
 formal:`${F("y′ + a(x) y = 0  ⇔  y(x) = C e^(−A(x)), C ∈ ℝ, avec A′ = a")}<ul><li>y′ + πy = 0 : y = C e^(−πx).</li><li>y′ + x³y = 0 : y = C e^(−x⁴/4).</li><li>y′ + (x/(1+x²)) y = 0 : A = ½ ln(1+x²), y = C/√(1+x²).</li><li>y′ + eˣ y = 0 : y = C e^(−eˣ) ; y(0) = 1 donne C = e.</li></ul>`,
 use:`<p>Rédige : « La fonction x ↦ … est une primitive de a, donc l'ensemble des solutions de (E₀) est {x ↦ λ e^(−A(x)), λ ∈ ℝ}. » Puis la condition initiale.</p>`,
 trap:`Attention au signe : pour y′ − 4y = 0, a = −4 et y = C e^(4x).`,
 q:"Solutions de y′ + x³ y = 0 avec y(0) = 1 ?",a:"y = C e^(−x⁴/4), et y(0) = C = 1 : y = e^(−x⁴/4).",rel:["c-ed1-sm","p/recettes"]});

add(3,{id:"c-ed1-sm",type:"meth",ref:"TD 2, ex. 2 ; CC1 2023 ex. 2",t:"y′ + a y = b(x) : solution particulière",short:"Ordre 1 avec second membre",cc:"Tombé en 2023",
 plain:`Toute solution = ${hl("solution de l'équation homogène + une solution particulière")}. On cherche la particulière ${hl("de la même forme que le second membre")} : polynôme → polynôme, e^(kx) → A e^(kx), cos → a cos + b sin.`,
 fig:()=>h=>W.rewrite(h,{gen:()=>["y′(t) − 4y(t) = 4t − 1,  y(0) = 1   (CC 2023)","Homogène : y′ − 4y = 0  ⇒  y = λ e^(4t)","Particulière : on essaie y = at + b, donc y′ − 4y = a − 4at − 4b… = −4at + (a − 4b)","−4a = 4 et a − 4b = −1  ⇒  a = −1, b = 0 : y_p = −t","Solutions : y = −t + λ e^(4t)","y(0) = λ = 1  ⇒  y = −t + e^(4t)"]}),
 formal:`<ul><li>b(x) polynôme de degré n : y<sub>p</sub> polynôme de degré n.</li><li>b(x) = e^(kx) : y<sub>p</sub> = A e^(kx), sauf si k est la « racine » (k = −a) : alors y<sub>p</sub> = A x e^(kx).</li><li>b(x) = cos x ou sin x : y<sub>p</sub> = α cos x + β sin x.</li><li>Sinon : variation de la constante, y = C(x) e^(−A(x)).</li></ul>${F("TD 2 : y′ − 3y = e²ˣ → y = C e³ˣ − e²ˣ ; y′ + y = e⁻ˣ → y = (C + x) e⁻ˣ ; y′ + y = cos x → y = C e⁻ˣ + (cos x + sin x)/2.")}`,
 use:`<p>Le corrigé 2023 donne trois méthodes (solution évidente, polynôme, variation de la constante) : une seule suffit, mais justifie-la.</p>`,
 trap:`La condition initiale s'applique à la solution complète (homogène + particulière), jamais à la seule partie homogène.`,
 q:"Solution particulière de y′ + y = e⁻ˣ ?",a:"e⁻ˣ est solution de l'homogène, donc on essaie A x e⁻ˣ : on trouve A = 1, y_p = x e⁻ˣ.",rel:["c-ed1","p/recettes"]});

add(5,{id:"c-ed2",out:"L'ordre 2 (TD 2, exercices 3 et 4) n'est pas au CC1 : le CC1 s'arrête à l'exercice 2 du TD 2. Garde cette fiche pour le CC2.",type:"meth",ref:"TD 2, ex. 3 et 4",t:"y″ + a y′ + b y = 0 : l'équation caractéristique",short:"Ordre 2",
 plain:`On résout ${hl("r² + a r + b = 0")}. Selon le signe de Δ, les solutions sont des exponentielles (Δ > 0), une exponentielle multipliée par un polynôme de degré 1 (Δ = 0), ou des oscillations (Δ < 0). Change a et b.`,
 fig:()=>ed2Fig(),
 formal:`<ul><li>Δ > 0, racines r₁ ≠ r₂ : y = C₁ e^(r₁x) + C₂ e^(r₂x).</li><li>Δ = 0, racine double r : y = (C₁ + C₂ x) e^(rx).</li><li>Δ < 0, racines α ± iβ : y = e^(αx)(C₁ cos βx + C₂ sin βx).</li><li>Avec second membre : + une solution particulière (constante, polynôme, A e^(kx), α cos + β sin ; multiplier par x ou x² si k est racine simple ou double).</li></ul>${F("TD 2 : y″ − 3y′ + 2y = 0 → r = 1, 2 → y = C₁eˣ + C₂e²ˣ ; avec y(0) = y′(0) = 1 : y = eˣ.")}`,
 use:`<p>Les deux conditions y(0) et y′(0) donnent un système de deux équations en C₁, C₂. Calcule y′ avant de remplacer.</p>`,
 trap:`Pour 2y″ − 2y′ − 4y = 0, divise d'abord par 2 : r² − r − 2 = 0, racines 2 et −1.`,
 q:"Solutions de y″ − 6y′ + 9y = 0 ?",a:"r² − 6r + 9 = (r − 3)² : racine double 3, donc y = (C₁ + C₂x) e^(3x).",rel:["c-ed1","c-ed1-sm"]});

/* ---------- pas au CC1 : nombres complexes ---------- */
add(5,{id:"c-complexes",out:"Les complexes (TD 3) ne sont pas au CC1. Garde cette fiche pour le CC2.",type:"def",ref:"TD 3",t:"Nombres complexes : formes algébrique et polaire",short:"Nombres complexes",
 plain:`z = a + ib se place dans le plan au point (a, b). Son ${hl("module")} |z| est la distance à O, son ${hl("argument")} l'angle avec l'axe des réels. Forme polaire : z = |z| e^(iθ). Déplace z.`,
 fig:()=>cplxFig(),
 formal:`<ul><li>Conjugué : z̄ = a − ib ; z z̄ = a² + b² = |z|².</li><li>Inverse : 1/z = z̄/|z|² (on multiplie par le conjugué).</li><li>|z| = √(a² + b²) ; cos θ = a/|z|, sin θ = b/|z|, θ ∈ ]−π, π] (argument principal).</li><li>Produit : modules multipliés, arguments additionnés.</li></ul>${F("1/(1 − i) = (1 + i)/2 ;  (2 + i)/(1 + i) = (3 − i)/2 ;  1 + i√3 = 2 e^(iπ/3)")}`,
 use:`<p>Probablement au CC2 plutôt qu'au CC1 (TD 3) : à faire seulement s'il te reste du temps.</p>`,
 trap:`L'argument de −2 e^(iπ/7) n'est pas π/7 : −1 = e^(iπ), donc l'argument est π/7 − π = −6π/7.`,
 q:"Module et argument de 1 − i ?",a:"|1 − i| = √2 et arg = −π/4 : 1 − i = √2 e^(−iπ/4).",rel:[]});

/* ---------- TD ---------- */
const td=[
 {id:"1.1",s:2,t:"Limites de suites",en:"(a) (n⁷ + 2n)/n² ; (b) e³ⁿ/n ; (c) n⁻¹e⁻³ⁿ ; (d) (ln(n² − 1) − ln(n − 1))/ln(n + 1).",link:"c-limites",sol:`<ol><li>n⁵ + 2/n → +∞.</li><li>+∞ (croissances comparées).</li><li>0.</li><li>ln((n² − 1)/(n − 1)) = ln(n + 1), donc le quotient vaut 1 : limite 1.</li></ol>`},
 {id:"1.2",s:3,t:"Limites de fonctions",en:"(a) (x⁷ + 2x)/x en 0 ; (b) (x⁷ + 2x)/(2 + sin x) en 0 ; (c) x² ln x en 0 ; (d) (√(1+x) − √(1−x))/x en 0 ; (e) (x − 1)/(xⁿ − 1) en 1 ; (g) (x² − 4)/(x² − 3x + 2) en 2 ; (h) (eˣ − e²ˣ)/(x² − x) en +∞.",link:"c-limites",
  sol:`<ol><li>x⁶ + 2 → 2.</li><li>0/2 = 0.</li><li>0 (croissances comparées).</li><li>Conjuguée : 2/(√(1+x) + √(1−x)) → 1.</li><li>Inverse du taux d'accroissement de xⁿ en 1 : 1/n.</li><li>(x + 2)/(x − 1) → 4.</li><li>e²ˣ domine : −∞.</li></ol>`},
 {id:"1.3",s:3,t:"Domaines et dérivées",en:"(a) e^(cos x) ; (c) tan x ; (e) e^(−1/x²) ; (f) ln((1 + e²ˣ)/x) ; (g) ln|sin x|.",link:"c-derivees",
  sol:`<ol><li>ℝ ; f′ = −sin x e^(cos x).</li><li>x ≠ π/2 + kπ ; h′ = 1 + tan²x.</li><li>ℝ* ; j′ = (2/x³) e^(−1/x²).</li><li>x > 0 ; k = ln(1 + e²ˣ) − ln x, k′ = 2e²ˣ/(1 + e²ˣ) − 1/x.</li><li>x ≠ kπ ; l′ = cos x / sin x.</li></ol>`},
 {id:"1.4",s:3,t:"Primitives",en:"(a) x⁵ − x² + 2 ; (b) ln x ; (c) (ln t)² ; (d) t e^(3t²+6) ; (e) eˣ/(1 + eˣ) ; (f) eˣ cos x.",link:"c-primitives",
  sol:`<ol><li>x⁶/6 − x³/3 + 2x + C</li><li>x ln x − x + C (IPP)</li><li>t(ln t)² − 2t ln t + 2t + C (IPP deux fois)</li><li>(1/6) e^(3t²+6) + C</li><li>ln(1 + eˣ) + C</li><li>(1/2) eˣ (cos x + sin x) + C</li></ol>`},
 {id:"1.5",s:3,t:"Intégrales",en:"(a) ∫₁⁴ (1 − √t)/√t dt ; (b) ∫₀¹ e²ˣ/(1 + eˣ) dx ; (c) ∫₁ᵉ (ln t)ⁿ/t dt ; (d) ∫₀³ t/√(t + 1) dt ; (g) ∫ de π² à 4π² de cos(√t) dt.",link:"c-integrale",
  sol:`<ol><li>[2√t − t]₁⁴ = 0 − 1 = −1.</li><li>u = eˣ : e − 1 − ln((1 + e)/2).</li><li>[(ln t)ⁿ⁺¹/(n + 1)]₁ᵉ = 1/(n + 1).</li><li>u = t + 1 : 8/3.</li><li>u = √t, dt = 2u du : ∫ de π à 2π de 2u cos u du = [2u sin u + 2 cos u] = 2 − (−2) = 4.</li></ol>`},
 {id:"2.1",s:3,t:"Ordre 1 homogène",en:"y′ + πy = 0 ; y′ + x³y = 0 ; y′ + x/(1 + x²) y = 0 ; y′ + eˣy = 0, avec y(0) = 1.",link:"c-ed1",
  sol:`<ol><li>y = e^(−πx).</li><li>y = e^(−x⁴/4).</li><li>y = 1/√(1 + x²).</li><li>y = C e^(−eˣ), y(0) = C/e = 1, donc y = e^(1 − eˣ).</li></ol>`},
 {id:"2.2",s:3,t:"Ordre 1 avec second membre",en:"(a) y′ − 3y = e²ˣ ; (b) y′ + y = e⁻ˣ ; (c) y′ − 2y = −x² ; (d) y′ + y = cos x ; (e) y′ + x²y = −x², avec y(0) = 0.",link:"c-ed1-sm",
  sol:`<ol><li>y = C e³ˣ − e²ˣ ; y(0) = 0 : y = e³ˣ − e²ˣ.</li><li>y = (C + x) e⁻ˣ ; y(0) = 0 : y = x e⁻ˣ.</li><li>y = C e²ˣ + x²/2 + x/2 + 1/4 ; y(0) = 0 : C = −1/4.</li><li>y = C e⁻ˣ + (cos x + sin x)/2 ; y(0) = 0 : C = −1/2.</li><li>y = C e^(−x³/3) − 1 (y_p = −1) ; y(0) = 0 : C = 1.</li></ol>`},
 {id:"2.3",s:2,out:"pas au CC1",t:"Ordre 2 homogène",en:"(a) y″ − 3y′ + 2y ; (b) y″ + 2y′ − 3y ; (c) y″ − 5y′ + 6y ; (d) y″ − 6y′ + 9y ; (e) y″ − y ; (f) 2y″ − 2y′ − 4y, = 0, avec y(0) = y′(0) = 1.",link:"c-ed2",
  sol:`<ol><li>r = 1, 2 : y = eˣ.</li><li>r = 1, −3 : y = eˣ.</li><li>r = 2, 3 : y = 2e²ˣ − e³ˣ.</li><li>r = 3 double : y = (1 − 2x) e³ˣ.</li><li>r = ±1 : y = eˣ.</li><li>r = 2, −1 : y = (2/3) e²ˣ + (1/3) e⁻ˣ.</li></ol>`},
 {id:"2.4",s:2,out:"pas au CC1",t:"Ordre 2 avec second membre",en:"(a) y″ − 3y′ + 2y = 1 ; (b) y″ + 2y′ − 3y = e⁴ˣ ; (d) y″ − 6y′ + 9y = e³ˣ ; (e) y″ + y = x, avec y(0) = y′(0) = 1.",link:"c-ed2",
  sol:`<ol><li>y_p = 1/2 ; y = (e²ˣ + 1)/2.</li><li>y_p = e⁴ˣ/21 ; y = (11/12) eˣ + (1/28) e⁻³ˣ + e⁴ˣ/21.</li><li>3 racine double : y_p = (x²/2) e³ˣ ; y = (1 − 2x + x²/2) e³ˣ.</li><li>y_p = x ; y = cos x + x.</li></ol>`}];

const ann=[
 {src:"CC1 13/10/2025 · Ex. 1 · 5,5 pts",t:"Étude de f(x) = x(x+5)/(x² + x)",en:"a) Domaine de définition. b) Limites en ±∞. c) Montrer que f est dérivable sur son domaine. d) Calculer f′.",go:"c-derivees",
  sol:`<ol><li>(1 pt) D = {x | x² + x ≠ 0} = ℝ ∖ {−1, 0}.</li><li>(1,5 pt) f(x) = (1 + 5/x)/(1 + 1/x) → 1 en +∞ et en −∞.</li><li>(1 pt) Fraction rationnelle : dérivable sur son domaine.</li><li>(2 pts) f′(x) = ((2x+5)(x²+x) − (x²+5x)(2x+1))/(x²+x)² = −4x²/(x²+x)².</li></ol>`},
 {src:"CC1 13/10/2025 · Ex. 2 · 8,5 pts",t:"Trois intégrales",en:"I₁ = ∫₀¹ (2x − 1 + 1/√(3x)) dx ; I₂ = ∫₁² x ln(x) dx ; I₃ = ∫ de −√(π/2) à √(2π) de 2x cos(x²) dx.",go:"c-integrale",
  sol:`<ol><li>(2,5 pts) [x² − x + (2/3)√(3x)]₀¹ = 2√3/3.</li><li>(3 pts) IPP u = ln x, v′ = x : 2 ln 2 − 3/4.</li><li>(3 pts) sin(x²) est une primitive : sin(2π) − sin(π/2) = −1.</li></ol>`},
 {src:"CC1 13/10/2025 · Ex. 3 · 6 pts",t:"Deux primitives",en:"F₁(x) = ∫ ln(x)/x dx ; F₂(x) = ∫ eˣ cos(x) dx.",go:"c-ipp",
  sol:`<ol><li>(2,5 pts) u = ln x, du = dx/x : F₁ = (ln x)²/2 + c.</li><li>(3,5 pts) Deux IPP : F₂ = eˣ cos x + eˣ sin x − F₂ + c, donc F₂ = (1/2) eˣ (cos x + sin x) + c′.</li></ol>`},
 {src:"CC 27/10/2023 · Ex. 1 et 2 · 4 pts sur 10",t:"Primitive de x sin x, équation y′ − 4y = 4t − 1",en:"Ex. 1 : primitives de g(x) = x sin(x), puis ∫₀^2π x sin(x) dx. Ex. 2 : résoudre y′(t) − 4y(t) = 4t − 1 avec y(0) = 1.",go:"c-ed1-sm",
  sol:`<p>Ex. 1 : IPP (u = x, v′ = sin x) : primitives sin x − x cos x + λ ; l'intégrale vaut −2π.</p><p>Ex. 2 : homogène y = λe⁴ᵗ ; particulière y_p = −t ; solutions −t + λe⁴ᵗ ; y(0) = 1 donne y = −t + e⁴ᵗ.</p>`},
 {src:"CC 27/10/2023 · Ex. 3 · 6 pts sur 10",t:"Étude de f(x) = x e^(1/ln x)",en:"(1) f est définie et dérivable sur ]0, 1[ ∪ ]1, +∞[. (2) Limites en 0, 1⁻, 1⁺, +∞. (3) f′, du signe de ln(x)² − 1. (4) Tableau de variations.",go:"c-limites",
  sol:`<ol><li>ln ne s'annule qu'en 1 : 1/ln est dérivable sur D, puis composée avec exp et produit par x.</li><li>En 0 : 1/ln x → 0, donc f → 0 × 1 = 0. En 1⁻ : 1/ln x → −∞, f → 0. En 1⁺ : f → +∞. En +∞ : f → +∞.</li><li>f′(x) = e^(1/ln x)(ln(x)² − 1)/ln(x)², du signe de ln(x)² − 1.</li><li>ln(x)² < 1 ⇔ e⁻¹ < x < e. f croît sur ]0, e⁻¹], décroît sur [e⁻¹, 1[ et ]1, e], croît sur [e, +∞[ ; f(e⁻¹) = e⁻², f(e) = e².</li></ol>`}];

 {q:"Pour y′ − 2y = −x², on cherche y_p sous la forme…",o:["A e^(2x)","ax² + bx + c","a cos x + b sin x","C(x) e^(2x) seulement"],a:1,e:"Second membre polynôme de degré 2.",link:"c-ed1-sm"},

const formulaire=({sec})=>`<div class="title-row"><h1>Formulaire de calculus</h1></div><p class="lead">Aucun document n'est autorisé au CC : ces formules doivent être sues par cœur. Les PDF officiels sont dans tes Téléchargements.</p>
 ${sec(1,"Dérivées",`<div style="overflow-x:auto"><table class="tbl"><tbody>${[["xⁿ","n xⁿ⁻¹"],["√x","1/(2√x)"],["1/x","−1/x²"],["eˣ","eˣ"],["ln x","1/x"],["sin x","cos x"],["cos x","−sin x"],["tan x","1 + tan²x"],["uv","u′v + uv′"],["u/v","(u′v − uv′)/v²"],["u(v(x))","v′(x) u′(v(x))"]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</tbody></table></div>`)}
 ${sec(2,"Trigonométrie",`<ul><li>cos² + sin² = 1 ; cos(−x) = cos x ; sin(−x) = −sin x.</li><li>cos(a + b) = cos a cos b − sin a sin b ; sin(a + b) = sin a cos b + cos a sin b.</li><li>cos 2a = 2cos²a − 1 = 1 − 2sin²a ; sin 2a = 2 sin a cos a.</li><li>Valeurs : cos(π/6) = √3/2, cos(π/4) = √2/2, cos(π/3) = 1/2 ; sin(π/6) = 1/2, sin(π/4) = √2/2, sin(π/3) = √3/2.</li></ul>`)}
 ${sec(3,"Les PDF du cours",`<p style="display:flex;gap:8px;flex-wrap:wrap">${[["calc/form_prim_deriv.pdf","Primitives et dérivées"],["calc/form_trigo.pdf","Trigonométrie"],["calc/form_medoc.pdf","Formulaire de cours"],["calc/cc1_2025_corr.pdf","Corrigé CC1 2025"],["calc/td1.pdf","TD 1"],["calc/td2.pdf","TD 2"]].map(f=>`<a class="btn" href="../Moodle-S1/${f[0]}" target="_blank" rel="noopener">${f[1]}</a>`).join("")}</p>`)}`;
const recettes=({sec})=>`<div class="title-row"><h1>Recettes pas à pas</h1></div><p class="lead">Trois méthodes à appliquer dans l'ordre, sans réfléchir. Elles couvrent presque tout le CC1 : une étude de fonction, des intégrales et des primitives, une équation différentielle d'ordre 1.</p>
 ${sec(1,"Étudier une fonction (5 à 6 points)",`<div class="recipe"><ol>
  <li><b>Domaine.</b> Liste ce qui est interdit : dénominateur nul, ln d'un nombre ≤ 0, racine d'un nombre &lt; 0. Écris « D<sub>f</sub> = {x ∈ ℝ | …} = … ». <a href="#/c/c-domaine">Fiche</a></li>
  <li><b>Limites aux bornes du domaine.</b> En ±∞ : factorise en haut et en bas par la plus grande puissance. Près d'une valeur interdite : simplifie, ou regarde le signe du dénominateur (0⁺ ou 0⁻). <a href="#/c/c-limites">Fiche</a></li>
  <li><b>Dérivabilité.</b> Une phrase suffit : « f est dérivable sur D<sub>f</sub> comme quotient de fonctions dérivables dont le dénominateur ne s'annule pas. »</li>
  <li><b>Dérivée.</b> Écris la formule avant de calculer, par exemple (u/v)′ = (u′v − uv′)/v². Développe le numérateur, puis factorise. <a href="#/c/c-derivees">Fiche</a></li>
  <li><b>Signe de f′ et tableau de variations.</b> Le dénominateur (au carré) est positif : le signe de f′ est celui du numérateur. Mets dans le tableau les valeurs où f′ = 0 et les limites.</li></ol>
  <p class="muted">Exemple complet : CC1 2025, exercice 1, dans les <a href="#/annales">annales</a>.</p></div>`)}
 ${sec(2,"Choisir comment intégrer (8 à 14 points)",`<div class="recipe"><p>Pose-toi ces questions dans l'ordre. Entraîne-toi avec le jeu « Quelle méthode ? » de la fiche <a href="#/c/c-primitives">Primitives</a>.</p><ol>
  <li><b>Est-ce une somme de fonctions usuelles</b> (xⁿ, 1/x, 1/√x, eˣ, cos, sin) ? Primitive directe, terme par terme. Développe d'abord si besoin.</li>
  <li><b>Vois-tu une fonction u et sa dérivée u′ ?</b> u′uⁿ donne uⁿ⁺¹/(n+1) ; u′/u donne ln|u| ; u′eᵘ donne eᵘ ; u′cos u donne sin u ; u′/√u donne 2√u. S'il manque une constante (2x au lieu de x), multiplie et divise par elle.</li>
  <li><b>Un produit de deux familles différentes</b> (polynôme × exponentielle, polynôme × sin ou cos, polynôme × ln, eˣ × cos) ? Par parties. On dérive ln ou le polynôme ; on primitive l'exponentielle, le sin ou le cos. <a href="#/c/c-ipp">Fiche</a></li>
  <li><b>Une racine ou une exponentielle partout</b> (cos(√t), e²ˣ/(1 + eˣ)) ? Changement de variable : change dx ET les bornes. <a href="#/c/c-chgt-var">Fiche</a></li>
  <li><b>Vérifie</b> en dérivant ta primitive : 30 secondes qui évitent de perdre tous les points d'une question.</li></ol>
  <div class="formula">Primitive : on ajoute + C.   Intégrale de a à b : un nombre, sans + C, calculé par F(b) − F(a).</div></div>`)}
 ${sec(3,"Résoudre y′ + a(x) y = b(x) (3 à 4 points)",`<div class="recipe"><ol>
  <li><b>Mets l'équation sous la forme</b> y′ + a(x) y = b(x). Pour y′ − 4y = 4t − 1 : a = −4, b(t) = 4t − 1.</li>
  <li><b>Homogène.</b> Trouve A, une primitive de a. Solutions de y′ + a y = 0 : y = λ e^(−A(x)). <a href="#/c/c-ed1">Fiche</a></li>
  <li><b>Solution particulière</b> de la même forme que b : polynôme de même degré, A e^(kx), ou α cos x + β sin x. Remplace dans l'équation et identifie les coefficients. <a href="#/c/c-ed1-sm">Fiche</a></li>
  <li><b>Toutes les solutions</b> : y = y<sub>p</sub> + λ e^(−A(x)).</li>
  <li><b>Condition initiale</b> (par exemple y(0) = 1) : remplace dans la solution complète et trouve λ.</li>
  <li><b>Vérifie</b> en remplaçant ta solution dans l'équation.</li></ol></div>`)}
 ${sec(4,"Sur ta copie",`<div class="paper"><b>Avant de rendre, vérifie :</b><ul><li>le domaine est écrit avant tout calcul ;</li><li>chaque méthode est annoncée (« par parties avec u = ln x, v′ = x ») ;</li><li>la dérivabilité est justifiée par une phrase ;</li><li>les primitives ont leur + C, les intégrales n'en ont pas ;</li><li>chaque résultat est simplifié et encadré ;</li><li>le temps : 1 heure pour 20 points, environ 3 minutes par point. Ne reste pas bloqué : passe à la question suivante.</li></ul></div>`)}`;
const infos=({sec})=>`<div class="title-row"><h1>Le CC1 de calculus en bref</h1></div>
 ${sec(1,"Quand et où",`<p>Vendredi 13 novembre, 15h, amphi 5.01 (examen indiqué sur ton emploi du temps). 1 heure. Aucun document, aucune calculatrice.</p>`)}
 ${sec(2,"Le poids",`<p>Contrôle continu intégral : CC1 25 %, CC2 25 %, CC final 50 %. Coefficient 3 : c'est le CC qui pèse le moins de la semaine.</p>`)}
 ${sec(3,"Le programme",`<ul><li><b>Feuille de TD 1 en entier</b> : limites, domaines, dérivées, primitives, intégrales (par parties, changement de variable).</li><li><b>Feuille de TD 2, exercices 1 et 2 seulement</b> : équations différentielles d'ordre 1, sans puis avec second membre.</li><li>Pas au CC1 : l'ordre 2 (TD 2, ex. 3 et 4) et les complexes (TD 3).</li><li>Le CC1 2025 : une étude de fonction (5,5 pts), trois intégrales (8,5 pts), deux primitives (6 pts). En 2023 : une primitive, une équation d'ordre 1, une étude de fonction.</li></ul>`)}
 ${sec(4,"Comment gagner des points",`<p>Les trois recettes de la page <a href="#/p/recettes">Recettes pas à pas</a> couvrent presque tout le sujet. Apprends-les, puis refais le CC1 2025 en 1 heure sur papier.</p>`)}`;
