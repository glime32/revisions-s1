<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mes révisions</title>
<style>
/* Révision géométrie CC1
   Direction : table à dessin. Fond uni et calme, la figure interactive est la vedette.
   Encre pour le cours, cobalt pour ce que la figure démontre, ambre pour ce que tu peux déplacer. */

@import url("https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,750;1,400&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap");

:root{
  --papier:#F5F7FA;     /* fond de page, uni */
  --feuille:#FFFFFF;    /* surfaces */
  --encre:#1B2330;      /* texte et traits */
  --graphite:#5C6675;   /* texte secondaire, traits de construction */
  --trait:#DDE2EA;      /* filets, bordures */
  --voile:#EEF1F6;      /* surfaces discrètes */
  --cobalt:#2F55D4;     /* ce que la figure montre, liens */
  --cobalt-voile:rgba(47,85,212,.10);
  --ambre:#D9890B;      /* poignées déplaçables */
  --vert:#1E8A5A;       /* réussi, su */
  --vert-voile:rgba(30,138,90,.10);
  --rouge:#C8463D;      /* pièges */
  --rouge-voile:rgba(200,70,61,.08);
  --f-texte:"Atkinson Hyperlegible Next","Atkinson Hyperlegible","Noto Sans",system-ui,sans-serif;
  --f-math:"STIX Two Text","Noto Serif","DejaVu Serif",Georgia,serif;
  --r:10px;
  color-scheme:light;
}
:root[data-theme="sombre"]{
  --papier:#15181E; --feuille:#1C2129; --encre:#E6E9EF; --graphite:#9AA3B2; --trait:#2C333F; --voile:#232933;
  --cobalt:#86A2FF; --cobalt-voile:rgba(134,162,255,.14); --ambre:#F2B33D; --vert:#4CC38A; --vert-voile:rgba(76,195,138,.13);
  --rouge:#F07A70; --rouge-voile:rgba(240,122,112,.10);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--papier);color:var(--encre);font:17px/1.6 var(--f-texte);-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.2;margin:0;font-weight:750;letter-spacing:-.01em}
h1{font-size:2rem}
h2{font-size:1.4rem}
h3{font-size:1.1rem}
p{margin:0}
a{color:var(--cobalt)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:4px}
.m{font-family:var(--f-math);font-style:italic;font-size:1.06em;letter-spacing:.01em}
.m b,.m .r{font-style:normal}
.muted{color:var(--graphite)}
[hidden]{display:none!important}

/* notations */
.ang{display:inline-block;line-height:1;padding:.34em .04em 0;border-top:1.4px solid currentColor;border-radius:50% 50% 0 0/.55em .55em 0 0}
.vec{position:relative;display:inline-block;line-height:1;padding-top:.46em}
.vec::after{content:"";position:absolute;left:.04em;right:.12em;top:.2em;height:1.3px;background:currentColor}
.vec::before{content:"";position:absolute;right:.09em;top:.06em;width:.26em;height:.26em;border:solid currentColor;border-width:1.3px 1.3px 0 0;transform:rotate(45deg)}
.hl{font-weight:650}

/* ---------- cadre ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--papier);border-bottom:1px solid var(--trait);height:60px;display:flex;align-items:center;gap:14px;padding:0 18px}
.brand{font-weight:750;font-size:1.1rem;text-decoration:none;color:var(--encre);white-space:nowrap}
.brand .m{font-weight:600;color:var(--cobalt)}
.jx{font-size:.88rem;color:var(--graphite);white-space:nowrap}
.jx b{color:var(--encre)}
.search{margin-left:auto;position:relative;width:min(320px,40vw)}
.search input{width:100%;border:1px solid var(--trait);background:var(--feuille);color:var(--encre);border-radius:999px;padding:7px 14px;font:inherit;font-size:.95rem}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--feuille);border:1px solid var(--trait);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.12);max-height:60vh;overflow:auto;padding:6px}
.results a{display:block;padding:7px 10px;border-radius:7px;text-decoration:none;color:var(--encre)}
.results a:hover,.results a.on{background:var(--voile)}
.results small{color:var(--graphite);margin-left:6px}
.iconbtn{border:1px solid var(--trait);background:var(--feuille);border-radius:999px;height:36px;padding:0 12px;font-size:.9rem;white-space:nowrap}
.menu-btn{display:none}

.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--trait);padding:18px 12px 40px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.side h4{margin:18px 10px 6px;font-size:.82rem;font-weight:600;color:var(--graphite)}
.side h4:first-child{margin-top:4px}
.side a{display:flex;align-items:center;gap:9px;padding:5px 10px;border-radius:8px;text-decoration:none;color:var(--encre);font-size:.94rem;line-height:1.3}
.side a:hover{background:var(--voile)}
.side a[aria-current="page"]{background:var(--cobalt-voile);color:var(--cobalt);font-weight:600}
.dot{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--graphite);opacity:.6}
.dot.seen{border-color:var(--cobalt);opacity:1}
.dot.known{background:var(--vert);border-color:var(--vert);opacity:1}
.side .demo-tag{margin-left:auto;font-size:.72rem;color:var(--graphite);border:1px solid var(--trait);border-radius:999px;padding:0 7px}
.side .star{margin-left:auto;color:var(--ambre);font-size:.8rem}

main{padding:28px 32px 80px;min-width:0}
.page{max-width:900px;margin:0 auto;display:grid;gap:22px}
.crumb{font-size:.9rem;color:var(--graphite)}
.crumb a{color:var(--graphite)}
.title-row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.title-row h1{flex:1;min-width:260px}
.badges{display:flex;gap:6px;flex-wrap:wrap;padding-top:6px}
.badge{font-size:.8rem;border-radius:999px;padding:2px 10px;border:1px solid var(--trait);color:var(--graphite);white-space:nowrap}
.badge.def{border-color:var(--cobalt);color:var(--cobalt)}
.badge.ax{border-color:var(--encre);color:var(--encre)}
.badge.th{border-color:var(--vert);color:var(--vert)}
.badge.demo{background:var(--encre);border-color:var(--encre);color:var(--papier)}
.badge.cc{border-color:var(--ambre);color:var(--ambre)}
.lead{font-size:1.18rem;line-height:1.55;max-width:68ch}

/* ---------- figure ---------- */
.figwrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr);background:var(--feuille);border:1px solid var(--trait);border-radius:14px;overflow:hidden}
.figwrap.solo{grid-template-columns:1fr}
.figure{position:relative;min-width:0;border-right:1px solid var(--trait)}
.figwrap.solo .figure{border-right:0}
.figure svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.fig-hint{display:block;padding:2px 12px 10px;font-size:.82rem;color:var(--graphite)}
.panel{padding:16px 16px 18px;display:grid;gap:12px;align-content:start;font-size:.95rem;min-width:0}
.panel h5{margin:0;font-size:.85rem;font-weight:600;color:var(--graphite)}
.meas{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:baseline}
.meas dt{font-family:var(--f-math);font-style:italic;white-space:nowrap}
.meas dd{margin:0;font-variant-numeric:tabular-nums}
.meas .ok{color:var(--vert);font-weight:600}
.meas .no{color:var(--graphite)}
.verdict{border-radius:8px;padding:8px 10px;background:var(--voile);line-height:1.4}
.verdict.ok{background:var(--vert-voile);color:var(--vert)}
.verdict.info{background:var(--cobalt-voile);color:var(--cobalt)}
.verdict.no{background:var(--rouge-voile);color:var(--rouge)}
.defi{border:1.5px dashed var(--ambre);border-radius:8px;padding:8px 10px;line-height:1.4}
.defi.done{border-style:solid;border-color:var(--vert);background:var(--vert-voile)}
.defi b{color:var(--ambre)}
.defi.done b{color:var(--vert)}
.ctrls{display:grid;gap:8px}
.ctrls label{display:grid;gap:2px;font-size:.88rem;color:var(--graphite)}
.ctrls input[type=range]{width:100%;accent-color:var(--cobalt)}
.ctrls .row{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--trait);background:var(--feuille);border-radius:8px;padding:6px 12px;font-size:.92rem;line-height:1.3;text-decoration:none;color:var(--encre);display:inline-block}
.btn:hover{border-color:var(--graphite)}
.btn.pri{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.ok{background:var(--vert);border-color:var(--vert);color:#fff}
.btn[aria-pressed="true"]{background:var(--encre);border-color:var(--encre);color:var(--papier)}

/* figure : traits */
svg .l-ink{stroke:var(--encre);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .l-thin{stroke:var(--encre);stroke-width:1.3;fill:none;opacity:.75}
svg .l-cons{stroke:var(--graphite);stroke-width:1.2;fill:none;stroke-dasharray:5 5;opacity:.8}
svg .l-cob{stroke:var(--cobalt);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .l-cob-d{stroke:var(--cobalt);stroke-width:2;fill:none;stroke-dasharray:7 5}
svg .l-amb{stroke:var(--ambre);stroke-width:2.4;fill:none;stroke-linecap:round}
svg .l-amb-d{stroke:var(--ambre);stroke-width:2.2;fill:none;stroke-dasharray:8 6}
svg .l-ok{stroke:var(--vert);stroke-width:2.6;fill:none;stroke-linecap:round}
svg .l-red{stroke:var(--rouge);stroke-width:2.2;fill:none;stroke-linecap:round}
svg .l-red-d{stroke:var(--rouge);stroke-width:1.8;fill:none;stroke-dasharray:6 5}
svg .f-cob{fill:var(--cobalt);fill-opacity:.12;stroke:none}
svg .f-amb{fill:var(--ambre);fill-opacity:.16;stroke:none}
svg .f-ok{fill:var(--vert);fill-opacity:.14;stroke:none}
svg .f-red{fill:var(--rouge);fill-opacity:.12;stroke:none}
svg .f-ink{fill:var(--encre);fill-opacity:.07;stroke:none}
svg .p-fix{fill:var(--encre)}
svg .p-cob{fill:var(--cobalt)}
svg .p-ok{fill:var(--vert)}
svg .p-red{fill:var(--rouge)}
svg .p-drag{fill:var(--feuille);stroke:var(--ambre);stroke-width:3;cursor:grab}
svg .p-drag:hover,svg .p-drag:focus{fill:var(--ambre);outline:none}
svg .p-drag.grab{cursor:grabbing;fill:var(--ambre)}
svg .halo{fill:transparent;cursor:grab}
svg text{font-family:var(--f-math);font-style:italic;font-size:17px;fill:var(--encre);paint-order:stroke;stroke:var(--feuille);stroke-width:4px;stroke-linejoin:round}
svg text.t-cob{fill:var(--cobalt)}
svg text.t-mut{fill:var(--graphite);font-size:14px}
svg text.t-red{fill:var(--rouge)}
svg text.t-ok{fill:var(--vert)}
svg text.t-amb{fill:var(--ambre)}
svg text.t-up{font-style:normal;font-family:var(--f-texte);font-size:13px}
svg .arrow-cob{fill:var(--cobalt)}
svg .arrow-ink{fill:var(--encre)}
svg .arrow-amb{fill:var(--ambre)}
svg .arrow-red{fill:var(--rouge)}
svg .arrow-ok{fill:var(--vert)}

/* ---------- blocs de contenu ---------- */
.block{display:grid;gap:10px;max-width:72ch}
.block h2{font-size:1.2rem}
.cours{background:var(--feuille);border:1px solid var(--trait);border-left:4px solid var(--encre);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;max-width:none}
.cours .ref{font-size:.85rem;color:var(--graphite)}
.cours ul,.cours ol,.block ul,.block ol{margin:0;padding-left:1.25em;display:grid;gap:4px}
.gloss{display:flex;flex-wrap:wrap;gap:6px}
.gloss span{font-size:.88rem;background:var(--voile);border-radius:6px;padding:2px 8px}
.piege{border-left:4px solid var(--rouge);background:var(--rouge-voile);border-radius:0 var(--r) var(--r) 0;padding:12px 16px;display:grid;gap:6px;max-width:72ch}
.piege h2{color:var(--rouge);font-size:1.05rem}
.usage{border-left:4px solid var(--cobalt);padding:4px 0 4px 16px;display:grid;gap:8px;max-width:72ch}
.usage h2{font-size:1.05rem}
.check{background:var(--feuille);border:1px solid var(--trait);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px}
.check .q{font-weight:600}
.check .a{border-top:1px solid var(--trait);padding-top:10px}
.check .acts{display:flex;gap:8px;flex-wrap:wrap}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--trait);padding-top:16px}
.pager a{max-width:48%;text-decoration:none}
.pager small{display:block;color:var(--graphite);font-size:.8rem}
.related{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.92rem}

/* ---------- démos ---------- */
.goal{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;background:var(--feuille);border:1px solid var(--trait);border-radius:var(--r);padding:14px 16px}
.goal b{font-weight:600;color:var(--graphite);font-size:.92rem;padding-top:.1em}
.idea{font-size:1.1rem;border-left:4px solid var(--ambre);padding:2px 0 2px 14px;max-width:70ch}
.steps{display:grid;gap:8px;counter-reset:st;margin:0;padding:0;list-style:none}
.steps li{counter-increment:st;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;border-radius:var(--r);padding:10px 12px;border:1px solid transparent;cursor:pointer}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;border:1.5px solid var(--graphite);display:grid;place-items:center;font-size:.85rem;font-weight:600;color:var(--graphite)}
.steps li.cur{background:var(--feuille);border-color:var(--cobalt)}
.steps li.cur::before{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.steps li.done::before{border-color:var(--vert);color:var(--vert)}
.steps li.later{opacity:.45}
.steps .w{display:grid;gap:6px}
.steps .why{font-size:.95rem;color:var(--graphite)}
.steps li.cur .why{color:var(--encre)}
.steps .why::before{content:"Pourquoi : ";font-weight:600}
.stepnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.redac{background:var(--feuille);border:1px solid var(--trait);border-radius:var(--r);padding:16px 18px;font-family:var(--f-math);font-size:1.05rem;line-height:1.7;display:grid;gap:8px}
.redac p{max-width:75ch}

/* ---------- accueil ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h1{font-size:2.3rem}
.hero .lead{margin-top:10px}
.hero .figwrap{grid-template-columns:1fr}
.route{display:grid;gap:0;counter-reset:r;margin:0;padding:0;list-style:none}
.route li{counter-increment:r;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--trait)}
.route li::before{content:counter(r);font-size:1.4rem;font-weight:750;color:var(--cobalt);line-height:1.2}
.route .pts{font-size:.88rem;color:var(--graphite);white-space:nowrap;padding-top:.2em}
.route a{font-weight:600}
.chapters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chap{display:grid;gap:8px;align-content:start}
.chap h3{font-size:1rem}
.bar{height:6px;border-radius:3px;background:var(--trait);overflow:hidden}
.bar i{display:block;height:100%;background:var(--vert);transition:width .3s}
.plan{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.96rem}
.plan b{font-weight:600;color:var(--graphite);white-space:nowrap}
.plan .today{color:var(--cobalt)}
.plan .today+span{font-weight:600}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}

/* ---------- cartes ---------- */
.fc{background:var(--feuille);border:1px solid var(--trait);border-radius:14px;padding:22px;display:grid;gap:14px;min-height:280px}
.fc .front{font-size:1.4rem;font-weight:700;line-height:1.3}
.fc .back{display:grid;gap:10px;border-top:1px solid var(--trait);padding-top:14px}
.fc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.kbd{font-size:.8rem;color:var(--graphite)}
.filters{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- quiz / td / annales ---------- */
.qbox{background:var(--feuille);border:1px solid var(--trait);border-radius:14px;padding:20px;display:grid;gap:14px}
.qtxt{font-size:1.15rem;font-weight:600}
.opts{display:grid;gap:8px}
.opts button{text-align:left;border:1px solid var(--trait);background:var(--papier);border-radius:var(--r);padding:10px 14px}
.opts button:hover:not(:disabled){border-color:var(--graphite)}
.opts button.good{border-color:var(--vert);background:var(--vert-voile)}
.opts button.bad{border-color:var(--rouge);background:var(--rouge-voile)}
.opts button:disabled{cursor:default}
.expl{border-left:4px solid var(--vert);padding:2px 0 2px 12px}
.expl.no{border-color:var(--rouge)}
.score{font-size:2.6rem;font-weight:750;font-variant-numeric:tabular-nums}
details.ex{background:var(--feuille);border:1px solid var(--trait);border-radius:var(--r)}
details.ex[open]{border-color:var(--graphite)}
details.ex summary{cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;list-style:none}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary::after{content:"+";font-size:1.2rem;color:var(--graphite)}
details.ex[open] summary::after{content:"−"}
details.ex .sub{font-size:.88rem;color:var(--graphite)}
details.ex .h{font-weight:600}
details.ex .body{padding:0 16px 16px;display:grid;gap:12px}
.enon{color:var(--graphite)}
.sol{border-left:3px solid var(--encre);padding:2px 0 2px 14px}
.sol ol{margin:0;padding-left:1.2em;display:grid;gap:4px}
.sol .who{display:block;font-size:.85rem;color:var(--graphite);margin-bottom:4px}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tip{border-top:3px solid var(--rouge);background:var(--feuille);border-radius:0 0 var(--r) var(--r);padding:12px 14px;display:grid;gap:4px;align-content:start}
.tbl{width:100%;border-collapse:collapse;font-size:.96rem}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--trait)}
.tbl th{font-weight:600;color:var(--graphite);font-size:.88rem}
.tbl td:first-child{font-weight:600;white-space:nowrap}
.timer{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.timer .score.end{color:var(--rouge)}
.notation{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:10px 18px;align-items:baseline}
.notation dt{font-family:var(--f-math);font-size:1.25rem;text-align:center;background:var(--feuille);border:1px solid var(--trait);border-radius:8px;padding:4px 10px;cursor:pointer}
.notation dt.on{border-color:var(--cobalt);color:var(--cobalt)}
.notation dd{margin:0}

/* ---------- petits écrans ---------- */
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:60px;left:0;bottom:0;width:300px;height:auto;background:var(--papier);z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .menu-btn{display:inline-block}
  main{padding:20px 16px 60px}
  .figwrap{grid-template-columns:1fr}
  .figure{border-right:0;border-bottom:1px solid var(--trait)}
  .hero,.split,.chapters{grid-template-columns:1fr}
  .jx{display:none}
}
@media (max-width:560px){
  body{font-size:16px}
  h1{font-size:1.6rem}
  .hero h1{font-size:1.8rem}
  .search{width:auto;flex:1}
  .top{gap:8px;padding:0 10px}
  .brand{font-size:1rem}
  .route li{grid-template-columns:32px minmax(0,1fr)}
  .route .pts{grid-column:2}
  .tbl td:first-child{white-space:normal}
  .brand .w,#theme .long{display:none}
  .iconbtn{padding:0 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- statuts : su (vert), à revoir (rouge), vu (bleu) ---------- */
.dot.review{background:var(--rouge);border-color:var(--rouge);opacity:1}
.btn.rev{background:var(--rouge);border-color:var(--rouge);color:#fff}
.pill{font-size:.8rem;border-radius:999px;padding:2px 10px;white-space:nowrap;font-weight:600}
.pill.ok{background:var(--vert-voile);color:var(--vert)}
.pill.rev{background:var(--rouge-voile);color:var(--rouge)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--graphite);padding:0 10px 6px}

<script>
/* Moteur de figures interactives : SVG pur, sans dépendance.
   Les coordonnées sont en pixels du viewBox (y vers le bas) ; 1 unité de longueur = 40 px.
   Les angles orientés sont mesurés dans le sens trigonométrique tel qu'on le voit à l'écran. */
(function(){
"use strict";
const U=40, PI=Math.PI;
const V=(x,y)=>({x,y});
const add=(a,b)=>V(a.x+b.x,a.y+b.y), sub=(a,b)=>V(a.x-b.x,a.y-b.y), mul=(a,k)=>V(a.x*k,a.y*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y, crs=(a,b)=>a.x*b.y-a.y*b.x;
const len=a=>Math.hypot(a.x,a.y), dpx=(a,b)=>len(sub(a,b)), d=(a,b)=>dpx(a,b)/U;
const mid=(a,b)=>V((a.x+b.x)/2,(a.y+b.y)/2), lerp=(a,b,t)=>V(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);
const unit=a=>{const l=len(a)||1;return V(a.x/l,a.y/l);};
const perp=a=>V(-a.y,a.x);
function norm(a){a=((a+PI)%(2*PI)+2*PI)%(2*PI)-PI;return a<=-PI+1e-9?PI:a;}
/* angle orienté (A,O,B) : mesure principale dans ]-π, π], positif dans le sens inverse des aiguilles d'une montre */
function ang(A,O,B){const u=sub(A,O),v=sub(B,O);return norm(Math.atan2(-crs(u,v),dot(u,v)));}
const absang=(A,O,B)=>Math.abs(ang(A,O,B));
function proj(M,A,B){const v=sub(B,A),t=dot(sub(M,A),v)/(dot(v,v)||1);return add(A,mul(v,t));}
function param(M,A,B){const v=sub(B,A);return dot(sub(M,A),v)/(dot(v,v)||1);}
function inter(A,B,C,D){const r=sub(B,A),s=sub(D,C),q=crs(r,s);if(Math.abs(q)<1e-9)return null;return add(A,mul(r,crs(sub(C,A),s)/q));}
const sym=(M,O)=>V(2*O.x-M.x,2*O.y-M.y);

const side=(M,A,B)=>Math.sign(crs(sub(B,A),sub(M,A)));            /* +1 / -1 / 0 : de quel côté de (AB) */
const distLine=(M,A,B)=>dpx(M,proj(M,A,B));

function onRay(p,A,B){const t=Math.max(0,param(p,A,B));return add(A,mul(sub(B,A),t));}

const parallel=(A,B,C,D,tol)=>Math.abs(crs(unit(sub(B,A)),unit(sub(D,C))))<(tol||0.012);

/* --- écriture des nombres --- */
function fr(x,n){n=n==null?2:n;let s=(Math.round(x*10**n)/10**n).toFixed(n);if(/^-0[.,]?0*$/.test(s))s=s.slice(1);return s.replace(".",",");}
const FR=[[1,1],[1,2],[1,3],[2,3],[1,4],[3,4],[1,6],[5,6],[1,8],[3,8],[5,8],[7,8],[1,12],[5,12],[7,12],[11,12]];
function piTxt(a){
  if(Math.abs(a)<0.004)return "0";
  const s=a<0?"−":"",x=Math.abs(a)/PI;
  for(const[n,q]of FR){if(Math.abs(x-n/q)<0.004){return s+(n===1?"":n)+"π"+(q===1?"":"/"+q);}}

const fl=(a,b)=>fr(d(a,b));                    /* longueur AB, en unités */

  seg:(A,B,c)=>`<line x1="${n1(A.x)}" y1="${n1(A.y)}" x2="${n1(B.x)}" y2="${n1(B.y)}" class="${c||"l-ink"}"/>`,

/* --- panneau de mesures --- */
const R={
  m:(rows)=>`<dl class="meas">${rows.map(r=>r?`<dt>${r[0]}</dt><dd class="${r[2]||""}">${r[1]}</dd>`:"").join("")}</dl>`,
  v:(t,c)=>`<div class="verdict ${c||""}">${t}</div>`,
  h:(t)=>`<h5>${t}</h5>`,

/* marqueurs de flèches, partagés par toutes les figures */
function defs(){
  if(document.getElementById("geo-defs"))return;
  const s=document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("id","geo-defs");s.setAttribute("width","0");s.setAttribute("height","0");s.style.position="absolute";
  s.innerHTML="<defs>"+["cob","ink","amb","red","ok"].map(k=>`<marker id="mk-${k}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow-${k}"/></marker>`).join("")+"</defs>";

/* --- la figure ---
 spec = {
   w,h          taille du viewBox (défaut 560 × 360)
   P            {A:[x,y], …} points libres
   drag         liste des points déplaçables (défaut : tous)
   con          {M:(p,P,S)=>p'} contraintes de déplacement
   labels       {A:"A"} étiquettes des poignées (défaut : le nom), false pour aucune
   S            état initial (curseurs, options)
   sliders      [{k,label,min,max,step,fmt}]
   toggles      [{k,label}]
   buttons      [{label,act(P,S)}]
   draw(P,S,F)  -> chaîne SVG
   info(P,S,F)  -> HTML du panneau de mesures
   goal         {text, ok(P,S), win}
   hint         texte d'aide sous la figure

let FID=0;
function Figure(host,spec){
  defs();
  const F=this;F.id=++FID;F.spec=spec;
  const w=spec.w||560,h=spec.h||360;F.w=w;F.h=h;
  F.P={};for(const k in spec.P){const v=spec.P[k];F.P[k]=V(v[0],v[1]);}
  F.P0=JSON.parse(JSON.stringify(F.P));
  F.S=Object.assign({},spec.S||{});F.S0=Object.assign({},F.S);
  F.drag=spec.drag||Object.keys(F.P);
  F.won=false;
  const hasPanel=!!(spec.info||spec.goal||spec.sliders||spec.toggles||spec.buttons);
  host.innerHTML=`<div class="figwrap${hasPanel?"":" solo"}"><div class="figure"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${(spec.alt||"Figure interactive").replace(/"/g,"")}"></svg>${spec.hint!==false?`<span class="fig-hint">${spec.hint||"Attrape les points orange."}</span>`:""}</div>${hasPanel?`<div class="panel"><div class="ctrls"></div><div class="out" aria-live="polite"></div><div class="goalbox"></div></div>`:""}</div>`;
  const svg=host.querySelector("svg");F.svg=svg;
  const out=host.querySelector(".out"),goalbox=host.querySelector(".goalbox"),ctrls=host.querySelector(".ctrls");
  /* commandes */
  if(ctrls){
    let html="";
    (spec.sliders||[]).forEach(s=>{html+=`<label>${s.label} <span data-sv="${s.k}"></span><input type="range" min="${s.min}" max="${s.max}" step="${s.step||0.01}" value="${F.S[s.k]}" data-sl="${s.k}"></label>`;});
    const tb=(spec.toggles||[]).map(t=>`<button class="btn" data-tg="${t.k}" aria-pressed="${!!F.S[t.k]}">${t.label}</button>`).join("")
      +(spec.buttons||[]).map((b,i)=>`<button class="btn" data-bt="${i}">${b.label}</button>`).join("")
      +(spec.noReset?"":`<button class="btn" data-reset>Recommencer</button>`);
    html+=`<div class="row">${tb}</div>`;
    ctrls.innerHTML=html;
    ctrls.addEventListener("input",e=>{const k=e.target.dataset.sl;if(!k)return;F.S[k]=+e.target.value;F.render();});
    ctrls.addEventListener("click",e=>{
      const t=e.target.closest("button");if(!t)return;
      if(t.dataset.tg){const k=t.dataset.tg;F.S[k]=!F.S[k];t.setAttribute("aria-pressed",!!F.S[k]);}
      else if(t.dataset.bt){spec.buttons[+t.dataset.bt].act(F.P,F.S,F);}
      else if(t.hasAttribute("data-reset")){F.reset();return;}
      F.render();
    });
  }
  F.reset=function(){F.P=JSON.parse(JSON.stringify(F.P0));F.S=Object.assign({},F.S0,{step:F.S.step});if(ctrls){ctrls.querySelectorAll("[data-sl]").forEach(i=>i.value=F.S[i.dataset.sl]);ctrls.querySelectorAll("[data-tg]").forEach(b=>b.setAttribute("aria-pressed",!!F.S[b.dataset.tg]));}F.render();};
  let focusId=null,dragId=null;
  F.render=function(){
    const P=F.P,S=F.S;
    let s="";
    try{s=spec.draw(P,S,F);}catch(err){s=`<text x="20" y="30">Erreur de figure</text>`;console.error(err);}
    const C=V(w/2,h/2);
    for(const k of F.drag){
      if(spec.hide&&spec.hide(k,P,S))continue;
      const p=P[k],lab=spec.labels===false?null:(spec.labels&&k in spec.labels?spec.labels[k]:k);
      s+=`<circle class="halo" cx="${n1(p.x)}" cy="${n1(p.y)}" r="17" data-p="${k}"/>`;
      s+=`<circle class="p-drag${dragId===k?" grab":""}" cx="${n1(p.x)}" cy="${n1(p.y)}" r="6.5" data-p="${k}" tabindex="0" role="button" aria-label="Point ${lab||k} : déplace-le avec la souris, le doigt ou les flèches du clavier"/>`;
      if(lab)s+=D.lab(p,lab,spec.away?spec.away(k,P,S):C,"t-amb");
    }
    svg.innerHTML=s;
    if(out&&spec.info){try{out.innerHTML=spec.info(P,S,F);}catch(err){out.innerHTML="";console.error(err);}}
    (spec.sliders||[]).forEach(sl=>{const e=host.querySelector(`[data-sv="${sl.k}"]`);if(e)e.innerHTML=sl.fmt?sl.fmt(S[sl.k]):fr(S[sl.k]);});
    if(goalbox&&spec.goal){
      let ok=false;try{ok=!!spec.goal.ok(P,S,F);}catch(e){}
      if(ok)F.won=true;
      goalbox.innerHTML=`<div class="defi${F.won?" done":""}"><b>${F.won?"Défi réussi":"Défi"}</b> : ${F.won&&spec.goal.win?spec.goal.win:spec.goal.text}</div>`;
    }
    if(focusId){const el=svg.querySelector(`.p-drag[data-p="${focusId}"]`);if(el&&document.activeElement!==el)el.focus({preventScroll:true});}
    if(spec.after)spec.after(P,S,F);
  };
  function toSvg(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):pt;}
  function move(k,p){
    p=V(Math.max(8,Math.min(w-8,p.x)),Math.max(8,Math.min(h-8,p.y)));
    if(spec.con&&spec.con[k])p=spec.con[k](p,F.P,F.S);
    if(!p||!isFinite(p.x)||!isFinite(p.y))return;
    F.P[k]=p;F.render();
  }
  svg.addEventListener("pointerdown",e=>{
    const t=e.target.closest("[data-p]");if(!t)return;
    dragId=t.dataset.p;focusId=null;svg.setPointerCapture(e.pointerId);e.preventDefault();
    const p=toSvg(e);F.off=sub(F.P[dragId],V(p.x,p.y));
    if(dpx(F.P[dragId],V(p.x,p.y))>8)F.off=V(0,0);

  });
  svg.addEventListener("pointermove",e=>{if(!dragId)return;const p=toSvg(e);move(dragId,add(V(p.x,p.y),F.off||V(0,0)));});
  const end=()=>{if(dragId){dragId=null;F.render();}};
  svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
  svg.addEventListener("keydown",e=>{
    const t=e.target.closest(".p-drag");if(!t)return;
    const k=t.dataset.p,st=e.shiftKey?1:5,m={ArrowLeft:V(-st,0),ArrowRight:V(st,0),ArrowUp:V(0,-st),ArrowDown:V(0,st)}[e.key];
    if(!m)return;e.preventDefault();focusId=k;move(k,add(F.P[k],m));
  });
  svg.addEventListener("focusout",()=>{setTimeout(()=>{if(!svg.contains(document.activeElement))focusId=null;},0);});
  F.setStep=function(k){const prev=F.S.step;F.S.step=k;if(spec.onStep&&prev!==k)spec.onStep(k,F.P,F.S);F.render();};
  F.render();
}

<script>
/* Composants interactifs pour l'algo, la programmation fonctionnelle et le calculus.
   Tout est en JavaScript pur, sans dépendance. */
(function(){
"use strict";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KW={py:["def","return","for","in","range","while","if","else","elif","and","or","not","True","False","None","len"],
 pseudo:["Fonction","Procédure","Début","Fin","FONCTION","PROCÉDURE","DÉBUT","FIN","SPÉCIFICATIONS","Renvoyer","Si","si","alors","sinon","finSi","Pour","pour","de","à","faire","finPour","fin","tq","Tant","tant","que","finTantQue","finTQ","Variable","Variables","Spécifications","par","pas","et","ou","non","cond","tete","tête","queue","cons","estVide","dans","empiler","depiler","enfiler","defiler"],
 ml:["let","rec","in","fun","function","match","with","when","if","then","else","and","true","false","not","List.hd","List.tl","int","float","bool","string","list","mod"]};
function hlCode(src,lang){
  const kws=(KW[lang]||[]).slice().sort((a,b)=>b.length-a.length).map(k=>k.replace(/\./g,"\\."));
  let out=esc(src);
  if(lang==="ml")out=out.replace(/(\(\*[\s\S]*?\*\))/g,'<span class="c-com">$1</span>');
  if(lang==="py")out=out.replace(/(#[^\n]*)/g,'<span class="c-com">$1</span>');
  out=out.replace(/("[^"\n]*")/g,'<span class="c-str">$1</span>');
  if(kws.length)out=out.replace(new RegExp("(^|[^\\w.])("+kws.join("|")+")(?![\\wéèà])","g"),'$1<span class="c-kw">$2</span>');
  return out;
}
function code(src,lang){return `<pre class="code" data-lang="${lang||""}"><code>${hlCode(src.replace(/^\n/,""),lang)}</code></pre>`;}

/* ------------------------------------------------------------------
   Traceur pas à pas : une ligne surlignée, un tableau des variables, une sortie.
   spec = { code:[lignes], lang, params:[{k,label,min,max,val}], gen:(p)=>[{l,v:{},out,note}], cols:[noms] }
------------------------------------------------------------------ */
function tracer(host,spec){
  const P={};(spec.params||[]).forEach(p=>P[p.k]=p.val);
  let steps=[],k=0;
  host.innerHTML=`<div class="widget"><div class="w-ctrl">${(spec.params||[]).map(p=>`<label>${p.label} <input type="number" min="${p.min}" max="${p.max}" value="${p.val}" data-p="${p.k}"></label>`).join("")}<button class="btn" data-a="prev">Étape précédente</button><button class="btn pri" data-a="next">Étape suivante</button><button class="btn" data-a="end">Tout dérouler</button><button class="btn" data-a="reset">Recommencer</button><span class="muted" data-a="cnt"></span></div>
   <div class="w-grid"><div class="w-code"></div><div class="w-side"><div class="w-table"></div><div class="w-out"></div><div class="w-note"></div></div></div></div>`;
  const $=s=>host.querySelector(s);
  function gen(){steps=spec.gen(P);k=0;draw();}
  function draw(){
    const s=steps[k]||{};
    $(".w-code").innerHTML=`<pre class="code"><code>${spec.code.map((L,i)=>`<span class="ln${i===s.l?" on":""}">${hlCode(L,spec.lang)||" "}</span>`).join("\n")}</code></pre>`;
    const cols=spec.cols||Object.keys(s.v||{});
    const rows=steps.slice(0,k+1).filter(x=>x.row!==false&&x.v);
    $(".w-table").innerHTML=cols.length?`<table class="tbl tr"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i===rows.length-1?"on":""}">${cols.map(c=>`<td>${r.v[c]===undefined?"":esc(r.v[c])}</td>`).join("")}</tr>`).join("")}</tbody></table>`:"";
    const out=steps.slice(0,k+1).map(x=>x.out||"").join("");
    $(".w-out").innerHTML=spec.noOut?"":`<div class="muted" style="font-size:.85rem">Affichage / résultat</div><pre class="console">${esc(out)||" "}</pre>`;
    $(".w-note").innerHTML=s.note?`<div class="verdict info">${s.note}</div>`:"";
    $('[data-a="cnt"]').textContent=`Étape ${k+1} sur ${steps.length}`;
    $('[data-a="prev"]').disabled=k===0;$('[data-a="next"]').disabled=k>=steps.length-1;
  }
  host.addEventListener("click",e=>{const a=e.target.closest("[data-a]")?.dataset.a;if(!a)return;if(a==="prev"&&k>0)k--;if(a==="next"&&k<steps.length-1)k++;if(a==="end")k=steps.length-1;if(a==="reset")k=0;draw();});
  host.addEventListener("change",e=>{const p=e.target.dataset.p;if(!p)return;const d=(spec.params||[]).find(x=>x.k===p);let v=Math.round(+e.target.value);v=Math.max(d.min,Math.min(d.max,isNaN(v)?d.val:v));e.target.value=v;P[p]=v;gen();});
  gen();
}

/* ------------------------------------------------------------------
   Arbre d'appels récursifs : chaque appel, chaque affichage, dans l'ordre d'exécution.
   spec = { params, run:(p,api)=>{}, title }  api.call(label, corps), api.print(texte), api.ret(valeur)
------------------------------------------------------------------ */
function calltree(host,spec){
  const P={};(spec.params||[]).forEach(p=>P[p.k]=p.val);
  let ev=[],k=0;
  host.innerHTML=`<div class="widget"><div class="w-ctrl">${(spec.params||[]).map(p=>`<label>${p.label} <input type="number" min="${p.min}" max="${p.max}" value="${p.val}" data-p="${p.k}"></label>`).join("")}${spec.variants?`<select data-v>${spec.variants.map((v,i)=>`<option value="${i}">${v.label}</option>`).join("")}</select>`:""}<button class="btn" data-a="prev">Précédent</button><button class="btn pri" data-a="next">Suivant</button><button class="btn" data-a="end">Tout</button><button class="btn" data-a="reset">Recommencer</button><span class="muted" data-a="cnt"></span></div>
   ${spec.variants?`<div class="w-vcode"></div>`:""}<div class="w-grid"><div class="w-tree"></div><div class="w-side"><div class="muted" style="font-size:.85rem">Ce qui s'affiche</div><pre class="console w-out"></pre><div class="w-note"></div></div></div></div>`;
  const $=s=>host.querySelector(s);let vi=0;
  function run(){
    ev=[];let depth=0,id=0;const api={
      call:(label,body)=>{const me=id++;ev.push({t:"call",label,depth,id:me});depth++;let r;try{r=body();}finally{depth--;}ev.push({t:"ret",label,depth,id:me,val:r});return r;},
      print:(txt)=>{ev.push({t:"print",txt,depth});}
    };
    const R=spec.variants?spec.variants[vi].run:spec.run;
    try{R(P,api);}catch(e){ev.push({t:"print",txt:"(trop d'appels)",depth:0});}
    if(ev.length>600){ev=ev.slice(0,600);}
    k=0;draw();
  }
  function draw(){
    if(spec.variants)$(".w-vcode").innerHTML=code(spec.variants[vi].code,spec.lang||"pseudo");
    const shown=ev.slice(0,k+1);
    let html="";shown.forEach((e,i)=>{if(e.t==="call")html+=`<div class="tn${i===k?" on":""}" style="padding-left:${e.depth*18}px">${e.depth?"└ ":""}<b>${esc(e.label)}</b></div>`;
      else if(e.t==="print")html+=`<div class="tn pr${i===k?" on":""}" style="padding-left:${e.depth*18}px">${e.depth?"  ":""}affiche <code>${esc(e.txt)}</code></div>`;
      else if(e.t==="ret"&&e.val!==undefined)html+=`<div class="tn rt${i===k?" on":""}" style="padding-left:${e.depth*18}px">${e.depth?"  ":""}${esc(e.label)} renvoie <b>${esc(e.val)}</b></div>`;});
    $(".w-tree").innerHTML=html||" ";
    $(".w-out").textContent=shown.filter(e=>e.t==="print").map(e=>e.txt).join("\n")||" ";
    const cur=ev[k];$(".w-note").innerHTML=cur?`<div class="verdict info">${cur.t==="call"?`Appel de ${esc(cur.label)}`:cur.t==="print"?`Affichage de ${esc(cur.txt)}`:`Fin de ${esc(cur.label)}${cur.val!==undefined?` : il renvoie ${esc(cur.val)}`:""}`}</div>`:"";
    $('[data-a="cnt"]').textContent=`Événement ${k+1} sur ${ev.length}`;
    $('[data-a="prev"]').disabled=k===0;$('[data-a="next"]').disabled=k>=ev.length-1;
    const on=host.querySelector(".tn.on");if(on){const t=$(".w-tree");if(on.offsetTop<t.scrollTop||on.offsetTop>t.scrollTop+t.clientHeight-30)t.scrollTop=on.offsetTop-60;}
  }
  host.addEventListener("click",e=>{const a=e.target.closest("[data-a]")?.dataset.a;if(!a)return;if(a==="prev"&&k>0)k--;if(a==="next"&&k<ev.length-1)k++;if(a==="end")k=ev.length-1;if(a==="reset")k=0;draw();});
  host.addEventListener("change",e=>{if(e.target.matches("[data-v]")){vi=+e.target.value;run();return;}const p=e.target.dataset.p;if(!p)return;const d=spec.params.find(x=>x.k===p);let v=Math.round(+e.target.value);v=Math.max(d.min,Math.min(d.max,isNaN(v)?d.val:v));e.target.value=v;P[p]=v;run();});
  run();
}

const SORTS={
 bulles:{t:"Tri à bulles",gen:function*(a){const n=a.length;for(let i=n-1;i>0;i--){for(let j=0;j<i;j++){yield{a:a.slice(),cmp:[j,j+1],done:n-1-i,msg:`On compare T[${j}] = ${a[j]} et T[${j+1}] = ${a[j+1]}.`};if(a[j]>a[j+1]){[a[j],a[j+1]]=[a[j+1],a[j]];yield{a:a.slice(),swap:[j,j+1],done:n-1-i,msg:"Ils sont dans le désordre : on échange ces deux voisins."};}}}yield{a:a.slice(),done:n,msg:"Trié. Chaque passage fait remonter le plus grand restant à la fin."};}},
 selection:{t:"Tri par sélection",gen:function*(a){const n=a.length;for(let i=0;i<n-1;i++){let m=i;for(let j=i+1;j<n;j++){yield{a:a.slice(),cmp:[m,j],fixed:i,msg:`Plus petit trouvé jusqu'ici : T[${m}] = ${a[m]}. On le compare à T[${j}] = ${a[j]}.`};if(a[j]<a[m])m=j;}if(m!==i){[a[i],a[m]]=[a[m],a[i]];yield{a:a.slice(),swap:[i,m],fixed:i+1,msg:`On place le minimum ${a[i]} en position ${i}.`};}else yield{a:a.slice(),fixed:i+1,msg:`T[${i}] = ${a[i]} est déjà le minimum : il reste en place.`};}yield{a:a.slice(),fixed:n,msg:"Trié."};}},
 insertion:{t:"Tri par insertion",gen:function*(a){const n=a.length;for(let i=1;i<n;i++){let j=i;yield{a:a.slice(),cmp:[j],fixed:i,msg:`On insère T[${i}] = ${a[i]} dans la partie déjà triée T[0..${i-1}].`};while(j>0&&a[j-1]>a[j]){yield{a:a.slice(),cmp:[j-1,j],fixed:i,msg:`${a[j-1]} > ${a[j]} : on décale.`};[a[j-1],a[j]]=[a[j],a[j-1]];yield{a:a.slice(),swap:[j-1,j],fixed:i+1,msg:"Échange avec le voisin de gauche."};j--;}}yield{a:a.slice(),fixed:n,msg:"Trié."};}},
 comptage:{t:"Tri par comptage (par valeurs)",gen:function*(a){const max=Math.max(...a);const c=new Array(max+1).fill(0);for(let i=0;i<a.length;i++){c[a[i]]++;yield{a:a.slice(),cmp:[i],cnt:c.slice(),msg:`On compte la valeur ${a[i]} : elle a été vue ${c[a[i]]} fois.`};}const r=[];for(let v=0;v<=max;v++){for(let k=0;k<c[v];k++){r.push(v);}if(c[v])yield{a:r.concat(a.slice(r.length).map(()=>null)),cnt:c.slice(),msg:`On recopie ${c[v]} fois la valeur ${v}.`};}yield{a:r,cnt:c,fixed:a.length,msg:"Trié en un seul passage de comptage + un passage de recopie : Θ(n + valeurs possibles)."};}}
};
function sortviz(host,opts){
  opts=opts||{};let algo=opts.algo||"bulles",arr=[],steps=[],k=0;
  host.innerHTML=`<div class="widget"><div class="w-ctrl"><select data-s>${Object.entries(SORTS).map(([k2,v])=>`<option value="${k2}"${k2===algo?" selected":""}>${v.t}</option>`).join("")}</select><button class="btn" data-a="new">Nouveau tableau</button><button class="btn" data-a="prev">Précédent</button><button class="btn pri" data-a="next">Suivant</button><button class="btn" data-a="end">Tout</button><span class="muted" data-a="cnt"></span></div>
   <div class="bars"></div><div class="w-note"></div><div class="meas-line"></div></div>`;
  const $=s=>host.querySelector(s);
  function newArr(){const n=opts.n||8;arr=Array.from({length:n},()=>1+Math.floor(Math.random()*(algo==="comptage"?6:12)));build();}
  function build(){steps=[...SORTS[algo].gen(arr.slice())];k=0;draw();}
  function draw(){const s=steps[k]||{a:arr};const mx=Math.max(...arr,1);
    $(".bars").innerHTML=s.a.map((v,i)=>{let c="";if(s.swap&&s.swap.includes(i))c=" sw";else if(s.cmp&&s.cmp.includes(i))c=" cp";else if((algo==="bulles"&&s.done!=null&&i>=s.a.length-s.done)||(s.fixed!=null&&algo!=="bulles"&&i<s.fixed))c=" ok";return `<div class="bar${c}${v==null?" empty":""}"><i style="height:${v==null?4:Math.max(8,v/mx*120)}px"></i><span>${v==null?"":v}</span><small>${i}</small></div>`;}).join("");
    const shown=steps.slice(0,k+1);const nc=shown.filter(x=>x.cmp&&x.cmp.length===2).length,ns=shown.filter(x=>x.swap).length;
    $(".w-note").innerHTML=`<div class="verdict info">${s.msg||""}</div>`+(s.cnt?`<div class="muted" style="margin-top:6px">Compteurs : ${s.cnt.map((c,v)=>c?`${v}→${c}`:"").filter(Boolean).join(", ")}</div>`:"");
    $(".meas-line").innerHTML=algo==="comptage"?"":`<span class="muted">Comparaisons : <b>${nc}</b>, échanges : <b>${ns}</b></span>`;
    $('[data-a="cnt"]').textContent=`Étape ${k+1} sur ${steps.length}`;}
  host.addEventListener("click",e=>{const a=e.target.closest("[data-a]")?.dataset.a;if(!a)return;if(a==="new")return newArr();if(a==="prev"&&k>0)k--;if(a==="next"&&k<steps.length-1)k++;if(a==="end")k=steps.length-1;draw();});
  host.addEventListener("change",e=>{if(e.target.matches("[data-s]")){algo=e.target.value;newArr();}});
  newArr();
}

/* ------------------------------------------------------------------
   Recherche dichotomique dans un tableau trié
------------------------------------------------------------------ */
function dicho(host){
  let n=32,T=[],x=0,steps=[],k=0;
  host.innerHTML=`<div class="widget"><div class="w-ctrl"><label>Taille n <input type="number" min="4" max="1024" value="32" data-n></label><label>Valeur cherchée <input type="number" value="0" data-x></label><button class="btn" data-a="rand">Valeur au hasard</button><button class="btn" data-a="prev">Précédent</button><button class="btn pri" data-a="next">Suivant</button><button class="btn" data-a="end">Tout</button></div>
   <div class="dstrip"></div><div class="w-note"></div></div>`;
  const $=s=>host.querySelector(s);
  function build(){T=Array.from({length:n},(_,i)=>2*i+1);steps=[];let g=0,d=n-1,c=0;while(g<=d){const m=Math.floor((g+d)/2);c++;steps.push({g,d,m,c,msg:`Essai ${c} : on regarde le milieu T[${m}] = ${T[m]}.`});if(T[m]===x){steps.push({g,d,m,c,found:true,msg:`Trouvé en ${c} essai(s). Avec n = ${n}, il en faut au plus ${Math.floor(Math.log2(n))+1} ≈ log₂(n) + 1.`});break;}if(T[m]<x){g=m+1;steps.push({g,d,m,c,msg:`${T[m]} < ${x} : on garde la moitié droite. Il reste ${Math.max(0,d-g+1)} case(s).`});}else{d=m-1;steps.push({g,d,m,c,msg:`${T[m]} > ${x} : on garde la moitié gauche. Il reste ${Math.max(0,d-g+1)} case(s).`});}}
    if(!steps.length||!steps[steps.length-1].found)steps.push({g,d,c,msg:`Absent : ${c} essai(s). Une recherche séquentielle aurait pu en faire ${n}.`});k=0;draw();}
  function draw(){const s=steps[k];const W=Math.min(n,64),scale=n/W;let h="";for(let i=0;i<W;i++){const lo=Math.floor(i*scale),hi=Math.floor((i+1)*scale)-1;const inside=hi>=s.g&&lo<=s.d;const mid=s.m!=null&&s.m>=lo&&s.m<=hi;h+=`<i class="${inside?"in":""}${mid?(s.found?" found":" mid"):""}" title="${n<=64?"T["+lo+"] = "+T[lo]:""}">${n<=32?T[lo]:""}</i>`;}
    $(".dstrip").innerHTML=h;$(".w-note").innerHTML=`<div class="verdict ${s.found?"ok":"info"}">${s.msg}</div>`;
    host.querySelector('[data-a="prev"]').disabled=k===0;host.querySelector('[data-a="next"]').disabled=k>=steps.length-1;}
  host.addEventListener("click",e=>{const a=e.target.closest("[data-a]")?.dataset.a;if(!a)return;if(a==="rand"){x=2*Math.floor(Math.random()*n)+1;$("[data-x]").value=x;return build();}if(a==="prev"&&k>0)k--;if(a==="next"&&k<steps.length-1)k++;if(a==="end")k=steps.length-1;draw();});
  host.addEventListener("change",e=>{if(e.target.matches("[data-n]")){n=Math.max(4,Math.min(1024,Math.round(+e.target.value)||32));e.target.value=n;}if(e.target.matches("[data-x]"))x=Math.round(+e.target.value)||0;build();});
  x=2*Math.floor(n*0.7)+1;$("[data-x]").value=x;build();
}

/* ------------------------------------------------------------------
   Listes : tête, queue, cons, estVide (pseudo-code) ou List.hd, List.tl, :: (OCaml)
------------------------------------------------------------------ */
function listlab(host,opts){
  const ml=opts&&opts.ml;let L=(opts&&opts.start)||[2,3,2,4],hist=[];
  const show=l=>ml?"["+l.join("; ")+"]":"["+l.join(", ")+"]";
  const N=ml?{hd:"List.hd",tl:"List.tl",cons:"::",vide:"= []"}:{hd:"tete",tl:"queue",cons:"cons",vide:"estVide"};
  host.innerHTML=`<div class="widget"><div class="w-ctrl"><span>Liste courante : <b class="lcur"></b></span></div>
   <div class="w-ctrl"><button class="btn" data-a="hd">${N.hd}</button><button class="btn" data-a="tl">${N.tl}</button><label>x = <input type="number" value="7" data-x style="width:4.5em"></label><button class="btn" data-a="cons">${ml?"x :: liste":"cons(x, liste)"}</button><button class="btn" data-a="empty">${ml?"liste = []":"estVide(liste)"}</button><button class="btn" data-a="reset">Revenir à ${show((opts&&opts.start)||[2,3,2,4])}</button></div>
   <div class="w-out2"></div></div>`;
  const $=s=>host.querySelector(s);
  function draw(){$(".lcur").textContent=show(L);$(".w-out2").innerHTML=hist.length?`<table class="tbl"><thead><tr><th>Expression</th><th>Valeur</th></tr></thead><tbody>${hist.slice(-8).map(h=>`<tr><td><code>${esc(h[0])}</code></td><td>${h[1]}</td></tr>`).join("")}</tbody></table>`:`<p class="muted">Clique sur une opération.</p>`;}
  host.addEventListener("click",e=>{const a=e.target.closest("[data-a]")?.dataset.a;if(!a)return;const x=+$("[data-x]").value||0;
    if(a==="hd"){hist.push([ml?`List.hd ${show(L)}`:`tete(${show(L)})`,L.length?`<b>${L[0]}</b> (un élément, pas une liste)`:`<span style="color:var(--rouge)">erreur : liste vide${ml?" (exception Failure \"hd\")":""}</span>`]);}
    if(a==="tl"){if(L.length){const r=L.slice(1);hist.push([ml?`List.tl ${show(L)}`:`queue(${show(L)})`,`<b>${show(r)}</b> (une liste) : elle devient la liste courante`]);L=r;}else hist.push([ml?"List.tl []":"queue([])",`<span style="color:var(--rouge)">erreur : liste vide</span>`]);}
    if(a==="cons"){const r=[x].concat(L);hist.push([ml?`${x} :: ${show(L)}`:`cons(${x}, ${show(L)})`,`<b>${show(r)}</b> : ajout en tête`]);L=r;}
    if(a==="empty"){hist.push([ml?`${show(L)} = []`:`estVide(${show(L)})`,`<b>${L.length===0}</b>`]);}
    if(a==="reset"){L=((opts&&opts.start)||[2,3,2,4]).slice();hist=[];}
    draw();});
  draw();
}

/* ------------------------------------------------------------------
   Exercice « type et valeur » (OCaml) : on choisit le type, puis on voit la valeur
   items = [{e, t, v, why}]
------------------------------------------------------------------ */
function drill(host,items,choices,lang,o){o=o||{};
  let order=items.map((_,i)=>i).sort(()=>Math.random()-0.5),i=0,score=0,ans=null;
  host.innerHTML=`<div class="widget drill"></div>`;const box=host.querySelector(".drill");
  function draw(){
    if(i>=order.length){box.innerHTML=`<p class="score">${score} sur ${order.length}</p><button class="btn pri" data-a="again">Recommencer</button>`;return;}
    const it=items[order[i]];
    box.innerHTML=`<p class="muted">${lang==="math"?"Question":"Expression"} ${i+1} sur ${order.length}, score ${score}</p>${lang==="math"?`<p class="mathq">${it.e}</p>`:code(it.e,lang||"ml")}<p>${o.ask||(lang==="math"?"Quelle méthode ?":"Quel est son type ?")}</p><div class="opts">${choices.map(c=>{let cl="";if(ans!==null){if(c===it.t)cl="good";else if(c===ans)cl="bad";}return `<button data-c="${esc(c)}" class="${cl}" ${ans!==null?"disabled":""}><code>${esc(c)}</code></button>`;}).join("")}</div>
     ${ans!==null?`<div class="expl${ans===it.t?"":" no"}"><b>${ans===it.t?"Exact.":"Non."}</b> ${o.label||(lang==="math"?"Réponse":"Type")} : <code>${esc(it.t)}</code>. ${it.v!=null?`Valeur : <code>${esc(it.v)}</code>. `:""}${it.why||""}</div><button class="btn pri" data-a="next">Suivante</button>`:""}`;
  }
  box.addEventListener("click",e=>{const c=e.target.closest("[data-c]");if(c&&ans===null){ans=c.dataset.c;if(ans===items[order[i]].t)score++;draw();return;}const a=e.target.closest("[data-a]")?.dataset.a;if(a==="next"){i++;ans=null;draw();}if(a==="again"){order.sort(()=>Math.random()-0.5);i=0;score=0;ans=null;draw();}});
  draw();
}

/* ------------------------------------------------------------------
   Réécriture pas à pas d'un calcul récursif (ex. som 3 = 3 + som 2 = …)
   spec = { params, gen:(p)=>[lignes] }
------------------------------------------------------------------ */
function rewrite(host,spec){
  const P={};(spec.params||[]).forEach(p=>P[p.k]=p.val);let L=[],k=0;
  host.innerHTML=`<div class="widget"><div class="w-ctrl">${(spec.params||[]).map(p=>`<label>${p.label} <input type="number" min="${p.min}" max="${p.max}" value="${p.val}" data-p="${p.k}"></label>`).join("")}<button class="btn" data-a="prev">Précédent</button><button class="btn pri" data-a="next">Suivant</button><button class="btn" data-a="end">Tout</button></div><div class="rw"></div></div>`;
  const $=s=>host.querySelector(s);
  function gen(){L=spec.gen(P);k=0;draw();}
  function draw(){$(".rw").innerHTML=L.slice(0,k+1).map((x,i)=>{const t=Array.isArray(x)?x:[x,""];return `<div class="rwl${i===k?" on":""}">${i?"= ":""}<code>${esc(t[0])}</code>${t[1]?` <span class="muted">${esc(t[1])}</span>`:""}</div>`;}).join("");$('[data-a="prev"]').disabled=k===0;$('[data-a="next"]').disabled=k>=L.length-1;}
  host.addEventListener("click",e=>{const a=e.target.closest("[data-a]")?.dataset.a;if(!a)return;if(a==="prev"&&k>0)k--;if(a==="next"&&k<L.length-1)k++;if(a==="end")k=L.length-1;draw();});
  host.addEventListener("change",e=>{const p=e.target.dataset.p;if(!p)return;const d=spec.params.find(x=>x.k===p);let v=Math.round(+e.target.value);v=Math.max(d.min,Math.min(d.max,isNaN(v)?d.val:v));e.target.value=v;P[p]=v;gen();});
  gen();
}

/* ------------------------------------------------------------------
   Tracés de fonctions pour le calculus (sur le moteur de figures G)
------------------------------------------------------------------ */
function plotter(w,h,xmin,xmax,ymin,ymax){
  const X=x=>(x-xmin)/(xmax-xmin)*w,Y=y=>h-(y-ymin)/(ymax-ymin)*h,ix=px=>xmin+px/w*(xmax-xmin),iy=py=>ymin+(h-py)/h*(ymax-ymin);
  const fmt=v=>String(Math.round(v*100)/100).replace(".",",");
  function axes(){let s="";const step=(r)=>{const raw=r/8,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p;};const sx=step(xmax-xmin),sy=step(ymax-ymin);
    for(let x=Math.ceil(xmin/sx)*sx;x<=xmax;x+=sx){s+=`<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${h}" class="grid"/>`;if(Math.abs(x)>1e-9)s+=`<text x="${X(x)}" y="${Math.min(h-4,Math.max(14,Y(0)+16))}" class="t-mut t-up" text-anchor="middle">${fmt(x)}</text>`;}
    for(let y=Math.ceil(ymin/sy)*sy;y<=ymax;y+=sy){s+=`<line x1="0" y1="${Y(y)}" x2="${w}" y2="${Y(y)}" class="grid"/>`;if(Math.abs(y)>1e-9)s+=`<text x="${Math.min(w-20,Math.max(4,X(0)+6))}" y="${Y(y)+4}" class="t-mut t-up">${fmt(y)}</text>`;}
    if(ymin<=0&&ymax>=0)s+=`<line x1="0" y1="${Y(0)}" x2="${w}" y2="${Y(0)}" class="l-thin"/>`;if(xmin<=0&&xmax>=0)s+=`<line x1="${X(0)}" y1="0" x2="${X(0)}" y2="${h}" class="l-thin"/>`;return s;}
  function path(f,cls,a,b){a=a==null?xmin:a;b=b==null?xmax:b;let d="",pen=false;const n=400;for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;let y;try{y=f(x);}catch(e){y=NaN;}if(!isFinite(y)||y<ymin-(ymax-ymin)*3||y>ymax+(ymax-ymin)*3){pen=false;continue;}d+=(pen?"L":"M")+X(x).toFixed(1)+" "+Y(y).toFixed(1);pen=true;}return `<path d="${d}" class="${cls||"l-cob"}"/>`;}
  function area(f,a,b,cls){let d=`M${X(a).toFixed(1)} ${Y(0).toFixed(1)}`;const n=200;for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;let y=f(x);if(!isFinite(y))y=0;y=Math.max(ymin,Math.min(ymax,y));d+=`L${X(x).toFixed(1)} ${Y(y).toFixed(1)}`;}d+=`L${X(b).toFixed(1)} ${Y(0).toFixed(1)}Z`;return `<path d="${d}" class="${cls||"f-cob"}"/>`;}
  return {X,Y,ix,iy,axes,path,area,fmt};
}

window.W={esc,code,hlCode,tracer,calltree,sortviz,dicho,listlab,drill,rewrite,plotter};
})();
