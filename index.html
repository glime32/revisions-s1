      +D.wedge(P.A,P.B,P.C,34,"f-amb")+D.wedge(P.B,P.C,P.A,34,"f-ok")+D.wedge(P.C,P.A,P.B,34,"f-cob")
      +D.wedge(P1,P.A,P.B,38,"f-amb")+D.wedge(P.B,P.A,P.C,38,"f-cob")+D.wedge(P.C,P.A,P2,38,"f-ok")
      +D.arc(P1,P.A,P.B,38,"l-amb")+D.arc(P.B,P.A,P.C,38,"l-cob")+D.arc(P.C,P.A,P2,38,"l-ok");},

   hint:"Les couleurs en A recopient les angles de B (orange) et de C (vert)."}),
 formal:`<p><b>Proposition 2.4.2.</b> Pour tout triangle ABC : (1) |Â| + |B̂| + |Ĉ| = π ; (2) ${an("ABC")} + ${an("BCA")} + ${an("CAB")} = π [2π].</p><p>Attention à l'ordre des lettres dans (2) : les trois angles doivent être orientés dans le même sens.</p><p class="ref">Preuve : la parallèle à (BC) passant par A et les angles alternes-internes.</p>`,

push({id:"cor-2-4-3",type:"th",ref:"Cor 2.4.3",t:"ACA avec des angles placés n'importe où",short:"ACA généralisé (Cor 2.4.3)",
 plain:`Pour ACA, les deux angles n'ont pas besoin d'être aux extrémités du côté : ${hl("un côté et deux angles quelconques suffisent")}. Le troisième angle se déduit, puisque la somme vaut π.`,
 fig:()=>({w:600,h:320,P:{A:[110,80],B:[60,250],C:[240,220]},
   con:{A:p=>V(Math.min(p.x,270),p.y),B:p=>V(Math.min(p.x,270),p.y),C:p=>V(Math.min(p.x,270),p.y)},

   info:(P)=>R.m([["AB = A′B′",fl(P.A,P.B)],["|Â| = |Â′|",fa(absang(P.B,P.A,P.C))],["|Ĉ| = |Ĉ′|",fa(absang(P.A,P.C,P.B))],["donc |B̂| = |B̂′|",fa(absang(P.A,P.B,P.C))]])+R.v("L'angle en C n'est pas au bout du côté [AB], mais |B̂| = π − |Â| − |Ĉ| : on retombe sur ACA.","info"),
   away:()=>V(150,170)}),
 formal:`<p><b>Corollaire 2.4.3.</b> Les triangles ABC et A′B′C′ sont isométriques si et seulement si A′B′ = AB, |Â′| = |Â| et |Ĉ′| = |Ĉ|.</p><p>Dans l'axiome V, la condition (ACA) est donc valable même quand les angles ne sont pas adjacents au côté. Pour (CAC), l'angle doit toujours être entre les deux côtés.</p>`,

function thN(P){return inter(P.M,add(P.M,sub(P.C,P.B)),P.A,P.C);}
push({id:"thales",type:"th",ref:"Théorème 2.5.1",t:"Le théorème de Thalès",cc:"Tombé en 2024 et 2025",
 plain:`Si on coupe un triangle par une droite ${hl("parallèle à un côté")}, on obtient un petit triangle qui est une réduction exacte du grand : toutes les longueurs sont multipliées par le même nombre.`,
 fig:()=>({w:560,h:330,P:{A:[250,60],B:[110,280],C:[450,270],M:[180,170]},
   con:{M:(p,P)=>{const q=onLine(p,P.A,P.B);return dpx(q,P.A)<12?add(P.A,mul(unit(sub(P.B,P.A)),12)):q;}},
   draw:(P)=>{const N=thN(P);if(!N)return "";return D.line(P.A,P.B,"l-cons")+D.line(P.A,P.C,"l-cons")+D.poly([P.A,P.B,P.C],"f-ink")+D.pline([P.A,P.B,P.C,P.A],"l-ink")+D.line(P.M,N,"l-thin")+D.poly([P.A,P.M,N],"f-cob")+D.seg(P.M,N,"l-cob")+D.seg(P.A,P.M,"l-cob")+D.seg(P.A,N,"l-cob")+D.pt(N,"N",V(N.x-80,N.y),"p-cob","t-cob");},
   info:(P)=>{const N=thN(P);if(!N)return "";const r1=d(P.A,P.M)/d(P.A,P.B),r2=d(P.A,N)/d(P.A,P.C),r3=d(P.M,N)/d(P.B,P.C);
     return R.m([["AM / AB",fr(r1,3)],["AN / AC",fr(r2,3)],["MN / BC",fr(r3,3)]])+R.v(param(P.M,P.A,P.B)<0?"M est de l'autre côté de A : les trois rapports restent égaux. Thalès marche avec M ∈ (AB).":"(MN) // (BC) : les trois rapports sont égaux.","ok");},

  {w:"Comme (MN) // (BC), les triangles BMN et CMN ont la même base [MN] et des hauteurs de même longueur (par 2.2.4). Donc 𝒜(BMN) = 𝒜(CMN).",why:"B et C sont à la même distance de (MN), puisque (BC) est parallèle à (MN). Même base, même hauteur, même aire (2.4.1)."},
  {w:"N H<sub>N</sub> est une hauteur commune aux triangles AMN et ABN. Donc AM/AB = 𝒜(AMN)/𝒜(ABN).",why:"Deux triangles de même hauteur : le rapport de leurs aires est le rapport de leurs bases AM et AB (2.4.1)."},
  {w:"ABN est la réunion disjointe de AMN et BMN, donc AM/AB = 𝒜(AMN)/(𝒜(AMN) + 𝒜(BMN)) = 𝒜(AMN)/(𝒜(AMN) + 𝒜(CMN)).",why:"Additivité de l'aire, puis on remplace 𝒜(BMN) par 𝒜(CMN) grâce à l'étape 2. C'est le cœur de la preuve."},
  {w:"ACM est la réunion de AMN et CMN, donc AM/AB = 𝒜(AMN)/𝒜(ACM).",why:"Additivité dans l'autre triangle : le dénominateur devient l'aire de ACM."},
  {w:"M H<sub>M</sub> est une hauteur commune à AMN et ACM, donc 𝒜(AMN)/𝒜(ACM) = AN/AC. Conclusion : AM/AB = AN/AC.",why:"Même raisonnement qu'à l'étape 3, avec les bases AN et AC."}],
 redac:`<p>Soient H<sub>N</sub> et H<sub>M</sub> les pieds des hauteurs de AMN issues de N et M respectivement. Comme les droites (MN) et (BC) sont parallèles, les hauteurs des triangles BMN et CMN par rapport à leur base commune MN sont de même longueur (par 2.2.4), d'où 𝒜(BMN) = 𝒜(CMN).</p><p>Si deux triangles ont une hauteur commune, le rapport de leurs aires est égal au rapport de leurs bases. Comme NH<sub>N</sub> est une hauteur commune aux triangles AMN et ABN :</p><p>AM/AB = 𝒜(AMN)/𝒜(ABN)<br>= 𝒜(AMN)/(𝒜(AMN) + 𝒜(BMN)) car ABN est union disjointe de AMN et de BMN<br>= 𝒜(AMN)/(𝒜(AMN) + 𝒜(CMN)) car 𝒜(BMN) = 𝒜(CMN)<br>= 𝒜(AMN)/𝒜(ACM)<br>= AN/AC car MH<sub>M</sub> est une hauteur commune aux deux triangles.</p>`,
 rel:["thales","demo-2-4-1","axiome-8","demo-2-5-2"]});

/* ---------------- Démo 2.5.2 ---------------- */
push({id:"demo-2-5-2",type:"demo",ref:"Théorème 2.5.2",t:"Démo : la réciproque de Thalès",cc:"Tombé en 2024 · 3 pts",
 plain:`Si les rapports sont égaux, alors la droite est parallèle. Pour le prouver, on ${hl("construit la parallèle")} passant par M, on applique Thalès, et on montre qu'elle passe par N. Attention : il faut des demi-droites.`,
 hyp:"M ∈ ]AB), N ∈ ]AC) et AM/AB = AN/AC.",concl:"(MN) // (BC).",
 idea:`Trace la parallèle à (BC) par M : elle coupe [AC) en N′. Thalès donne AN′ = AN, donc N′ = N (axiome III e).`,
 explore:()=>({w:560,h:320,P:{A:[240,70],B:[110,280],C:[450,260],M:[180,170]},S:{flip:false},drag:["A","B","C","M"],
   toggles:[{k:"flip",label:"Mettre N de l'autre côté de A"}],
   con:{M:(p,P)=>onRay(p,lerp(P.A,P.B,0.1),P.B)},
   draw:(P,S)=>{const r=d(P.A,P.M)/d(P.A,P.B),u=unit(sub(P.C,P.A)),N=add(P.A,mul(u,(S.flip?-1:1)*r*dpx(P.A,P.C)));const par=parallel(P.M,N,P.B,P.C,0.003);
     return D.line(P.A,P.C,"l-cons")+D.pline([P.A,P.B,P.C,P.A],"l-ink")+D.line(P.M,N,par?"l-ok":"l-red")+D.pt(N,"N",P.B,"p-cob","t-cob");},
   info:(P,S)=>{const r=d(P.A,P.M)/d(P.A,P.B),u=unit(sub(P.C,P.A)),N=add(P.A,mul(u,(S.flip?-1:1)*r*dpx(P.A,P.C)));const par=parallel(P.M,N,P.B,P.C,0.003);
     return R.m([["AM/AB",fr(r,3)],["AN/AC",fr(d(P.A,N)/d(P.A,P.C),3)],["(MN) // (BC) ?",yes(par)]])+R.v(par?"Rapports égaux et N sur [AC) : parallèles.":"Rapports égaux, mais N est sur l'autre demi-droite : pas parallèles ! D'où les demi-droites dans l'énoncé.",par?"ok":"");},
   hint:"Active le bouton pour voir le contre-exemple."}),
 fig:()=>({w:560,h:320,P:{A:[240,60],B:[110,280],C:[450,260],M:[175,170]},S:{step:0},drag:["M"],
   con:{M:(p,P)=>onRay(p,lerp(P.A,P.B,0.12),P.B)},
   draw:(P,S)=>{const k=S.step,r=d(P.A,P.M)/d(P.A,P.B),N=add(P.A,mul(sub(P.C,P.A),r));const Np=thN(P);
     let s=D.pline([P.A,P.B,P.C,P.A],"l-ink")+D.pt(P.A,"A",V(260,200))+D.pt(P.B,"B",V(300,200))+D.pt(P.C,"C",V(250,200))+D.pt(N,"N",V(N.x+60,N.y),"p-fix");
     if(k>=1)s+=D.line(P.M,add(P.M,sub(P.C,P.B)),"l-cob-d")+D.txt(V(16,26),"Δ : la parallèle à (BC) passant par M","t-cob t-up");
     if(k>=1&&Np)s+=D.dot(Np,"p-cob",5)+D.lab(Np,"N′",P.C,"t-cob",30);
     if(k===2)s+=D.seg(P.A,Np,"l-cob");
     if(k===3)s+=D.txt(V(16,50),"N et N′ : même distance de A sur [AC)","t-ok t-up");
     if(k>=4)s+=D.seg(P.M,N,"l-ok");
     return s;},
   info:(P)=>{const r=d(P.A,P.M)/d(P.A,P.B),N=add(P.A,mul(sub(P.C,P.A),r)),Np=thN(P);return R.m([["AM/AB",fr(r,3)],["AN",fr(d(P.A,N))],["AN′",Np?fr(d(P.A,Np)):"–"]]);},
   hint:"Déplace M."}),
 steps:[
  {w:"Si A, B, C sont alignés, c'est évident. On suppose ABC non dégénéré, avec AM/AB = AN/AC. On a donc AN = AM·AC/AB.",why:"On isole AN pour pouvoir le comparer à une autre longueur."},
  {w:"Soit Δ la parallèle à (BC) passant par M (axiome II). Elle coupe la demi-droite [AC) en un point N′.",why:"On construit le point qu'on voudrait obtenir : celui qui rend la droite parallèle."},
  {w:"Le théorème de Thalès s'applique à Δ : AM/AB = AN′/AC, d'où AN′ = AM·AC/AB = AN.",why:"Le théorème direct, appliqué dans le triangle ABC avec la parallèle Δ."},
  {w:"Les points N et N′ sont tous deux sur [AC), à la même distance de A. Donc N = N′.",why:"Sur une demi-droite, un seul point est à une distance donnée de l'origine (axiome III e). C'est là que les demi-droites servent."},
  {w:"Donc (MN) = (MN′) = Δ, qui est parallèle à (BC).",why:"La droite (MN) est exactement la parallèle construite à l'étape 2."}],
 redac:`<p>L'assertion est évidente si A, B et C sont alignés. On suppose maintenant que ABC est non dégénéré, et que AM/AB = AN/AC. On a donc AN = AM·AC/AB.</p><p>On considère la droite Δ parallèle à (BC) passant par le point M. Elle coupe la demi-droite [AC) en un point N′. Le théorème de Thalès assure que AM/AB = AN′/AC, d'où AN′ = AM·AC/AB = AN. Les points N et N′ étant tous deux sur [AC), on en déduit N = N′, donc (MN) = (MN′) = Δ est parallèle à (BC).</p><p class="muted">Corrigé 2024 : « Il faut donner la preuve, pas seulement utiliser la réciproque du théorème de Thalès ! »</p>`,
 rel:["thales","demo-2-5-1","axiome-3","demi-droite"]});

/* ---------------- Théorème des milieux ---------------- */
push({id:"milieux",type:"th",ref:"Théorème 2.5.3",t:"Le théorème des milieux",
 plain:`Relie les milieux de deux côtés d'un triangle : le segment obtenu est ${hl("parallèle au troisième côté et deux fois plus court")}. C'est Thalès avec un rapport ½.`,
 fig:()=>({w:560,h:320,P:{A:[260,60],B:[100,270],C:[460,260]},
   draw:(P)=>{const M=mid(P.A,P.B),N=mid(P.A,P.C);return D.pline([P.A,P.B,P.C,P.A],"l-ink")+D.ticks(P.A,M,1,"l-amb")+D.ticks(M,P.B,1,"l-amb")+D.ticks(P.A,N,2,"l-amb")+D.ticks(N,P.C,2,"l-amb")+D.seg(M,N,"l-cob")+D.seg(P.B,P.C,"l-cob")+D.pt(M,"M",P.C,"p-cob","t-cob")+D.pt(N,"N",P.B,"p-cob","t-cob");},
   info:(P)=>{const M=mid(P.A,P.B),N=mid(P.A,P.C);return R.m([["MN",fl(M,N)],["BC / 2",fr(d(P.B,P.C)/2)],["(MN) // (BC) ?",yes(parallel(M,N,P.B,P.C,0.001))]])+R.v("MN = BC/2 et (MN) // (BC), quel que soit le triangle.","ok");}}),
 formal:`<p><b>Théorème 2.5.3.</b> Soit ABC un triangle. Si M est le milieu de [AB] et N le milieu de [AC], alors (MN) et (BC) sont parallèles, et MN = BC/2.</p>`,
 use:`<p>Le CC1 2025 Ex. 3 (4 points sur 8) l'utilise deux fois : dans les triangles BMC et CBS, pour obtenir des parallèles et OI = MC/2. Il sert aussi dans la preuve de la transitivité de l'équipollence (3.2.2).</p>`,
 trap:`Écris bien dans quel triangle tu l'appliques, et quels sont les deux milieux.`,
 q:"M et N sont les milieux de [AB] et [AC], et BC = 6. Que vaut MN ?",a:"3, et de plus (MN) // (BC).",
 rel:["thales","semblables"]});

/* ---------------- Triangles semblables ---------------- */
push({id:"semblables",type:"th",ref:"Déf 2.6.1 et Thm 2.6.2",t:"Les triangles semblables",
 plain:`Deux triangles sont semblables s'ils ont ${hl("la même forme")}, mais pas forcément la même taille : mêmes angles, et des côtés proportionnels. Comme une photo agrandie.`,
 fig:()=>({w:600,h:320,P:{A:[110,90],B:[60,250],C:[230,230]},S:{k:1.5},
   sliders:[{k:"k",label:"Facteur d'agrandissement :",min:0.5,max:1.8,step:0.01,fmt:v=>fr(v)}],
   con:{A:p=>V(Math.min(p.x,250),p.y),B:p=>V(Math.min(p.x,250),p.y),C:p=>V(Math.min(p.x,250),p.y)},
   draw:(P,S)=>{const Gc=V((P.A.x+P.B.x+P.C.x)/3,(P.A.y+P.B.y+P.C.y)/3),f=q=>add(V(440,170),mul(sub(rot(q,Gc,-0.4),Gc),S.k));const A2=f(P.A),B2=f(P.B),C2=f(P.C),c2=V(440,170);
     return tri(P.A,P.B,P.C,"l-ink","f-ink")+tri(A2,B2,C2,"l-cob","f-cob")+D.marks(P.B,P.A,P.C,22,1,"l-amb")+D.marks(B2,A2,C2,22,1,"l-amb")+D.marks(P.A,P.B,P.C,22,2,"l-amb")+D.marks(A2,B2,C2,22,2,"l-amb")+D.pt(A2,"A′",c2,"p-cob","t-cob")+D.pt(B2,"B′",c2,"p-cob","t-cob")+D.pt(C2,"C′",c2,"p-cob","t-cob");},
   info:(P,S)=>{const Gc=V((P.A.x+P.B.x+P.C.x)/3,(P.A.y+P.B.y+P.C.y)/3),f=q=>add(V(440,170),mul(sub(rot(q,Gc,-0.4),Gc),S.k));const A2=f(P.A),B2=f(P.B),C2=f(P.C);
     return R.m([["A′B′ / AB",fr(d(A2,B2)/d(P.A,P.B))],["A′C′ / AC",fr(d(A2,C2)/d(P.A,P.C))],["B′C′ / BC",fr(d(B2,C2)/d(P.B,P.C))],["|Â| et |Â′|",fa(absang(P.B,P.A,P.C))]])+R.v(Math.abs(S.k-1)<0.01?"Facteur 1 : semblables ET isométriques.":"Mêmes angles, côtés proportionnels : semblables, mais pas isométriques.","info");},
   away:()=>V(150,170)}),
 formal:`<p><b>Définition 2.6.1.</b> ABC et A′B′C′ sont semblables s'ils ont les mêmes mesures d'angles : |Â| = |Â′|, |B̂| = |B̂′|, |Ĉ| = |Ĉ′|. Deux égalités suffisent (la somme vaut π).</p><p><b>Théorème 2.6.2.</b> Les trois assertions suivantes sont équivalentes : (i) ABC et A′B′C′ sont semblables ; (ii) AB/A′B′ = AC/A′C′ = CB/C′B′ ; (iii) AB/A′B′ = AC/A′C′ et |Â| = |Â′|.</p>`,
 use:`<p>Montrer que deux triangles sont semblables donne des rapports de longueurs égaux, et inversement. Le (iii) est un « CAC proportionnel ».</p>`,
 trap:`Semblables ne veut pas dire isométriques : la taille peut changer.`,
 q:"Deux triangles ont deux angles égaux. Sont-ils semblables ?",a:"Oui : le troisième angle est aussi égal, puisque la somme vaut π (Prop 2.4.2).",
 rel:["thales","somme-angles","axiome-5"]});

})();

</script>
<script>
/* Chapitre 3 : parallélogrammes et vecteurs ; chapitre 4 : résultats de TD */
(function(){
const {V,D,R,d,dpx,fl,fa,fr,ang,absang,mid,proj,param,inter,sym,rot,reflect,side,onLine,onSeg,onRay,snapLine,near,parallel,unit,perp,add,sub,mul,lerp,segInter,crs,PI}=G;
const an=s=>`<span class="ang">${s}</span>`, m=s=>`<span class="m">${s}</span>`, hl=s=>`<span class="hl">${s}</span>`, vc=s=>`<span class="vec">${s}</span>`;
const C=window.CONCEPTS;
const push3=o=>{o.ch=3;C.push(o);}, push4=o=>{o.ch=4;C.push(o);};
const yes=(b,t1,t2)=>b?`<span class="ok">${t1||"oui"}</span>`:`<span class="no">${t2||"non"}</span>`;
const tri=(A,B,Cc,cl,fill)=>(fill?D.poly([A,B,Cc],fill):"")+D.pline([A,B,Cc,A],cl||"l-ink");
const quad=(A,B,Cc,Dd,cl)=>D.pline([A,B,Cc,Dd,A],cl||"l-ink");
const ctr4=P=>V((P.A.x+P.B.x+P.C.x+(P.D?P.D.x:P.A.x))/4,(P.A.y+P.B.y+P.C.y+(P.D?P.D.y:P.A.y))/4);

/* ---------------- Parallélogramme ---------------- */
push3({id:"parallelogramme",type:"def",ref:"Déf 3.1.1 et 3.1.4",t:"Le parallélogramme",
 plain:`Dans ce cours, ABCD est un parallélogramme quand ${hl("ses deux diagonales [AC] et [BD] se coupent en leur milieu")}. Ce n'est pas la définition du collège (côtés parallèles), mais on retrouve les mêmes figures.`,
 fig:()=>({w:560,h:320,P:{A:[110,250],B:[170,90],C:[440,80],D:[400,260]},
   con:{D:(p,P)=>{const Q=add(P.A,sub(P.C,P.B));return dpx(p,Q)<10?Q:p;}},
   draw:(P)=>{const I=mid(P.A,P.C),J=mid(P.B,P.D),ok=dpx(I,J)<0.5;
     return D.poly([P.A,P.B,P.C,P.D],ok?"f-ok":"f-ink")+quad(P.A,P.B,P.C,P.D,"l-ink")+D.seg(P.A,P.C,"l-cob-d")+D.seg(P.B,P.D,"l-amb-d")+(ok?D.dot(I,"p-ok",6):D.dot(I,"p-cob",5)+D.dot(J,"p-fix",5)+D.lab(I,"milieu de [AC]",J,"t-cob t-up",24)+D.lab(J,"milieu de [BD]",I,"t-amb t-up",24));},
   info:(P)=>{const I=mid(P.A,P.C),J=mid(P.B,P.D),ok=dpx(I,J)<0.5;return R.m([["AB",fl(P.A,P.B)],["CD",fl(P.C,P.D)],["AD",fl(P.A,P.D)],["BC",fl(P.B,P.C)],["écart des milieux",fr(d(I,J))]])+R.v(ok?"Les diagonales ont le même milieu : ABCD est un parallélogramme.":"Les deux milieux sont différents : pas un parallélogramme.",ok?"ok":"");},
   goal:{text:"déplace D pour que les deux milieux se rejoignent.",ok:(P)=>dpx(mid(P.A,P.C),mid(P.B,P.D))<0.5,win:"ABCD est un parallélogramme. Regarde les longueurs : AB = CD et AD = BC (Prop 3.1.2)."}}),
 formal:`<p><b>Définition 3.1.1.</b> Un quadrilatère ABCD est un parallélogramme si les diagonales [AC] et [BD] ont ${hl("même milieu")}.</p><p><b>Définition 3.1.4.</b> ABCD non dégénéré est un trapèze si (AB) // (CD) ou (AD) // (BC) ; un rectangle si ses quatre angles sont droits ; un losange si ses quatre côtés ont même longueur ; un carré si c'est à la fois un rectangle et un losange.</p>`,
 use:`<p>Pour montrer qu'un quadrilatère est un parallélogramme : montre que les diagonales ont le même milieu (définition), ou utilise un critère de la Prop 3.1.3. Ensuite, la Prop 3.1.2 donne côtés parallèles et égaux.</p>`,
 trap:`Attention à l'ordre des sommets : les diagonales de ABCD sont [AC] et [BD]. ABDC n'est pas le même quadrilatère.`,
 q:"Quelle est la définition d'un parallélogramme ABCD dans ce cours ?",a:"ABCD est un parallélogramme si les diagonales [AC] et [BD] ont le même milieu.",
 rel:["demo-3-1-2","criteres-parallelogramme","demo-2-2-4"]});

/* ---------------- Démo 3.1.2 ---------------- */
push3({id:"demo-3-1-2",type:"demo",ref:"Proposition 3.1.2",t:"Démo : les côtés opposés d'un parallélogramme",
 plain:`Dans un parallélogramme, les côtés opposés sont parallèles et de même longueur. Preuve en une idée : ${hl("la symétrie autour du centre O")} envoie A sur C et B sur D, donc le côté [AB] sur le côté [CD].`,
 hyp:"ABCD est un parallélogramme : [AC] et [BD] ont le même milieu O.",concl:"(AB) // (CD), AB = CD, (AD) // (BC) et AD = BC.",
 idea:`s = symétrie de centre O. s(A) = C et s(B) = D, et le Thm 2.2.3 fait tout le reste.`,
 fig:()=>({w:560,h:300,P:{A:[110,240],B:[170,80],C:[440,70]},S:{step:0},
   draw:(P,S)=>{const k=S.step,Dd=add(P.A,sub(P.C,P.B)),O=mid(P.A,P.C);let s=quad(P.A,P.B,P.C,Dd,"l-ink")+D.seg(P.A,P.C,"l-cons")+D.seg(P.B,Dd,"l-cons")+D.pt(Dd,"D",O)+D.pt(O,"O",P.B,"p-cob","t-cob");
     if(k===0)s+=D.ticks(P.A,O,1,"l-cob")+D.ticks(O,P.C,1,"l-cob")+D.ticks(P.B,O,2,"l-amb")+D.ticks(O,Dd,2,"l-amb");
     if(k===1)s+=D.line(P.A,P.B,"l-amb")+D.line(P.C,Dd,"l-cob");
     if(k===2)s+=D.seg(P.A,P.B,"l-cob")+D.seg(P.C,Dd,"l-cob")+D.ticks(P.A,P.B,1,"l-cob")+D.ticks(P.C,Dd,1,"l-cob");
     if(k===3)s+=D.line(P.A,Dd,"l-amb")+D.line(P.B,P.C,"l-cob")+D.ticks(P.A,Dd,2,"l-amb")+D.ticks(P.B,P.C,2,"l-amb");
     return s;},
   info:(P)=>{const Dd=add(P.A,sub(P.C,P.B));return R.m([["AB",fl(P.A,P.B)],["CD",fl(P.C,Dd)],["AD",fl(P.A,Dd)],["BC",fl(P.B,P.C)]]);}}),
 steps:[
  {w:"Soit O le milieu commun de [AC] et [BD], et s = s<sub>O</sub>. Alors s(A) = C et s(B) = D.",why:"O est le milieu de [AC] : par définition (et unicité, Lemme 2.2.1), le symétrique de A est C. Pareil pour B et D."},
  {w:"s((AB)) = (s(A)s(B)) = (CD). D'après le Thm 2.2.3 (2), cette image est parallèle à (AB) : (AB) // (CD).",why:"L'image d'une droite par une symétrie centrale est une droite parallèle."},
  {w:"s est une isométrie (Thm 2.2.3 (1)) : CD = s(A)s(B) = AB.",why:"Les distances sont conservées."},
  {w:"On montre de même, avec s(A) = C et s(D) = B, que (AD) // (BC) et AD = BC.",why:"Même raisonnement avec l'autre paire de côtés."}],
 redac:`<p>Soit O le milieu commun de [AC] et [BD], et s = s<sub>O</sub>. Alors s(A) = C et s(B) = D, donc s((AB)) = (CD), et on en déduit que (AB) // (CD) et AB = s(A)s(B) = CD par 2.2.3. On montre de même que (AD) // (BC) et AD = BC.</p>`,
 rel:["parallelogramme","thm-2-2-3","criteres-parallelogramme"]});

/* ---------------- Prop 3.1.3 ---------------- */
function papillon(P){const I=mid(P.A,P.C),J=add(I,perp(sub(P.C,P.A)));return reflect(P.B,I,J);}
push3({id:"criteres-parallelogramme",type:"th",ref:"Prop 3.1.3",t:"Reconnaître un parallélogramme",short:"Critères du parallélogramme",
 plain:`Trois façons de prouver qu'un quadrilatère est un parallélogramme : ${hl("deux paires de côtés parallèles")} ; ${hl("deux paires de côtés de même longueur")} + une condition de position ; ${hl("une paire de côtés parallèles et de même longueur")} + la même condition.`,
 fig:()=>({w:560,h:320,P:{A:[120,250],B:[170,90],C:[440,80],D:[330,220]},
   buttons:[{label:"Parallélogramme",act:(P)=>{P.D=add(P.A,sub(P.C,P.B));}},{label:"Contre-exemple « papillon »",act:(P)=>{P.D=papillon(P);}}],
   con:{D:(p,P)=>{const Q=add(P.A,sub(P.C,P.B)),Q2=papillon(P);return dpx(p,Q)<9?Q:dpx(p,Q2)<9?Q2:p;}},
   draw:(P)=>{const ok=dpx(mid(P.A,P.C),mid(P.B,P.D))<0.5;return D.poly([P.A,P.B,P.C,P.D],ok?"f-ok":"f-ink")+quad(P.A,P.B,P.C,P.D,"l-ink")+D.seg(P.A,P.C,"l-cons")+D.seg(P.B,P.D,"l-cons");},
   info:(P)=>{const pAB=parallel(P.A,P.B,P.C,P.D,0.003),pAD=parallel(P.A,P.D,P.B,P.C,0.003),eAB=Math.abs(d(P.A,P.B)-d(P.C,P.D))<0.02,eAD=Math.abs(d(P.A,P.D)-d(P.B,P.C))<0.02;
     const sep=side(P.B,P.A,P.C)*side(P.D,P.A,P.C)<0||side(P.A,P.B,P.D)*side(P.C,P.B,P.D)<0,ok=dpx(mid(P.A,P.C),mid(P.B,P.D))<0.5;
     return R.m([["(i) côtés parallèles",yes(pAB&&pAD)],["(ii) côtés égaux",yes(eAB&&eAD)],["une diagonale sépare",yes(sep)],["(iii) une paire // et =",yes(pAB&&eAB)],["parallélogramme ?",yes(ok)]])
      +R.v(ok?"Les diagonales ont le même milieu : c'est un parallélogramme.":(eAB&&eAD&&!sep)?"AB = CD et AD = BC, mais aucune diagonale ne sépare les deux autres sommets : ce n'est PAS un parallélogramme.":"Pas un parallélogramme.",ok?"ok":"");},
   hint:"Essaie les deux boutons, puis déplace D."}),
 formal:`<p><b>Proposition 3.1.3.</b> Soient A, B, C, D quatre points deux à deux distincts et non alignés. Dans chacun des cas suivants, ABCD est un parallélogramme :</p><ul><li>(i) (AB) // (CD) et (AD) // (BC) ;</li><li>(ii) AB = CD, AD = BC, et ${hl("une des diagonales sépare les deux autres points")} ;</li><li>(iii) (AB) // (CD), AB = CD, et une des diagonales sépare les deux autres points.</li></ul><p class="ref">(i) est le Cor 2.2.4. (ii) : triangles ABD et CDB isométriques puis alternes-internes. (iii) : alternes-internes puis (ii).</p>`,
 use:`<p>Choisis le critère qui colle aux hypothèses : des parallèles → (i) ; des longueurs → (ii) ; une paire parallèle et de même longueur → (iii). Le CC1 2024 Ex. 2 (d) finit avec (i).</p>`,
 trap:`AB = CD et AD = BC ne suffisent pas : le « papillon » (bouton) a les mêmes longueurs sans être un parallélogramme. La condition « une diagonale sépare » est indispensable.`,
 q:"AB = CD et AD = BC. ABCD est-il forcément un parallélogramme ?",a:"Non. Il faut en plus qu'une diagonale sépare les deux autres sommets (Prop 3.1.3 (ii)). Sinon, on peut avoir un « papillon ».",
 rel:["parallelogramme","demo-2-2-4","alternes-internes"]});

/* ---------------- Équipollence ---------------- */
push3({id:"equipollence",type:"def",ref:"Déf 3.2.1 et Rem 3.2.5",t:"Couples équipollents",
 plain:`Deux couples de points (A, B) et (A′, B′) sont équipollents quand ${hl("la flèche de A vers B et celle de A′ vers B′ sont « la même flèche » déplacée")} : même direction, même sens, même longueur. Formellement : ABB′A′ est un parallélogramme.`,
 fig:()=>({w:560,h:320,P:{A:[100,230],B:[250,120],Ap:[290,260],Bp:[420,170]},labels:{Ap:"A′",Bp:"B′"},S:{other:false},
   toggles:[{k:"other",label:"Montrer AA′ et BB′"}],
   con:{Bp:(p,P)=>{const Q=add(P.Ap,sub(P.B,P.A));return dpx(p,Q)<10?Q:p;}},
   draw:(P,S)=>{const ok=dpx(mid(P.A,P.Bp),mid(P.B,P.Ap))<0.5;let s=quad(P.A,P.B,P.Bp,P.Ap,"l-cons")+D.seg(P.A,P.Bp,"l-thin")+D.seg(P.B,P.Ap,"l-thin")+D.vec(P.A,P.B,"l-cob","cob")+D.vec(P.Ap,P.Bp,ok?"l-cob":"l-red",ok?"cob":"red");
     if(S.other)s+=D.vec(P.A,P.Ap,"l-amb","amb")+D.vec(P.B,P.Bp,"l-amb","amb");
     s+=D.dot(mid(P.A,P.Bp),"p-cob",4)+D.dot(mid(P.B,P.Ap),"p-fix",4);return s;},
   info:(P)=>{const ok=dpx(mid(P.A,P.Bp),mid(P.B,P.Ap))<0.5;return R.m([["AB",fl(P.A,P.B)],["A′B′",fl(P.Ap,P.Bp)],["milieux de [AB′] et [BA′]",ok?"confondus":"différents"]])+R.v(ok?"ABB′A′ est un parallélogramme : (A, B) ∼ (A′, B′). Et aussi (A, A′) ∼ (B, B′) : c'est la Remarque 3.2.5.":"ABB′A′ n'est pas un parallélogramme.",ok?"ok":"");},
   goal:{text:"place B′ pour que la flèche A′B′ soit la même que AB.",ok:(P)=>dpx(mid(P.A,P.Bp),mid(P.B,P.Ap))<0.5,win:"(A, B) ∼ (A′, B′). Active « Montrer AA′ et BB′ » : ces deux flèches sont aussi égales."}}),
 formal:`<p><b>Définition 3.2.1.</b> (A, B) et (A′, B′) sont équipollents si le quadrilatère ${hl("ABB′A′")} est un parallélogramme. On note (A, B) ∼ (A′, B′).</p><p><b>Remarque 3.2.5.</b> ${vc("AB")} = ${vc("A′B′")} ⇔ ${vc("AA′")} = ${vc("BB′")} : les deux disent que ABB′A′ est un parallélogramme.</p>`,
 gloss:["∼ : « équipollent à »","ABB′A′ : l'ordre des lettres compte"],
 use:`<p>La Remarque 3.2.5 est l'outil de la démo 3.2.8 : on l'utilise trois fois de suite.</p>`,
 trap:`L'ordre des lettres : ABB′A′, pas ABA′B′. Ses diagonales sont [AB′] et [BA′].`,
 q:"(A, B) ∼ (A′, B′) veut dire que quel quadrilatère est un parallélogramme ?",a:"ABB′A′ (diagonales [AB′] et [BA′] de même milieu).",
 rel:["vecteur","parallelogramme","demo-3-2-8"]});

/* ---------------- Vecteur ---------------- */
push3({id:"vecteur",type:"def",ref:"Prop 3.2.2 et Déf 3.2.4",t:"Le vecteur",
 plain:`Un vecteur, c'est ${hl("une flèche qu'on a le droit de faire glisser")} sans la tourner ni l'étirer. Formellement : l'ensemble de tous les couples équipollents à (A, B). Chacun de ces couples est un représentant.`,
 fig:()=>({w:560,h:320,P:{A:[90,240],B:[200,160],P:[330,230]},labels:{P:"P"},
   draw:(P)=>{const u=sub(P.B,P.A);let s="";[[60,70],[200,60],[380,70],[470,200],[300,120],[160,290]].forEach(q=>{const S=V(q[0],q[1]);s+=D.vec(S,add(S,u),"l-cons","ink");});
     return s+D.vec(P.A,P.B,"l-cob","cob")+D.vec(P.P,add(P.P,u),"l-amb","amb")+D.pt(add(P.P,u),"P + u",P.P,"p-fix","t-amb");},
   info:(P)=>R.v("Toutes ces flèches représentent le même vecteur u = "+vc("AB")+". Déplace P : sa flèche reste un représentant de u.","info"),
   hint:"Change u avec A et B, déplace P."}),
 formal:`<p><b>Proposition 3.2.2.</b> L'équipollence est une relation d'équivalence : réflexive ((A, B) ∼ (A, B)), symétrique, et transitive (si (A, B) ∼ (A′, B′) et (A′, B′) ∼ (A″, B″), alors (A, B) ∼ (A″, B″)).</p><p><b>Définition 3.2.4.</b> Un vecteur du plan est une classe d'équipollence de couples de points. Si (A, B) en est un représentant, on note ${vc("u")} = ${vc("AB")}.</p><p>Le vecteur nul ${vc("0")} = ${vc("AA")} : (C, D) le représente si et seulement si C = D.</p>`,
 gloss:["classe d'équivalence : tous les objets « équivalents » à un objet donné","représentant : un couple choisi dans la classe"],
 use:`<p>${vc("AB")} = ${vc("A′B′")} se traduit toujours par « ABB′A′ est un parallélogramme ». C'est cette traduction qu'on utilise dans les démos.</p>`,
 trap:`La transitivité n'est pas évidente (la preuve du poly utilise le théorème des milieux), mais tu peux l'utiliser librement.`,
 q:"Qu'est-ce qu'un vecteur dans ce cours ?",a:"Une classe d'équipollence de couples de points : l'ensemble de tous les couples équipollents à un couple (A, B) donné.",
 rel:["equipollence","demo-3-2-6","somme-vecteurs"]});

/* ---------------- Démo 3.2.6 ---------------- */
push3({id:"demo-3-2-6",type:"demo",ref:"Lemme 3.2.6",t:"Démo : le translaté d'un point par un vecteur",
 plain:`On veut faire partir la flèche ${vc("u")} d'un point A donné. On trouve l'extrémité B grâce à ${hl("un milieu et une symétrie centrale")}, en fabriquant un parallélogramme.`,
 hyp:`${vc("u")} est un vecteur et A un point.`,concl:`il existe un unique point B tel que ${vc("u")} = ${vc("AB")}.`,
 idea:`Prends M le milieu de [AD], puis B le symétrique de C par rapport à M : les diagonales [AD] et [CB] ont le même milieu.`,
 fig:()=>({w:560,h:320,P:{C:[90,250],D:[250,200],A:[230,80]},S:{step:0},
   draw:(P,S)=>{const k=S.step,M=mid(P.A,P.D),B=sym(P.C,M);let s=D.vec(P.C,P.D,"l-cob","cob")+D.txt(mid(P.C,P.D),"u","t-cob",-6,18);
     if(k>=1)s+=D.seg(P.A,P.D,"l-cons")+D.pt(M,"M",P.C,"p-cob","t-cob")+D.ticks(P.A,M,1,"l-amb")+D.ticks(M,P.D,1,"l-amb");
     if(k>=1)s+=D.seg(P.C,B,"l-cons")+D.pt(B,"B",M,"p-cob","t-cob")+D.ticks(P.C,M,2,"l-thin")+D.ticks(M,B,2,"l-thin");
     if(k>=2)s+=quad(P.A,B,P.D,P.C,"l-thin");
     if(k>=3)s+=D.vec(P.A,B,"l-ok","ok");
     return s;},
   info:(P)=>{const M=mid(P.A,P.D),B=sym(P.C,M);return R.m([["CD",fl(P.C,P.D)],["AB",fl(P.A,B)],["(AB) // (CD) ?",yes(parallel(P.A,B,P.C,P.D,0.001))]]);},
   hint:"Déplace A, C ou D."}),
 steps:[
  {w:`Soit (C, D) un représentant de ${vc("u")} : ${vc("u")} = ${vc("CD")}.`,why:"Un vecteur a toujours au moins un représentant : on part de lui."},
  {w:"Soit M le milieu de [AD]. D'après le lemme 2.2.1, il existe un unique point B tel que M soit le milieu de [CB].",why:"B est le symétrique de C par rapport à M."},
  {w:"[AD] et [CB] ont le même milieu M, donc ABDC est un parallélogramme.",why:"C'est exactement la définition 3.1.1 : les diagonales de ABDC sont [AD] et [BC]."},
  {w:`Par définition de l'équipollence, (A, B) ∼ (C, D), c'est-à-dire ${vc("AB")} = ${vc("CD")} = ${vc("u")}.`,why:"(A, B) ∼ (C, D) signifie que ABDC est un parallélogramme (Déf 3.2.1)."},
  {w:`Unicité : si ${vc("AB′")} = ${vc("u")}, alors AB′DC est un parallélogramme, donc M est le milieu de [CB′], et B′ = B par l'unicité du lemme 2.2.1.`,why:"Il n'y a qu'un seul point dont M est le milieu avec C."}],
 redac:`<p>Soit (C, D) un représentant de ${vc("u")}. On a donc ${vc("u")} = ${vc("CD")}. Soit M le milieu de [AD]. D'après le lemme 2.2.1, il existe un unique point B tel que M soit le milieu de [CB], c'est-à-dire tel que [AD] et [CB] aient même milieu. Alors ABDC est un parallélogramme, donc (A, B) ∼ (C, D), autrement dit ${vc("AB")} = ${vc("CD")} = ${vc("u")}.</p><p>Si B′ vérifie aussi ${vc("AB′")} = ${vc("u")}, alors AB′DC est un parallélogramme, M est le milieu de [CB′], et B′ = B par l'unicité dans le lemme 2.2.1.</p>`,
 rel:["vecteur","symetrie-centrale","demo-3-2-8"]});

/* ---------------- Somme de vecteurs ---------------- */
push3({id:"somme-vecteurs",type:"def",ref:"Déf 3.2.7, Prop 3.2.9 et 3.2.10",t:"La somme de deux vecteurs, Chasles",short:"Somme de vecteurs et Chasles",
 plain:`Pour ajouter ${vc("u")} et ${vc("v")}, on ${hl("met les flèches bout à bout")} : on fait partir ${vc("v")} du bout de ${vc("u")}. La somme va du départ de la première au bout de la seconde.`,
 fig:()=>({w:560,h:320,P:{A:[80,250],B:[230,160],C:[330,280],D:[430,220]},S:{par:false},
   toggles:[{k:"par",label:"Règle du parallélogramme"}],
   draw:(P,S)=>{const v=sub(P.D,P.C),E=add(P.B,v);let s=D.vec(P.A,P.B,"l-cob","cob")+D.vec(P.C,P.D,"l-amb","amb")+D.vec(P.B,E,"l-amb","amb")+D.vec(P.A,E,"l-ok","ok")+D.pt(E,"E",P.A,"p-ok","t-ok")+D.txt(mid(P.A,P.B),"u","t-cob",-12,-6)+D.txt(mid(P.C,P.D),"v","t-amb",0,18);
     if(S.par){const Dp=add(P.A,v);s+=D.vec(P.A,Dp,"l-amb-d","amb")+D.seg(Dp,E,"l-cons")+D.pt(Dp,"D′",P.B,"p-fix","t-amb");}
     return s;},
   info:(P)=>R.v(`${vc("u")} + ${vc("v")} = ${vc("AE")}, où E est le point tel que ${vc("BE")} = ${vc("v")}. Avec E = C, c'est Chasles : ${vc("AB")} + ${vc("BC")} = ${vc("AC")}.`,"info"),
   hint:"Bleu : u. Orange : v, recopié au bout de u. Vert : la somme."}),
 formal:`<p><b>Définition 3.2.7.</b> Soient ${vc("u")} = ${vc("AB")} et ${vc("v")} = ${vc("CD")}. Soit E l'unique point tel que ${vc("BE")} = ${vc("CD")} (Lemme 3.2.6). On pose ${hl(`${vc("u")} + ${vc("v")} = ${vc("AE")}`)}.</p><p><b>Proposition 3.2.9 (Chasles).</b> ${vc("AC")} = ${vc("AB")} + ${vc("BC")}.</p><p><b>Proposition 3.2.10.</b> ${vc("AB")} + ${vc("AD")} = ${vc("AE")} ⇔ ABED est un parallélogramme.</p><p>Avec la multiplication par un réel (Déf 3.2.11), les vecteurs forment un espace vectoriel réel (Prop 3.2.12).</p>`,
 use:`<p>Chasles sert à décomposer un vecteur en passant par un point intermédiaire. La règle du parallélogramme (3.2.10) relie somme et parallélogramme.</p>`,
 trap:`La définition dépend a priori des représentants choisis : il faut le vérifier, c'est la démo 3.2.8.`,
 q:`Que vaut ${vc("AB")} + ${vc("BC")} ?`,a:`${vc("AC")} : c'est la relation de Chasles (Prop 3.2.9).`,
 rel:["demo-3-2-8","demo-3-2-6","vecteur"]});

/* ---------------- Démo 3.2.8 ---------------- */
push3({id:"demo-3-2-8",type:"demo",ref:"Proposition 3.2.8",t:"Démo : la somme de deux vecteurs est bien définie",
 plain:`On définit ${vc("u")} + ${vc("v")} avec des représentants choisis. Il faut vérifier qu'${hl("un autre choix donne le même résultat")}. La preuve utilise trois fois la Remarque 3.2.5 et la transitivité.`,
 hyp:`${vc("AB")} = ${vc("A′B′")} = ${vc("u")}, ${vc("CD")} = ${vc("C′D′")} = ${vc("v")}, E et E′ tels que ${vc("BE")} = ${vc("CD")} et ${vc("B′E′")} = ${vc("C′D′")}.`,concl:`${vc("AE")} = ${vc("A′E′")} : la somme ne dépend pas des représentants.`,
 idea:`Remarque 3.2.5 : ${vc("AB")} = ${vc("A′B′")} ⇔ ${vc("AA′")} = ${vc("BB′")}. On fait passer l'égalité de B à E, puis de A à E.`,
 fig:()=>({w:580,h:330,P:{A:[60,250],B:[180,170],Ap:[260,290],C:[360,90],Dv:[450,60]},labels:{Ap:"A′",Dv:"D"},S:{step:0},
   draw:(P,S)=>{const k=S.step,u=sub(P.B,P.A),v=sub(P.Dv,P.C),Bp=add(P.Ap,u),E=add(P.B,v),Ep=add(Bp,v);
     let s=D.vec(P.A,P.B,"l-cob","cob")+D.vec(P.Ap,Bp,"l-cob","cob")+D.vec(P.C,P.Dv,"l-amb","amb")+D.vec(P.B,E,"l-amb","amb")+D.vec(Bp,Ep,"l-amb","amb")+D.pt(Bp,"B′",P.Ap,"p-fix")+D.pt(E,"E",P.B,"p-ok","t-ok")+D.pt(Ep,"E′",Bp,"p-ok","t-ok");
     if(k===0)s+=D.txt(V(16,26),"BE = CD = B′E′","t-amb t-up");
     if(k>=1)s+=D.vec(P.B,Bp,"l-red","red")+D.vec(E,Ep,"l-red","red");
     if(k>=2)s+=D.vec(P.A,P.Ap,"l-red","red");
     if(k>=4)s+=D.vec(P.A,E,"l-ok","ok")+D.vec(P.Ap,Ep,"l-ok","ok");
     return s;},
   info:(P,S)=>{const k=S.step;const t=["Les deux flèches orange depuis B et B′ représentent v.","Rem 3.2.5 : BE = B′E′ ⇔ BB′ = EE′ (rouges).","Rem 3.2.5 : AB = A′B′ ⇔ AA′ = BB′.","Transitivité : AA′ = BB′ = EE′.","Rem 3.2.5 : AA′ = EE′ ⇔ AE = A′E′ (vertes)."][k];return R.v(t,"info");},
   hint:"Déplace A, B, A′, C ou D."}),
 steps:[
  {w:`${vc("BE")} = ${vc("CD")} = ${vc("C′D′")} = ${vc("B′E′")}, donc ${vc("BE")} = ${vc("B′E′")}.`,why:"Transitivité de l'équipollence (Prop 3.2.2)."},
  {w:`Par la Remarque 3.2.5, ${vc("BB′")} = ${vc("EE′")}.`,why:"BE = B′E′ ⇔ BB′ = EE′ : les deux disent que BEE′B′ est un parallélogramme."},
  {w:`De même, ${vc("AB")} = ${vc("A′B′")} donne ${vc("AA′")} = ${vc("BB′")}.`,why:"Remarque 3.2.5 appliquée au couple (A, B)."},
  {w:`Par transitivité, ${vc("AA′")} = ${vc("EE′")}.`,why:"AA′ = BB′ et BB′ = EE′."},
  {w:`Encore par la Remarque 3.2.5, ${vc("AE")} = ${vc("A′E′")}. Le vecteur somme ne dépend donc pas des représentants choisis.`,why:"AA′ = EE′ ⇔ AE = A′E′."}],
 redac:`<p>Supposons avoir différents représentants : ${vc("AB")} = ${vc("A′B′")} = ${vc("u")} et ${vc("CD")} = ${vc("C′D′")} = ${vc("v")}. Soient E et E′ les points tels que ${vc("BE")} = ${vc("CD")} et ${vc("B′E′")} = ${vc("C′D′")}. Alors ${vc("BE")} = ${vc("B′E′")}, donc ${vc("BB′")} = ${vc("EE′")}. On a aussi ${vc("AB")} = ${vc("A′B′")}, donc ${vc("AA′")} = ${vc("BB′")}. On en déduit ${vc("AA′")} = ${vc("EE′")}, d'où ${vc("AE")} = ${vc("A′E′")} : le vecteur somme ne dépend pas des choix des représentants.</p>`,
 rel:["somme-vecteurs","equipollence","vecteur"]});

/* =============== Chapitre 4 : résultats de TD =============== */
const medA=(p,P)=>{const I=mid(P.B,P.C),J=add(I,perp(sub(P.C,P.B)));return snapLine(p,I,J,9);};

push4({id:"td-isocele",type:"td",ref:"TD 1.7",t:"Le triangle isocèle",short:"Triangle isocèle (TD 1.7)",
 plain:`Isocèle en A veut dire AB = AC. Conséquences à connaître, utilisables sans preuve : ${hl("les angles en B et en C sont égaux")}, et ${hl("la bissectrice, la médiane et la hauteur issues de A sont la même droite")}, perpendiculaire à (BC).`,
 fig:()=>({w:560,h:330,P:{A:[300,60],B:[130,270],C:[440,260]},con:{A:medA},
   draw:(P)=>{const I=mid(P.B,P.C),iso=Math.abs(d(P.A,P.B)-d(P.A,P.C))<0.01;let s=tri(P.A,P.B,P.C,"l-ink","f-ink")+D.marks(P.C,P.B,P.A,26,1,iso?"l-ok":"l-thin")+D.marks(P.A,P.C,P.B,26,1,iso?"l-ok":"l-thin")+D.pt(I,"I",P.A,"p-fix");
     if(iso)s+=D.seg(P.A,I,"l-cob")+D.right(P.C,I,P.A,11,"l-cob")+D.ticks(P.A,P.B,1,"l-ok")+D.ticks(P.A,P.C,1,"l-ok")+D.ticks(P.B,I,2,"l-cob")+D.ticks(I,P.C,2,"l-cob");
     else s+=D.seg(P.A,I,"l-cons");
     return s;},
   info:(P)=>{const iso=Math.abs(d(P.A,P.B)-d(P.A,P.C))<0.01;return R.m([["AB",fl(P.A,P.B)],["AC",fl(P.A,P.C)],["|B̂|",fa(absang(P.A,P.B,P.C))],["|Ĉ|",fa(absang(P.A,P.C,P.B))]])+R.v(iso?"Isocèle en A : |B̂| = |Ĉ|, et (AI) est à la fois médiane, bissectrice et hauteur.":"Pas isocèle en A : les angles en B et C diffèrent.",iso?"ok":"");},
   goal:{text:"rends le triangle isocèle en A.",ok:(P)=>Math.abs(d(P.A,P.B)-d(P.A,P.C))<0.01,win:"A est sur la médiatrice de [BC] : AB = AC (TD 1.6)."}}),
 formal:`<p><b>TD 1.7.</b> (1) Si ABC est isocèle en A : (a) |B̂| = |Ĉ| ; (b) la bissectrice et la médiane issues de A sont confondues ; (c) elles sont perpendiculaires à (BC) ; (d) si N ∈ [BC] n'est pas le milieu, ABN et ACN ne sont pas isométriques ; (e) deux côtés et un angle égaux ne suffisent pas.</p><p>(2) Réciproques : si la médiane issue de A est perpendiculaire à (BC), ou si |B̂| = |Ĉ|, alors ABC est isocèle en A.</p>`,
 use:`<p>Pour montrer AB = AC : montre |B̂| = |Ĉ|, ou que A est sur la médiatrice de [BC] (TD 1.6), ou que les hauteurs issues de B et C sont égales (TD 1.11). Les preuves (CAC et CCC) sont sur la page TD 1.</p>`,
 trap:`« Isocèle » tout court est ambigu : précise toujours le sommet, « isocèle en A ».`,
 q:"ABC est isocèle en A. Que peux-tu dire, sans preuve, de la médiane issue de A ?",a:"C'est aussi la bissectrice et la hauteur issues de A : elle est perpendiculaire à (BC) (TD 1.7).",
 rel:["mediatrice","axiome-5","td-hauteurs","td"]});

push4({id:"td-hauteurs",type:"td",ref:"TD 1.11",t:"Isocèle ⇔ deux hauteurs de même longueur",short:"Hauteurs égales (TD 1.11)",cc:"Tombé en 2025 · 2 pts",
 plain:`L'aire d'un triangle s'écrit de trois façons, une par hauteur. En égalant ${hl("½ AC × BH<sub>B</sub> = ½ AB × CH<sub>C</sub>")}, on voit que AB = AC exactement quand les deux hauteurs ont la même longueur.`,
 fig:()=>({w:560,h:330,P:{A:[290,60],B:[110,270],C:[450,260]},con:{A:medA},
   draw:(P)=>{const HB=proj(P.B,P.A,P.C),HC=proj(P.C,P.A,P.B);return D.line(P.A,P.C,"l-cons")+D.line(P.A,P.B,"l-cons")+tri(P.A,P.B,P.C,"l-ink","f-ink")+D.seg(P.B,HB,"l-cob")+D.seg(P.C,HC,"l-amb")+D.right(P.A,HB,P.B,9,"l-cob")+D.right(P.A,HC,P.C,9,"l-amb")+D.pt(HB,"H<tspan font-size='11' dy='4'>B</tspan>",P.B,"p-cob","t-cob")+D.pt(HC,"H<tspan font-size='11' dy='4'>C</tspan>",P.C,"p-cob","t-amb");},
   info:(P)=>{const HB=proj(P.B,P.A,P.C),HC=proj(P.C,P.A,P.B),bh=d(P.B,HB),ch=d(P.C,HC);return R.m([["BH<sub>B</sub>",fr(bh)],["CH<sub>C</sub>",fr(ch)],["½ AC × BH<sub>B</sub>",fr(d(P.A,P.C)*bh/2)],["½ AB × CH<sub>C</sub>",fr(d(P.A,P.B)*ch/2)],["AB",fl(P.A,P.B)],["AC",fl(P.A,P.C)]])+R.v("Les deux produits sont toujours égaux : c'est l'aire de ABC. Donc BH<sub>B</sub> = CH<sub>C</sub> ⇔ AC = AB.","info");},
   goal:{text:"rends les deux hauteurs égales.",ok:(P)=>{const HB=proj(P.B,P.A,P.C),HC=proj(P.C,P.A,P.B);return Math.abs(d(P.B,HB)-d(P.C,HC))<0.01;},win:"et le triangle est isocèle en A : AB = AC."}}),
 formal:`<p><b>TD 1.11.</b> ABC est isocèle en A si et seulement si les hauteurs issues de B et de C ont même longueur.</p><p>Preuve : par la Prop 2.4.1, AC × BH<sub>B</sub> = AB × CH<sub>C</sub> = 2𝒜(ABC), et toutes ces longueurs sont non nulles si ABC est non dégénéré.</p>`,
 use:`<p>C'est exactement le CC1 2025 Ex. 2 (2 points). Rédige : « La formule de l'aire (Prop 2.4.1) donne 𝒜(ABC) = ½ BH<sub>B</sub> × AC = ½ CH<sub>C</sub> × AB. Comme BH<sub>B</sub> = CH<sub>C</sub> ≠ 0, on obtient AC = AB. »</p>`,
 trap:`Justifie que la hauteur est non nulle avant de diviser : c'est parce que le triangle est non dégénéré.`,
 q:"ABC non dégénéré avec BH_B = CH_C. Que peux-tu conclure, et comment ?",a:"ABC est isocèle en A : l'aire s'écrit ½ AC × BH_B = ½ AB × CH_C, et on simplifie par BH_B = CH_C ≠ 0.",
 rel:["hauteur","demo-2-4-1","td-isocele"]});

push4({id:"td-equilateral",type:"td",ref:"TD 1.13",t:"Le triangle équilatéral",short:"Triangle équilatéral (TD 1.13)",
 plain:`Équilatéral : trois côtés égaux. C'est pareil que ${hl("trois angles égaux, chacun π/3")}. Et si on avance de la même longueur sur chaque côté, le nouveau triangle est encore équilatéral.`,
 fig:()=>({w:560,h:330,P:{A:[280,50],B:[120,290],C:[440,290]},S:{t:0.3,klm:false},
   sliders:[{k:"t",label:"Avance sur chaque côté :",min:0.05,max:0.95,step:0.01,fmt:v=>Math.round(v*100)+" %"}],
   toggles:[{k:"klm",label:"Montrer KLM (question 2c)"}],
   buttons:[{label:"Rendre équilatéral",act:(P)=>{P.A=rot(P.C,P.B,side(P.A,P.B,P.C)>0?-PI/3:PI/3);}}],
   draw:(P,S)=>{const A2=lerp(P.A,P.B,S.t),B2=lerp(P.B,P.C,S.t),C2=lerp(P.C,P.A,S.t);let s=tri(P.A,P.B,P.C,"l-ink","f-ink")+tri(A2,B2,C2,"l-cob","f-cob")+D.pt(A2,"A′",P.C,"p-cob","t-cob")+D.pt(B2,"B′",P.A,"p-cob","t-cob")+D.pt(C2,"C′",P.B,"p-cob","t-cob");
     if(S.klm){const K=inter(P.C,A2,P.A,B2),L=inter(P.A,B2,P.B,C2),M=inter(P.B,C2,P.C,A2);s+=D.seg(P.C,A2,"l-thin")+D.seg(P.A,B2,"l-thin")+D.seg(P.B,C2,"l-thin");if(K&&L&&M)s+=tri(K,L,M,"l-amb","f-amb");}
     return s;},
   info:(P,S)=>{const A2=lerp(P.A,P.B,S.t),B2=lerp(P.B,P.C,S.t),C2=lerp(P.C,P.A,S.t);const eq=Math.abs(d(P.A,P.B)-d(P.B,P.C))<0.02&&Math.abs(d(P.A,P.B)-d(P.A,P.C))<0.02;
     return R.m([["|Â|",fa(absang(P.B,P.A,P.C))],["|B̂|",fa(absang(P.A,P.B,P.C))],["|Ĉ|",fa(absang(P.A,P.C,P.B))],["A′B′",fl(A2,B2)],["B′C′",fl(B2,C2)],["C′A′",fl(C2,A2)]])+R.v(eq?"ABC est équilatéral : chaque angle vaut π/3, et A′B′C′ aussi est équilatéral.":"ABC n'est pas équilatéral : A′B′C′ non plus, en général. Clique sur « Rendre équilatéral ».",eq?"ok":"");}}),
 formal:`<p><b>TD 1.13.</b> (1) ABC est équilatéral ⇔ |Â| = |B̂| = |Ĉ|. (2) Si ABC est équilatéral : (a) |Â| = π/3 ; (b) si A′ ∈ [AB], B′ ∈ [BC], C′ ∈ [CA] avec AA′ = BB′ = CC′, alors A′B′C′ est équilatéral ; (c) le triangle KLM formé par (CA′), (AB′), (BC′) est équilatéral.</p>`,
 use:`<p>(1) se prouve avec le TD 1.7 deux fois. (2b) : les triangles AA′C′, BB′A′, CC′B′ sont isométriques (CAC). Les preuves détaillées sont sur la page TD 1.</p>`,
 trap:`Pour (2b), vérifie que l'angle de CAC est bien entre les deux côtés : en A, entre [AA′) et [AC′).`,
 q:"Combien vaut chaque angle d'un triangle équilatéral ?",a:"π/3 : les trois angles sont égaux (TD 1.13 (1)) et leur somme vaut π.",
 rel:["td-isocele","somme-angles","axiome-5","td"]});

push4({id:"td-paralleles",type:"td",ref:"TD 1.3",t:"Parallèles à une même droite",short:"Parallèles en chaîne (TD 1.3)",
 plain:`Si Δ₁ et Δ₃ sont toutes les deux parallèles à Δ₂, alors ${hl("elles sont parallèles entre elles")} (ou confondues). Raison : si elles avaient un point commun, ce seraient deux parallèles à Δ₂ passant par ce point.`,
 fig:()=>({w:560,h:320,P:{A:[80,170],B:[480,140],P1:[200,70],P3:[320,260]},labels:{P1:"M₁",P3:"M₃"},
   con:{P3:(p,P)=>{const Q=add(P.P1,sub(P.B,P.A));return snapLine(p,P.P1,Q,9);}},
   draw:(P)=>{const u=sub(P.B,P.A),same=dpx(P.P3,proj(P.P3,P.P1,add(P.P1,u)))<0.5;return D.line(P.A,P.B,"l-ink")+D.line(P.P1,add(P.P1,u),"l-cob")+D.line(P.P3,add(P.P3,u),same?"l-amb-d":"l-amb")+D.txt(add(P.A,V(-10,22)),"Δ₂","t-mut")+D.txt(add(P.P1,V(-60,-10)),"Δ₁","t-cob")+D.txt(add(P.P3,V(-60,24)),"Δ₃","t-amb");},
   info:(P)=>{const u=sub(P.B,P.A),same=dpx(P.P3,proj(P.P3,P.P1,add(P.P1,u)))<0.5;return R.v(same?"Δ₁ et Δ₃ passent par le même point et sont parallèles à Δ₂ : elles sont confondues (axiome II).":"Δ₁ et Δ₃ sont parallèles à Δ₂, et elles ne se coupent pas.",same?"ok":"info");},
   goal:{text:"essaie de faire se croiser Δ₁ et Δ₃ (déplace M₃).",ok:(P)=>{const u=sub(P.B,P.A);return dpx(P.P3,proj(P.P3,P.P1,add(P.P1,u)))<0.5;},win:"impossible sans qu'elles se confondent : c'est l'unicité de l'axiome II."}}),
 formal:`<p><b>TD 1.3.</b> Si Δ₁ // Δ₂ et Δ₂ // Δ₃, alors Δ₁ et Δ₃ sont parallèles ou confondues.</p><p>Preuve : si Δ₁ ∩ Δ₃ contient un point M, Δ₁ et Δ₃ sont deux parallèles à Δ₂ passant par M, donc Δ₁ = Δ₃ (axiome II).</p>`,
 use:`<p>Pour enchaîner des parallélismes dans un exercice, ou dans la preuve de la transitivité de l'équipollence.</p>`,
 trap:`Dans ce cours, « parallèles » inclut « confondues » : la conclusion est simplement Δ₁ // Δ₃.`,
 q:"Δ₁ // Δ₂ et Δ₂ // Δ₃. Que dire de Δ₁ et Δ₃ ?",a:"Elles sont parallèles (éventuellement confondues), par l'unicité de l'axiome II (TD 1.3).",
 rel:["axiome-2","deux-droites"]});

push4({id:"td-ccc-cac",type:"td",ref:"TD 1.12",t:"CCC ⇔ CAC, même pour des triangles aplatis",short:"CCC et CAC dégénérés (TD 1.12)",
 plain:`Pour un triangle aplati (dégénéré), l'angle en A vaut ${hl("0 ou π")}, et il se lit sur les longueurs : BC = AB + AC (A entre B et C) ou BC = |AB − AC|. Donc CCC et CAC restent équivalents. Pas ACA.`,
 fig:()=>({w:560,h:260,P:{A:[260,140],B:[100,160],C:[440,120]},
   con:{C:(p,P)=>onLine(p,P.A,P.B)},
   draw:(P)=>D.line(P.A,P.B,"l-cons")+D.seg(P.B,P.C,"l-ink")+D.dot(P.A,"p-cob",5),
   info:(P)=>{const a=absang(P.B,P.A,P.C),between=param(P.A,P.B,P.C)>0&&param(P.A,P.B,P.C)<1;return R.m([["|Â|",fa(a)],["AB",fl(P.A,P.B)],["AC",fl(P.A,P.C)],["BC",fl(P.B,P.C)],[between?"AB + AC":"|AB − AC|",fr(between?d(P.A,P.B)+d(P.A,P.C):Math.abs(d(P.A,P.B)-d(P.A,P.C)))]])+R.v(between?"A est entre B et C : |Â| = π et BC = AB + AC.":"A n'est pas entre B et C : |Â| = 0 et BC = |AB − AC|.","info");},
   hint:"C glisse sur la droite (AB)."}),
 formal:`<p><b>TD 1.12.</b> Pour deux triangles ABC et A′B′C′ quelconques (éventuellement dégénérés), (CCC) et (CAC) sont équivalents.</p><p class="ref">Le poly le signale juste après l'axiome V : c'est faux pour (ACA).</p>`,
 use:`<p>Rarement utile en exercice. Retiens surtout la remarque : sans « non dégénéré », seul ACA pose problème.</p>`,
 trap:`L'axiome V suppose les triangles non dégénérés. Ce TD l'étend à CCC et CAC seulement.`,
 q:"Pour des triangles dégénérés, quel cas d'isométrie ne marche plus ?",a:"(ACA). (CCC) et (CAC) restent équivalents (TD 1.12).",
 rel:["axiome-5","triangles"]});

})();

</script>
<script>
/* Entraînement : quiz, feuille de TD 1, annales. Contenu repris du premier site et des corrigés du prof. */
(function(){
const an=s=>`<span class="ang">${s}</span>`, hl=s=>`<span class="hl">${s}</span>`;
const QUIZ=[
 {q:"Exemple Moodle. ABC et A'B'C' non dégénérés. Quel est l'intrus parmi ces propriétés ?",o:["AB = A'B', BC = B'C', CA = C'A'","AB = A'B', BC = B'C', |Â| = |Â'|","AB = A'B', AC = A'C', |Â| = |Â'|","AB = A'B', |Â| = |Â'|, |B̂| = |B̂'|"],a:1,e:"En CAC l'angle doit être entre les deux côtés. Â est entre [AB] et [AC], pas entre [AB] et [BC]. Les trois autres sont CCC, CAC, ACA."},
 {q:"Combien vaut |Â| + |B̂| + |Ĉ| dans un triangle ABC ?",o:["π/2","π","2π","Ça dépend du triangle"],a:1,e:"Prop 2.4.2, démontrée avec la parallèle à (BC) passant par A et les angles alternes-internes."},
 {q:"Quelle est la définition d'un parallélogramme ABCD dans ce cours ?",o:["Côtés opposés parallèles","Côtés opposés de même longueur","Diagonales [AC] et [BD] de même milieu","Angles opposés égaux"],a:2,e:"Déf 3.1.1. Les autres caractérisations sont des propositions (3.1.2, 3.1.3) ou un exercice."},
 {q:"Pour une symétrie centrale s et une droite Δ, que vaut s(Δ) ?",o:["Une droite perpendiculaire à Δ","Une droite parallèle ou confondue avec Δ","Toujours Δ elle-même","Une demi-droite"],a:1,e:"Thm 2.2.3 (2). s(Δ) = Δ exactement quand le centre O est sur Δ."},
 {q:"A ∈ Δ et λ > 0. Combien de points M de Δ vérifient AM = λ ?",o:["Aucun","Exactement un","Exactement deux","Une infinité"],a:2,e:"Axiome III (e) : un point sur chacune des deux demi-droites d'origine A."},
 {q:"Pourquoi la réciproque de Thalès suppose M ∈ ]AB) et N ∈ ]AC), et pas M ∈ (AB), N ∈ (AC) ?",o:["Pour que le triangle soit non dégénéré","Sinon M et N peuvent être de part et d'autre de A, et (MN) n'est pas parallèle à (BC)","Pour pouvoir utiliser les aires","Ce n'est pas nécessaire"],a:1,e:"Avec AM/AB = AN/AC mais M et N de côtés différents de A, les droites ne sont pas parallèles. La preuve utilise N, N' sur la même demi-droite [AC)."},
 {q:"Sur quel outil repose la preuve de Thalès du poly ?",o:["Les vecteurs","Les aires de triangles","Pythagore","Les homothéties"],a:1,e:"Rapports d'aires de triangles de même hauteur, et 𝒜(BMN) = 𝒜(CMN)."},
 {q:"O ∈ ]AB[, C ∉ (AB). Quel angle font les bissectrices de {[OA), [OC)} et {[OB), [OC)} ?",o:["π/4","π/3","π/2","Ça dépend de C"],a:2,e:"Les deux demi-angles font π au total, donc l'angle entre les bissectrices vaut π/2. C'est l'exercice 1 du CC1 2025."},
 {q:"(A, B) ~ (A', B') signifie que … est un parallélogramme.",o:["ABA'B'","ABB'A'","AA'BB'","AB'BA'"],a:1,e:"Déf 3.2.1 : ABB'A'. Ses diagonales sont [AB'] et [BA']."},
 {q:"Quand a-t-on |AOB| = |AOC| + |COB| ?",o:["Toujours","Quand [AB] ∩ [OC) est non vide","Quand C est sur le cercle de centre O","Quand les angles sont aigus"],a:1,e:"Remarque du §1.3 : il faut que [OC) soit entre [OA) et [OB)."},
 {q:"Dans un triangle non dégénéré, BH_B = CH_C (hauteurs issues de B et C). On en déduit :",o:["AB = BC","AB = AC","Le triangle est rectangle","Rien"],a:1,e:"𝒜 = ½·AC·BH_B = ½·AB·CH_C, donc AC = AB. Exercice 2 du CC1 2025 et TD 1.11."},
 {q:"Lequel de ces énoncés est un axiome, et non une proposition ?",o:["Par un point passe une unique perpendiculaire à une droite","Par un point passe une unique parallèle à une droite","La somme des angles d'un triangle vaut π","L'aire d'un segment est nulle"],a:1,e:"Axiome II. La perpendiculaire unique est le Cor 2.3.2, démontré avec les angles alternes-internes."},
 {q:"Pourquoi la Prop 3.2.8 est-elle nécessaire ?",o:["Pour montrer que u + v = v + u","Parce que la définition de u + v passe par des représentants choisis, et il faut vérifier que le résultat n'en dépend pas","Pour montrer que le vecteur nul existe","Elle ne sert à rien"],a:1,e:"On définit u + v avec AB = u et CD = v. Sans 3.2.8, deux choix de représentants pourraient donner deux sommes différentes."},
 {q:"Quel énoncé du théorème de Thalès le corrigé 2024 accepte-t-il ?",o:["M ∈ [AB], N ∈ [AC] et (MN) // (BC) ⇒ AM/AB = AN/AC = MN/BC","M ∈ (AB), N ∈ (AC) et (MN) // (BC) ⇒ AM/AB = AN/AC = MN/BC","M ∈ (AB), N ∈ (AC) et (MN) // (BC) ⇒ [AM]/[AB] = [AN]/[AC]","M ∈ (AB), N ∈ (AC) et AM/AB = AN/AC ⇒ (MN) // (BC)"],a:1,e:"Avec M ∈ [AB], l'énoncé est « incomplet ». Écrire [AM]/[AB] est une « faute grave » : on ne divise pas des segments. La dernière proposition est une réciproque fausse sans les demi-droites."},
 {q:"Question de cours : « Démontrer que (MN) // (BC) » (réciproque de Thalès). Que faut-il écrire ?",o:["« D'après la réciproque de Thalès, (MN) // (BC). »","La preuve : la parallèle à (BC) par M coupe [AC) en N', Thalès donne AN' = AN, donc N' = N","Une figure soignée suffit","Un calcul avec des vecteurs"],a:1,e:"Corrigé 2024 : « Il faut donner la preuve, pas seulement utiliser la réciproque du théorème de Thalès ! »"},
 {q:"L'énoncé parle d'un quadrilatère convexe ABCD quelconque. Quelle figure faire ?",o:["Un carré, c'est plus simple","Un rectangle","Un quadrilatère sans angle droit ni côtés égaux","Pas de figure"],a:2,e:"Corrigé 2024 : dessiner un rectangle fait apparaître des angles droits qui n'existent pas a priori. C'est compté comme une faute."},
 {q:"ABC est isocèle en A et I est le milieu de [BC]. Que peut-on dire de (AI), sans preuve ?",o:["Rien de particulier","(AI) // (BC)","(AI) est la bissectrice issue de A et elle est perpendiculaire à (BC)","(AI) = (AB)"],a:2,e:"TD 1.7 (1)(b)(c). Les résultats de TD sont utilisables sans preuve (consigne Moodle)."}
];
const QLINK=['axiome-5','somme-angles','parallelogramme','thm-2-2-3','axiome-3','demo-2-5-2','demo-2-5-1','bissectrice','equipollence','angle-non-oriente','td-hauteurs','axiome-2','demo-3-2-8','thales','demo-2-5-2',null,'td-isocele'];
QUIZ.forEach((q,i)=>{if(QLINK[i])q.link=QLINK[i];});
const TDX=[
 {id:"1.1",s:2,t:"Points alignés et droites",
  en:"A, B deux points, C distinct de A et de B. Montrer que A, B, C sont alignés si et seulement si (AC) = (BC).",
  idea:`${hl("Axiome I")} : une droite qui contient deux points distincts est la droite qui les joint.`,
  hint:"Deux sens. Pour ⇒, prends une droite Δ qui contient les trois points et applique l'axiome I deux fois.",
  sol:`<ol><li>(⇒) Supposons A, B, C alignés : une droite Δ les contient. Δ contient A et C, qui sont distincts, donc Δ = (AC) (axiome I). De même, Δ contient B et C, donc Δ = (BC). Ainsi (AC) = (BC).</li><li>(⇐) Supposons (AC) = (BC). Cette droite contient A, B et C, qui sont donc alignés.</li></ol>`},
 {id:"1.2",s:2,note:"définition tombée en 2025",t:"Définition et propriétés du segment",
  en:"(1) Rappeler la définition de [AB]. (2) Montrer que [AB] = [BA]. (3) Montrer que si M ∈ [AB], alors [AM] ⊂ [AB].",
  idea:`Tout se ramène à ${hl("AM + MB = AB")} et à l'${hl("inégalité triangulaire")}, utilisée dans les deux sens.`,
  hint:"(3) Soit N ∈ [AM]. Montre AN + NB ≤ AB avec l'inégalité triangulaire ; l'autre inégalité est gratuite.",
  sol:`<ol><li>(1) [AB] est l'ensemble des points M tels que AM + MB = AB.</li><li>(2) M ∈ [AB] ⇔ AM + MB = AB ⇔ BM + MA = BA (axiome III b) ⇔ M ∈ [BA].</li><li>(3) Soit N ∈ [AM] : AN + NM = AM. Comme M ∈ [AB], AM + MB = AB, donc AN + NM + MB = AB.</li><li>Par l'inégalité triangulaire, NB ≤ NM + MB, donc AN + NB ≤ AB. Et AB ≤ AN + NB, encore par l'inégalité triangulaire.</li><li>Donc AB = AN + NB, c'est-à-dire N ∈ [AB]. Ainsi [AM] ⊂ [AB].</li></ol>`},
 {id:"1.3",s:2,t:"Parallèles en chaîne",
  en:"Δ₁ // Δ₂ et Δ₂ // Δ₃. Montrer que Δ₁ et Δ₃ sont parallèles ou confondues.",
  idea:`L'${hl("unicité")} dans l'axiome II.`,
  hint:"Distingue Δ₁ ∩ Δ₃ vide ou non vide.",
  sol:`<ol><li>Si Δ₁ ∩ Δ₃ = ∅, elles sont parallèles.</li><li>Sinon, soit M ∈ Δ₁ ∩ Δ₃. Δ₁ et Δ₃ sont deux droites parallèles à Δ₂ qui passent par M. Par l'unicité de l'axiome II, Δ₁ = Δ₃.</li></ol>`},
 {id:"1.4",s:2,t:"Angles possibles",
  en:`(1) Si |${an("AOB")}| = π/8 et |${an("BOC")}| = π/6, quelles sont les possibilités pour ${an("AOC")} ? (2) Si |${an("AOB")}| = 5π/6 et |${an("AOC")}| = 5π/6, quelles sont les possibilités pour ${an("BOC")} ?`,
  idea:`Un angle non orienté de mesure x correspond à ${hl("deux angles orientés ±x")}. On combine les signes avec Chasles.`,
  hint:"(1) Écris AOB = ±π/8, BOC = ±π/6 et additionne. (2) BOC = BOA + AOC = −AOB + AOC.",
  sol:`<ol><li>(1) ${an("AOB")} = ±π/8 et ${an("BOC")} = ±π/6. Par Chasles, ${an("AOC")} = ${an("AOB")} + ${an("BOC")} vaut 7π/24, π/24, −π/24 ou −7π/24. Donc |${an("AOC")}| = 7π/24 ou π/24.</li><li>(2) ${an("BOC")} = ${an("BOA")} + ${an("AOC")} = −${an("AOB")} + ${an("AOC")}, avec ${an("AOB")}, ${an("AOC")} ∈ {5π/6, −5π/6}. On obtient 0, 5π/3 ou −5π/3, c'est-à-dire 0, −π/3 ou π/3 [2π].</li><li>Donc soit [OB) = [OC), soit |${an("BOC")}| = π/3.</li></ol>`},
 {id:"1.5",s:3,note:"proche du CC1 2025 Ex. 1",t:"Bissectrices de deux angles emboîtés",
  en:`[OA), [OB), [OC), [OD) issues de O, avec 0 ≤ ${an("AOB")} ≤ ${an("AOC")} ≤ ${an("AOD")} &lt; π et ${an("AOB")} = ${an("COD")}. Quel angle forment les bissectrices de {[OA),[OD)} et de {[OB),[OC)} ?`,
  idea:`Tout mesurer ${hl("depuis [OA)")} avec Chasles : les deux bissectrices font le même angle avec [OA).`,
  hint:"Pose a = AOB = COD et c = AOC. Calcule AOD et BOC, puis l'angle entre [OA) et chaque bissectrice.",
  sol:`<ol><li>Soit a = ${an("AOB")} = ${an("COD")} et c = ${an("AOC")}. Chasles : ${an("AOD")} = ${an("AOC")} + ${an("COD")} = a + c, et ${an("BOC")} = ${an("BOA")} + ${an("AOC")} = c − a.</li><li>Soit [OM) la bissectrice de {[OA),[OD)}. Les angles orientés ${an("AOM")} et ${an("MOD")} sont égaux (§1.3), de somme a + c, et |${an("AOM")}| = |${an("AOD")}|/2 &lt; π/2. Donc ${an("AOM")} = (a + c)/2.</li><li>Soit [ON) la bissectrice de {[OB),[OC)}. De même ${an("BON")} = (c − a)/2, donc ${an("AON")} = ${an("AOB")} + ${an("BON")} = a + (c − a)/2 = (a + c)/2.</li><li>${an("AOM")} = ${an("AON")}, donc [OM) = [ON) (unicité, axiome IV e) : les deux bissectrices sont confondues, l'angle est nul.</li></ol>`},
 {id:"1.6",s:3,note:"résultat à connaître",t:"Médiatrice : M ∈ Δ ⇔ MA = MB",
  en:"A ≠ B, I le milieu de [AB], Δ la médiatrice de [AB]. Montrer que M ∈ Δ si et seulement si AM = MB.",
  idea:`Les triangles ${hl("AIM et BIM")} : CAC dans un sens, CCC dans l'autre.`,
  hint:"⇒ : CAC en I, avec les angles droits. ⇐ : traite à part le cas M ∈ (AB). Sinon, CCC donne deux angles égaux en I, de somme π.",
  sol:`<ol><li>(⇒) Soit M ∈ Δ. Si M = I, AM = MB. Sinon (MI) = Δ ⊥ (AB), donc |${an("AIM")}| = |${an("BIM")}| = π/2. Dans AIM et BIM : IA = IB, IM est commun, et les angles en I sont égaux. Par CAC, ils sont isométriques, donc AM = BM.</li><li>(⇐) Supposons AM = BM. Si M ∈ (AB), A, M, B sont alignés avec MA = MB : par l'axiome III (d), M ∈ [AB] et M est le milieu, donc M = I ∈ Δ.</li><li>Sinon, AIM et BIM sont non dégénérés avec IA = IB, AM = BM et IM commun. Par CCC, |${an("AIM")}| = |${an("BIM")}|.</li><li>I ∈ ]AB[, donc [IA) et [IB) sont opposées et |${an("AIM")}| + |${an("MIB")}| = π. Donc |${an("AIM")}| = π/2 et (IM) ⊥ (AB).</li><li>(IM) est la perpendiculaire à (AB) passant par I, donc (IM) = Δ (Cor 2.3.2) et M ∈ Δ.</li></ol>`},
 {id:"1.7",s:3,note:"résultat à connaître",t:"Triangle isocèle",
  en:"(1) ABC isocèle en A (AB = AC). (a) Montrer |B̂| = |Ĉ|. (b) La bissectrice et la médiane issues de A sont confondues. (c) Elles sont perpendiculaires à (BC). (d) Si N ∈ [BC] n'est pas le milieu, ABN et ACN ne sont pas isométriques. (e) Deux côtés et un angle égaux suffisent-ils ? (2) ABC quelconque. (a) Si la médiane issue de A est perpendiculaire à (BC), ABC est isocèle en A. (b) Si |B̂| = |Ĉ|, ABC est isocèle en A.",
  idea:`Comparer le triangle ${hl("à lui-même retourné")} : ABC et ACB, ou ses deux moitiés ABI et ACI.`,
  hint:"(1)(a) CAC entre ABC et ACB. (b)(c) CCC entre ABI et ACI, avec I le milieu de [BC]. (2)(b) ACA entre ABC et ACB.",
  sol:`<ol><li>(1)(a) ABC et ACB : AB = AC, AC = AB, et l'angle en A est le même. Par CAC, ils sont isométriques, donc |${an("ABC")}| = |${an("ACB")}|.</li><li>(b) Soit I le milieu de [BC]. ABI et ACI : AB = AC, BI = CI, AI commun. Par CCC, |${an("BAI")}| = |${an("CAI")}|. Comme I ∈ [BC] ∩ [AI), [AI) est entre [AB) et [AC), donc |${an("BAI")}| = |${an("BAC")}|/2 : [AI) est la bissectrice, et (AI) est aussi la médiane.</li><li>(c) Le même CCC donne |${an("AIB")}| = |${an("AIC")}|. Ces deux angles ont pour somme π ([IB) et [IC) sont opposées), donc ils valent π/2.</li><li>(d) Si ABN et ACN étaient isométriques, on aurait BN = CN, et N serait le milieu de [BC]. Contradiction.</li><li>(e) Non. ABN et ACN ont AB = AC, AN commun et |${an("ABN")}| = |${an("ACN")}| par (a), mais ils ne sont pas isométriques par (d). L'angle n'est pas entre les deux côtés.</li><li>(2)(a) Soit I le milieu de [BC], avec (AI) ⊥ (BC). ABI et ACI : BI = CI, AI commun, angles droits en I. Par CAC, AB = AC.</li><li>(2)(b) ABC et ACB : BC = CB, |B̂| = |Ĉ| et |Ĉ| = |B̂|. Par ACA, ils sont isométriques, donc AB = AC.</li></ol>`},
 {id:"1.8",s:2,t:"Une parallèle reste d'un seul côté",
  en:"Δ et Δ' sont parallèles et distinctes. Montrer que Δ' est incluse dans un seul des deux demi-plans définis par Δ.",
  idea:`Deux points de Δ' sont joints par un segment ${hl("inclus dans Δ'")}, qui ne peut donc pas couper Δ.`,
  hint:"Prends M, N ∈ Δ' et regarde le segment [MN].",
  sol:`<ol><li>Δ ∩ Δ' = ∅ (parallèles distinctes), donc aucun point de Δ' n'est sur Δ.</li><li>Soient M, N ∈ Δ'. Le segment [MN] est inclus dans (MN) = Δ', donc il ne rencontre pas Δ : M et N sont du même côté de Δ.</li><li>Tous les points de Δ' sont donc dans le même demi-plan.</li></ol>`},
 {id:"1.9",s:1,note:"corrigé du prof sur Moodle",t:"Propriétés des segments (Prop 1.2.3)",
  en:"(1) Il existe un unique O tel que AO = AB et OB = 2AB. (2) Si M ∈ [AB] : OB = OM + MB et OM = OA + AM. (3) Si M ∈ [AB] : [AB] = [AM] ∪ [MB] et [AM] ∩ [MB] = {M}. (4) Si M, M' ∈ [AB] : [MM'] ⊂ [AB].",
  idea:`Le point auxiliaire ${hl("O, symétrique de B par rapport à A")}, élimine le cas « A entre M et N ». Le prof, dans son corrigé : la probabilité d'avoir ça à l'examen est « nulle », mais « probabilité nulle ne signifie pas impossible ».`,
  hint:"(2) Encadre OB entre OM + MB et OA + AM + MB avec l'inégalité triangulaire.",
  sol:`<ol><li>(1) Sur (AB), l'axiome III (e) donne deux points à distance AB de A : B et un autre point O. Comme OA = AB, l'axiome III (d) donne OB = OA + AB = 2AB (les autres cas donnent OB = 0). Unicité : un tel point est aligné avec A et B (III d), donc c'est B ou O (III e), et ce n'est pas B.</li><li>(2) OB = OA + AB = OA + AM + MB ≥ OM + MB ≥ OB, par l'inégalité triangulaire deux fois. Tout est égal : OB = OM + MB et OA + AM = OM.</li><li>(3) ⊂ : si N ∈ [AM], AN + NM + MB = AB et NM + MB ≥ NB, d'où AB ≥ AN + NB ≥ AB, donc N ∈ [AB]. Même chose si N ∈ [MB].</li><li>⊃ : soit N ∈ [AB]. A, M, N sont alignés, donc l'un est entre les deux autres (III d). Si N ∈ [AM], c'est fini. Si M ∈ [AN], on trouve MN + NB = MB, donc N ∈ [MB]. Si A ∈ [MN], on utilise O et (2) pour montrer A = M ou A = N.</li><li>Intersection : si N ∈ [AM] ∩ [MB], en additionnant on trouve AN + NB + 2NM = AB = AN + NB, donc NM = 0 et N = M.</li><li>(4) A, M, M' sont alignés : on traite les trois cas avec (3).</li></ol>`},
 {id:"1.10",s:1,t:"Trois bissectrices",
  en:`[OA), [OB), [OC) avec O hors de [AB], [AC] et [BC]. [OM), [ON), [OP) sont les bissectrices de {[OA),[OB)}, {[OB),[OC)}, {[OC),[OA)}. Avec ${an("AOB")} = x et ${an("BOC")} = y, exprimer ${an("MON")}, ${an("NOP")} et ${an("POM")}.`,
  idea:`Chasles, et chaque bissectrice coupe ${hl("l'angle orienté en deux moitiés égales")}. Attention : ${an("COA")} ne vaut −(x + y) qu'à 2π près.`,
  hint:"MON = MOB + BON. Pour P, distingue |x + y| < π et |x + y| > π.",
  sol:`<ol><li>O ∉ [AB], donc x ≠ π et ${an("AOM")} = ${an("MOB")} = x/2 (mesures principales). De même ${an("BON")} = ${an("NOC")} = y/2.</li><li>${an("MON")} = ${an("MOB")} + ${an("BON")} = (x + y)/2.</li><li>Soit z la mesure principale de ${an("COA")} : z = −(x + y) si |x + y| &lt; π, et z = ±2π − (x + y) sinon. ${an("COP")} = ${an("POA")} = z/2.</li><li>Si |x + y| &lt; π : ${an("NOP")} = y/2 + z/2 = −x/2 et ${an("POM")} = z/2 + x/2 = −y/2.</li><li>Si |x + y| &gt; π : ${an("NOP")} = π − x/2 et ${an("POM")} = π − y/2 [2π].</li><li>Bonus : O hors des segments garantit qu'aucun angle ne vaut π. Sinon la bissectrice n'est pas définie (§1.3 demande |${an("AOB")}| ∈ [0, π[).</li></ol>`},
 {id:"1.11",s:3,note:"tombé en 2025 (2 pts)",t:"Isocèle ⇔ deux hauteurs égales",
  en:"Montrer que ABC est isocèle en A si et seulement si les hauteurs issues de B et de C ont même longueur.",
  idea:`Écrire ${hl("l'aire de ABC de deux façons")} (Prop 2.4.1).`,
  hint:"𝒜(ABC) = ½ AC × BH_B = ½ AB × CH_C. Les deux sens se lisent sur cette égalité.",
  sol:`<ol><li>Par la Prop 2.4.1, avec la hauteur issue de B puis celle issue de C : AC × BH<sub>B</sub> = AB × CH<sub>C</sub> = 2𝒜(ABC).</li><li>On suppose ABC non dégénéré : toutes ces longueurs sont non nulles.</li><li>(⇒) Si AB = AC, on divise par AB = AC : BH<sub>B</sub> = CH<sub>C</sub>.</li><li>(⇐) Si BH<sub>B</sub> = CH<sub>C</sub>, on divise par cette longueur : AC = AB.</li></ol>`},
 {id:"1.12",s:1,t:"CCC ⇔ CAC, même dégénérés",
  en:"Montrer que (CCC) et (CAC) sont équivalents pour deux triangles quelconques, éventuellement dégénérés.",
  idea:`Non dégénéré : axiome V. Dégénéré : ${hl("l'angle vaut 0 ou π")}, et l'axiome III (d) le relie aux longueurs.`,
  hint:"Si |Â| = π, A est entre B et C et BC = AB + AC. Si |Â| = 0, BC = |AB − AC|.",
  sol:`<ol><li>Si les deux triangles sont non dégénérés, c'est l'axiome V.</li><li>(CAC ⇒ CCC) Si ABC est dégénéré, |Â| vaut 0 ou π, et |Â'| aussi. Si |Â| = π, A est entre B et C et BC = AB + AC. Si |Â| = 0, B et C sont sur la même demi-droite issue de A et BC = |AB − AC|. Dans les deux cas, BC est déterminé par AB, AC et |Â|, donc BC = B'C'.</li><li>(CCC ⇒ CAC) Par III (d), être alignés se lit sur les trois longueurs. A'B'C' est donc dégénéré comme ABC, dans la même configuration, d'où |Â'| = |Â|.</li></ol>`},
 {id:"1.13",s:3,t:"Triangle équilatéral",
  en:"(1) ABC équilatéral ⇔ |Â| = |B̂| = |Ĉ|. (2) ABC équilatéral. (a) Déterminer |Â|. (b) A' ∈ [AB], B' ∈ [BC], C' ∈ [CA] avec AA' = BB' = CC' : montrer que A'B'C' est équilatéral. (c) K = (CA') ∩ (AB'), L = (AB') ∩ (BC'), M = (BC') ∩ (CA') : montrer que KLM est équilatéral.",
  idea:`(1) et (2a) : TD 1.7 deux fois, puis la somme des angles. (2b) et (2c) : ${hl("trois triangles isométriques par CAC")}, qui se déduisent l'un de l'autre en tournant.`,
  hint:"(b) Compare AA'C', BB'A' et CC'B'. (c) Compare CAA', ABB' et BCC', puis calcule l'angle AKC dans le triangle AKC.",
  sol:`<ol><li>(1) AB = AC ⇔ |B̂| = |Ĉ|, et BA = BC ⇔ |Â| = |Ĉ| (TD 1.7). D'où l'équivalence.</li><li>(2)(a) Les trois angles sont égaux et leur somme vaut π (Prop 2.4.2), donc |Â| = π/3.</li><li>(b) Soit a la longueur des côtés et x = AA' = BB' = CC'. Alors AC' = BA' = CB' = a − x. Les triangles AA'C', BB'A' et CC'B' ont deux côtés x et a − x, et entre eux un angle de π/3. Par CAC, ils sont isométriques, donc A'C' = B'A' = C'B'.</li><li>(c) CAA', ABB' et BCC' ont deux côtés a et x, et entre eux un angle de π/3 : ils sont isométriques (CAC). Notons θ = |${an("ACA'")}| = |${an("BAB'")}|.</li><li>Dans le triangle AKC : |${an("KAC")}| = |${an("B'AC")}| = π/3 − θ et |${an("KCA")}| = θ, donc |${an("AKC")}| = π − (π/3 − θ) − θ = 2π/3.</li><li>Sur la figure, [KL) est opposée à [KA) et [KM) est portée par [KC), donc l'angle de KLM en K vaut π − 2π/3 = π/3. De même en L et en M. Par (1), KLM est équilatéral.</li></ol>`},
 {id:"1.14",s:1,t:"Une droite est « comme ℝ »",
  en:"O ∈ Δ. Construire une bijection φ : ℝ → Δ qui préserve les distances : d(φ(λ), φ(μ)) = |λ − μ|.",
  idea:`Placer A<sub>λ</sub> avec l'${hl("axiome III (e)")} (un point de chaque côté de O), puis vérifier les distances avec ${hl("III (d)")}.`,
  hint:"Commence par les deux points A₁ et A₋₁ à distance 1 de O : O est leur milieu.",
  sol:`<ol><li>(1) III (e) donne exactement deux points A₁ et A₋₁ de Δ à distance 1 de O. Comme dans le lemme 2.2.1, III (d) donne A₁A₋₁ = 2.</li><li>(2) Pour λ &gt; 0, les deux points de Δ à distance λ de O sont à distance |λ − 1| et λ + 1 de A₁ (III d) : on les nomme A<sub>λ</sub> et A<sub>−λ</sub>.</li><li>(3)(4) φ(λ) = A<sub>λ</sub>, avec φ(0) = O, est une bijection, et on vérifie d(A<sub>λ</sub>, A<sub>μ</sub>) = |λ − μ| cas par cas avec III (d).</li></ol>Exercice long et technique : priorité basse pour le CC.`}
];

const ANN=[
 {src:"CC1 2025 · Cours (1) · 1 pt",t:"Donner la définition du segment [AB]",
  en:"Soient A et B deux points du plan. Le corrigé renvoie à la Déf 1.2.1.",
  sol:`[AB] est l'ensemble des points M du plan tels que ${hl("AM + MB = AB")}.`},
 {src:"CC1 2025 · Cours (2) · 2 pts",t:"Énoncer trois propriétés des symétries centrales",
  en:"Le corrigé renvoie au Thm 2.2.3.",
  sol:"<ol><li>s est une isométrie : elle est bijective et préserve les distances.</li><li>L'image d'une droite Δ est une droite parallèle à Δ (ou confondue).</li><li>s préserve les angles orientés.</li></ol>On peut aussi citer s∘s = id et s(O) = O."},
 {src:"CC1 2025 · Cours (3) · 4 pts",t:"Montrer la 1ʳᵉ égalité de Thalès (M ∈ ]AB], N ∈ ]AC])",
  en:"ABC non dégénéré, (MN) // (BC). Montrer AM/AB = AN/AC. Le corrigé renvoie au Thm 2.5.1 : c'est la démo du poly, la plus grosse question du sujet.",go:"demo-2-5-1"},
 {src:"CC1 2025 · Ex. 1 · 3 pts",t:"Bissectrices perpendiculaires",
  en:"O, A, B, C distincts, O ∈ [AB], C ∉ (AB). Montrer que les bissectrices des angles {[OA),[OC)} et {[OB),[OC)} sont perpendiculaires.",
  hint:"Pas besoin d'angles orientés. [OA) et [OB) sont opposées, et [OC) est entre les deux.",
  sol:`<ol><li>Soit [OE) la bissectrice de {[OA),[OC)} et [OF) celle de {[OB),[OC)}. Par définition, |${an("AOE")}| = |${an("EOC")}| = |${an("AOC")}|/2 et |${an("COF")}| = |${an("FOB")}| = |${an("COB")}|/2.</li><li>O ∈ ]AB[ car les points sont distincts, donc [OA) et [OB) sont opposées : |${an("AOB")}| = π (axiome IV c). Et |${an("AOC")}| + |${an("COB")}| = |${an("AOB")}| = π, car [AB] ∩ [OC) contient O (remarque du §1.3).</li><li>|${an("EOF")}| = |${an("EOC")}| + |${an("COF")}| = ½ (|${an("AOC")}| + |${an("COB")}|) = π/2.</li><li>Donc (OE) ⊥ (OF).</li></ol>`},
 {src:"CC1 2025 · Ex. 2 · 2 pts",t:"Hauteurs égales ⇒ isocèle",
  en:"ABC non dégénéré, H_B et H_C pieds des hauteurs issues de B et C, BH_B = CH_C. Montrer que ABC est isocèle en A.",
  hint:"Écris l'aire de ABC de deux façons (Prop 2.4.1).",
  sol:"<ol><li>La formule de l'aire (Prop 2.4.1), avec la hauteur issue de B puis celle issue de C : 𝒜(ABC) = ½ BH<sub>B</sub> × AC = ½ CH<sub>C</sub> × AB.</li><li>BH<sub>B</sub> = CH<sub>C</sub>, et cette longueur est non nulle, sinon le triangle serait dégénéré.</li><li>On simplifie : AC = AB, donc ABC est isocèle en A.</li></ol>"},
 {src:"CC1 2025 · Ex. 3 · 8 pts (1 + 3 + 2 + 2)",t:"Carrés construits sur les côtés",
  en:"Carrés BAMN et ACRS construits à l'extérieur de ABC. O, I, O' milieux de [MB], [BC], [CS]. (1) Faire une figure. (2) AMC et ABS sont isométriques. (3) (OI) // (MC) et (O'I) // (BS). (4) OI = O'I.",
  hint:"(2) CAC en A, avec des angles non orientés. (3) Théorème des milieux dans les triangles BMC et CBS. (4) Combine (2) et (3).",
  sol:`<ol><li>(1) 1 pt pour la figure.</li><li>(2) AM = AB (BAMN est un carré) et AC = AS (ACRS est un carré). De plus |${an("MAC")}| = |${an("MAB")}| + |${an("BAC")}| = π/2 + |${an("BAC")}| et |${an("BAS")}| = |${an("BAC")}| + |${an("CAS")}| = |${an("BAC")}| + π/2. Donc |${an("MAC")}| = |${an("BAS")}|, et AMC et ABS sont isométriques (CAC).</li><li>(3) O est le milieu de [MB] et I celui de [BC]. Le théorème des milieux dans le triangle BMC donne (OI) // (MC). De même, dans le triangle CBS, O' et I sont les milieux de [CS] et [CB], donc (O'I) // (BS).</li><li>(4) Le même théorème donne OI = ½ MC et O'I = ½ BS. D'après (2), MC = BS. Donc OI = O'I.</li></ol>`},
 {src:"CC1 2024 · Cours (a) · 2 pts",t:"Énoncer le théorème de Thalès",
  en:"Le corrigé donne l'énoncé attendu et deux erreurs à éviter.",
  sol:`Soit ABC un triangle non dégénéré, M ∈ (AB) et N ∈ (AC). Si (MN) // (BC), alors ${hl("AM/AB = AN/AC = MN/BC")}.<br><br>Le corrigé précise : avec M ∈ [AB], l'énoncé est incomplet, et écrire [AM]/[AB] = [AN]/[AC] est une faute grave.`},
 {src:"CC1 2024 · Cours (b) et (c) · 3 + 1 pts",t:"Démontrer la réciproque de Thalès, puis la nommer",
  en:"M ∈ [AB), N ∈ [AC), AM/AB = AN/AC. Démontrer que (MN) // (BC). (c) Quel résultat du cours a-t-on démontré ? Réponse : la réciproque du théorème de Thalès. Le corrigé insiste : il faut donner la preuve, pas citer la réciproque.",go:"demo-2-5-2"},
 {src:"CC1 2024 · Ex. 2 · 14 pts",t:"Parallélogramme ⇔ angles opposés égaux",
  en:"(a) Parallélogramme ⇒ |ABC| = |CDA|. (b) ABCD convexe (diagonales sécantes en I) : la somme des angles vaut 2π. (c) Si les angles opposés sont égaux : (i) |ABC| + |BCD| = π ; (ii) figure avec E ∈ (AB) hors de [BA) ; (iii) |ABC| + |CBE| = π ; (iv) (AB) // (CD). (d) Synthèse.",
  hint:"(a) CCC. (b) Découpe par la diagonale [AC] et additionne les angles des deux triangles. (c)(iv) Angles alternes-internes avec la sécante (BC).",

function bugHunt(host){
  let k=0,sel=new Set(),checked=false;
  host.innerHTML=`<div class="widget"><div class="w-ctrl"><select data-k aria-label="Choisir l'algorithme">${BUGS.map((b,i)=>`<option value="${i}">Algorithme ${i+1} : ${b.t}</option>`).join("")}</select></div><p class="muted bh-help" style="margin:0"></p><div class="bugs"></div><div class="w-ctrl"><button class="btn pri" data-a="check">Vérifier</button><button class="btn" data-a="reset">Recommencer</button></div><div class="w-note"></div></div>`;
  const q=s=>host.querySelector(s);
  /* une erreur = un message + les lignes où on peut la voir (une ligne qui manque se voit juste avant, ou là où elle aurait servi) */
  const errsOf=B=>Object.entries(B.bad).map(([m,msg])=>{const main=+m,alt=Object.keys(B.alias||{}).filter(a=>B.alias[a]===main).map(Number);return {main,lines:[main,...alt].sort((a,b)=>a-b),msg};}).sort((a,b)=>a.lines[0]-b.lines[0]);
  const L=a=>a.length===1?`Ligne ${a[0]+1}`:`Lignes ${a.slice(0,-1).map(x=>x+1).join(", ")} et ${a[a.length-1]+1}`;
  function draw(){const B=BUGS[k],E=errsOf(B),nb=E.length,two=E.some(e=>e.lines.length>1);
    const errOfLine=i=>E.find(e=>e.lines.includes(i));
    const found=E.filter(e=>e.lines.some(i=>sel.has(i))),wrong=[...sel].filter(i=>!errOfLine(i)),dbl=E.filter(e=>e.lines.filter(i=>sel.has(i)).length>1);
    q(".bh-help").textContent=`Il y a ${nb} erreur${nb>1?"s":""}. Clique sur la ligne de chaque erreur, puis sur « Vérifier ».${two?" Une ligne qui manque se signale sur la ligne juste avant le trou ou sur celle qui en a besoin : une seule des deux suffit.":""}`;
    q(".bugs").innerHTML=B.L.map((l,i)=>{let c="";if(checked){const e=errOfLine(i);if(sel.has(i))c=e?"good":"bad";else if(e&&!found.includes(e)&&e.main===i)c="miss";}return `<button data-l="${i}" aria-pressed="${sel.has(i)}" class="${c}"><span class="muted" style="user-select:none">${String(i+1).padStart(2," ")}  </span>${esc(l)}</button>`;}).join("");
    q(".w-note").innerHTML=checked?`<div class="verdict ${found.length===nb&&!wrong.length?"ok":"info"}">${found.length} erreur${found.length>1?"s":""} trouvée${found.length>1?"s":""} sur ${nb}.${wrong.length?` ${wrong.length} ligne${wrong.length>1?"s":""} correcte${wrong.length>1?"s":""} marquée${wrong.length>1?"s":""} à tort, en rouge (${wrong.map(i=>i+1).join(", ")}).`:""}${found.length<nb?" Les erreurs oubliées sont en pointillés.":""}${dbl.map(e=>` Tu as marqué ${L(e.lines.filter(i=>sel.has(i))).toLowerCase()} : c'est la même erreur, comptée une fois.`).join("")}</div><ul>${E.map(e=>`<li><b>${L(e.lines)}</b> : ${e.msg}</li>`).join("")}</ul><p class="muted" style="margin:0">La version corrigée :</p>${C(B.fix)}`:"";}
  host.addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(b&&!checked){const i=+b.dataset.l;if(sel.has(i))sel.delete(i);else sel.add(i);draw();return;}const a=e.target.closest("[data-a]")?.dataset.a;if(a==="check"){checked=true;draw();}if(a==="reset"){sel.clear();checked=false;draw();}});
  host.addEventListener("change",e=>{if(e.target.matches("[data-k]")){k=+e.target.value;sel.clear();checked=false;draw();}});
  draw();
}
